// Apply theme: mutate window.P in place + swap SHARED_STATUS_LIGHT.
// (The status-pill map is named LIGHT historically — we swap its contents
// so every Pill component reading window.SHARED_STATUS_LIGHT[status] picks up the change.)
window.applyTheme = function(themeName){
  const t = window.THEMES[themeName] || window.THEMES.light;
  // Clear then repopulate P so consumers with cached references pick up new values.
  for (const k in window.P) delete window.P[k];
  Object.assign(window.P, t);
  // Swap status pill map
  const statusMap = themeName === 'dark' ? window.SHARED_STATUS_DARK : window.SHARED_STATUS_LIGHT_BACKUP;
  for (const k in window.SHARED_STATUS_LIGHT) delete window.SHARED_STATUS_LIGHT[k];
  Object.assign(window.SHARED_STATUS_LIGHT, statusMap);
  // Repaint body bg so the behind-app viewport also matches
  if (typeof document !== 'undefined') {
    document.body.style.background = t.bg;
    document.body.style.color = t.text;
  }
  window.__currentTheme = themeName;
};

    const wStart = 60 + Math.floor(rnd()*45);
    const delta = Math.floor(rnd()*10) - 6;
    extra.push({

// ────────────────────────────────────────────────
// === DATA LAYER ===
// Persistence + pay rules layer (Tier 1 / Foundation).
// All new state-mutating helpers live below this line. UI-tier files attach
// listeners via window.registerDpListener() and call window.updateClient()
// to mutate clients[] — this block owns the localStorage round-trip.
// ────────────────────────────────────────────────

// 1. Status code alignment
window.STATUS_CODES = {
  Sent:        'S',
  Submitted:   'Y',
  Due:         'D',
  Missed:      'M',
  Messaged:    'MS',
  SendMessage: 'SM',
  Ghosted:     'G',
  Paused:      'P',
  Cancelled:   'C',
};
window.statusCode = function(status) {
  return window.STATUS_CODES[status] || '';
};

// 2. clients[] alias — the spec talks in terms of `clients`; preserve the
// historical SHARED_CLIENTS name and just expose a second reference.
window.clients = window.SHARED_CLIENTS;

// ────────────────────────────────────────────────
// 4. localStorage helpers — defined BEFORE updateClient so the latter can
// freely call them. All reads are wrapped in try/catch with sensible defaults.
// ────────────────────────────────────────────────
window.LS_KEYS = {
  clientData:        'ci2_client_data',
  auditData:         'dp_audit_data',
  onboardingPaid:    'dp_onboarding_paid',
  payShowCancelled:  'payShowCancelled',
  payLogShowCancelled:'payLogShowCancelled',
};

// Sparse fields we round-trip per client. Anything not in this list is
// treated as static seed data and never written to localStorage.
window.CI2_TRACKED_FIELDS = ['status','transPhoto','postApproval','progressRating','lastProgramDate','notes','loomUrl'];

window.saveAllData = function() {
  try {
    const out = {};
    const list = window.clients || [];
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      const slice = {};
      let has = false;
      for (const f of window.CI2_TRACKED_FIELDS) {
        if (Object.prototype.hasOwnProperty.call(c, f)) {
          slice[f] = c[f];
          has = true;
        }
      }
      if (has) out[c.name] = slice;
    }
    localStorage.setItem(window.LS_KEYS.clientData, JSON.stringify(out));
  } catch (e) { console.error('saveAllData', e); }
};

window.ci2RestoreData = function() {
  try {
    const raw = localStorage.getItem(window.LS_KEYS.clientData);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return;
    const list = window.clients || [];
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      const slice = parsed[c.name];
      if (!slice) continue;
      for (const f of window.CI2_TRACKED_FIELDS) {
        if (Object.prototype.hasOwnProperty.call(slice, f)) {
          c[f] = slice[f];
        }
      }
    }
  } catch (e) { console.error('ci2RestoreData', e); }
};

window.loadAuditData = function() {
  try {
    const raw = localStorage.getItem(window.LS_KEYS.auditData);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === 'object') ? parsed : {};
  } catch (e) { console.error('loadAuditData', e); return {}; }
};
window.saveAuditData = function(data) {
  try {
    localStorage.setItem(window.LS_KEYS.auditData, JSON.stringify(data || {}));
  } catch (e) { console.error('saveAuditData', e); }
};

window.loadOnboardingPaid = function() {
  try {
    const raw = localStorage.getItem(window.LS_KEYS.onboardingPaid);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === 'object') ? parsed : {};
  } catch (e) { console.error('loadOnboardingPaid', e); return {}; }
};
window.saveOnboardingPaid = function(data) {
  try {
    localStorage.setItem(window.LS_KEYS.onboardingPaid, JSON.stringify(data || {}));
  } catch (e) { console.error('saveOnboardingPaid', e); }
};

window.getPayShowCancelled = function() {
  try { return localStorage.getItem(window.LS_KEYS.payShowCancelled) === '1'; }
  catch (e) { return false; }
};
window.setPayShowCancelled = function(bool) {
  try { localStorage.setItem(window.LS_KEYS.payShowCancelled, bool ? '1' : '0'); }
  catch (e) { console.error('setPayShowCancelled', e); }
};
window.getPayLogShowCancelled = function() {
  try { return localStorage.getItem(window.LS_KEYS.payLogShowCancelled) === '1'; }
  catch (e) { return false; }
};
window.setPayLogShowCancelled = function(bool) {
  try { localStorage.setItem(window.LS_KEYS.payLogShowCancelled, bool ? '1' : '0'); }
  catch (e) { console.error('setPayLogShowCancelled', e); }
};

// ────────────────────────────────────────────────
// 5. View refresh registry — UI-tier components register a re-render fn,
// data-layer mutators broadcast on change.
// ────────────────────────────────────────────────
window._dpListeners = window._dpListeners || new Set();
window.registerDpListener = function(fn) {
  window._dpListeners.add(fn);
  return () => window._dpListeners.delete(fn);
};
window.refreshVisibleViews = function() {
  window._dpListeners.forEach(fn => {
    try { fn(); } catch (e) { console.error('dpListener', e); }
  });
};

// ────────────────────────────────────────────────
// 3. updateClient — the single mutation entry point.
// ────────────────────────────────────────────────
window.updateClient = function(clientName, field, value) {
  const idx = (window.clients || []).findIndex(c => c.name === clientName);
  if (idx === -1) return;
  const prev = window.clients[idx][field];
  window.clients[idx][field] = value;

  // If status changed, also write to the current week history slot.
  if (field === 'status') {
    const code = window.statusCode(value);
    if (window.SHARED_HISTORY && window.SHARED_HISTORY[clientName]) {
      const hist = window.SHARED_HISTORY[clientName];
      hist[hist.length - 1] = code;
    }
  }

  // Onboarding bonus trigger: first time lastProgramDate is set
  if (field === 'lastProgramDate' && value && !prev) {
    const paid = window.loadOnboardingPaid();
    if (!paid[clientName]) {
      paid[clientName] = true;
      window.saveOnboardingPaid(paid);
      try {
        window.dispatchEvent(new CustomEvent('dp:onboarding-bonus', { detail: { clientName } }));
      } catch (e) { console.error('dispatch onboarding-bonus', e); }
    }
  }

  window.saveAllData();
  window.refreshVisibleViews();
};

// ────────────────────────────────────────────────
// 6. Pay rules engine — single source of truth for My Pay + Pay Log.
// ────────────────────────────────────────────────
// History codes used in this prototype don't 1:1 match STATUS_CODES (e.g. SU
// for Submitted, SE for Sent, MI for Missed, DU for Due) — keep both maps so
// we can decode either flavor. Already exposed as window.CODE_TO_STATUS above.
window._codeToStatusPay = {
  // Spec single-letter codes
  S:'Sent', Y:'Submitted', D:'Due', M:'Missed', MS:'Messaged', SM:'SendMessage',
  G:'Ghosted', P:'Paused', C:'Cancelled',
  // Legacy two-letter codes already in SHARED_HISTORY
  SU:'Submitted', SE:'Sent', DU:'Due', MI:'Missed',
};

window.computeWeekPay = function(client, weekIndex) {
  const histArr = (client && client.history) || (window.SHARED_HISTORY && window.SHARED_HISTORY[client && client.name]) || [];
  const rawStatus = histArr[weekIndex] != null ? histArr[weekIndex] : (client && client.status);
  const rate = client && client.plan === 'F' ? 15 : 25;
  const name = window._codeToStatusPay[rawStatus] || rawStatus;

  if (name === 'Sent' || name === 'Messaged' || name === 'Missed') {
    return { amount: rate, reason: 'full' };
  }
  if (name === 'Submitted') {
    // Per spec: Submitted means the client check-in is in but the coach hasn't
    // sent the response yet. No pay until the coach sends (status -> Sent).
    return { amount: 0, reason: 'action-pending' };
  }
  if (name === 'Ghosted') {
    let consec = 0;
    for (let i = weekIndex; i >= 0; i--) {
      const s = window._codeToStatusPay[histArr[i]] || histArr[i];
      if (s === 'Ghosted') consec++;
      else break;
    }
    if (consec <= 2) return { amount: rate * 0.5, reason: 'ghosted-50' };
    return { amount: 0, reason: 'ghosted-zero' };
  }
  if (name === 'Paused')    return { amount: 0, reason: 'paused' };
  if (name === 'Cancelled') return { amount: 0, reason: 'cancelled' };
  if (name === 'Due' || name === 'SendMessage') {
    return { amount: 0, reason: 'action-pending' };
  }
  return { amount: 0, reason: 'action-pending' };
};

window.computeOnboardingBonus = function(client) {
  if (!client) return 0;
  const paid = window.loadOnboardingPaid();
  return paid[client.name] ? 50 : 0;
};

// $50 per 10 active weeks completed.
window.computeRetentionBonus = function(client) {
  if (!client) return 0;
  const w = typeof client.week === 'number' ? client.week : 0;
  return Math.floor(w / 10) * 50;
};

// Clients within 4 weeks of their next $50 retention milestone.
window.computePendingRetentionBonuses = function() {
  const list = (window.clients || []).filter(c => {
    const w = typeof c.week === 'number' ? c.week : 0;
    if (c.status === 'Paused' || c.status === 'Cancelled') return false;
    const toNext = 10 - (w % 10);
    return toNext > 0 && toNext <= 4;
  });
  return { count: list.length, value: list.length * 50 };
};

// ────────────────────────────────────────────────
// 7. Page-load wiring — restore persisted edits onto the seed clients[].
// ────────────────────────────────────────────────
if (typeof window !== 'undefined') {
  try { window.ci2RestoreData(); } catch (e) { console.error(e); }
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-source="view-client-detail.jsx">
// Client Detail drawer — slide-over from the right.
// Tabs: Check-ins (timeline), Messages, Goals, Notes.
// Loaded by portal-app.jsx; exposes window.ClientDetail.

(function(){
  const { useState, useRef, useEffect } = React;
  const P = window.P, Icon = window.Icon, ICONS = window.ICONS,
        Avatar = window.Avatar, Pill = window.Pill;

  // ───────────────────────────────────────────
  // Synthetic per-client detail data (deterministic by name)
  // ───────────────────────────────────────────
  function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }

  function buildCheckins(client){
    const h = hash(client.name);
    const dates = ['27 Apr','20 Apr','13 Apr','6 Apr','30 Mar','23 Mar'];
    const moods = ['Great','Good','Average','Poor'];
    const wins = [
      'Hit all 5 training sessions this week.',
      'First time squatting 80kg for reps — felt strong.',
      'Slept 7h+ every night, huge mood shift.',
      'Meal prepped Sunday, stayed on plan all week.',
      'Down 1.2kg and clothes fitting better.',
      'Pushed through a really stressful work week without skipping.',
    ];
    const challenges = [
      'Work travel Wed–Fri made food choices hard.',
      'Shoulder a bit cranky on pressing days.',
      'Energy lower on the lower-carb days.',
      'Social event Saturday — had a few drinks.',
      'Sleep was broken, kids were sick.',
      'Felt really hungry mid-afternoon again.',
    ];
    return dates.map((d,i)=>{
      const kept = (h+i)%7 !== 0;
      const weightChange = ((h+i*7)%20 - 10)/10; // -1 to +1
      return {
        date: d,
        submitted: kept,
        mood: moods[(h+i)%moods.length],
        weight: (client.weight.start + weightChange*(i+1) - i*0.4).toFixed(1),
        adherence: 60 + ((h+i*3)%40),
        win: wins[(h+i)%wins.length],
        challenge: challenges[(h+i*2)%challenges.length],
        coachReply: i%2===0 ? null : {
          time: '2h later',
          text: i===1
            ? 'Awesome work this week. Let\'s keep carbs as-is and add 10min of Zone 2 on your off-days. Check-in next Sunday 👊'
            : 'Proud of you pushing through. Swap the overhead press for landmine press this week to settle the shoulder. Same load.',
        },
      };
    });
  }

  function buildMessages(client){
    const h = hash(client.name);
    return [
      {t:'9:42am',from:'client',text:'Morning! Quick one — is it ok to swap Tuesday legs to Wednesday this week? Got a work thing.'},
      {t:'10:15am',from:'coach',text:'All good. Just don\'t stack it next to your Thursday session, push it to Wed AM if you can.'},
      {t:'10:16am',from:'client',text:'👍 will do'},
      {t:'2:30pm',from:'client',text:'Also — gym was out of the protein I usually get. Grabbed the chocolate one, is that fine?'},
      {t:'2:48pm',from:'coach',text:'Yep totally fine. Any whey isolate works.'},
      {t:h%2?'Yesterday 6:12pm':'Yesterday 8:40am',from:'client',text:'Check-in is in! Had a really good week 😊'},
      {t:'Yesterday 9:04pm',from:'coach',text:'Saw it — replying properly tomorrow morning ❤️'},
    ];
  }

  function buildGoals(client){
    const h = hash(client.name);
    const primary = h%3===0 ? 'Build muscle + gain strength' : h%3===1 ? 'Lose 10kg sustainably' : 'Get leaner for wedding in October';
    return {
      primary,
      deadline: h%3===2 ? '12 Oct 2026' : 'Ongoing',
      startWeight: client.weight.start,
      currentWeight: client.weight.current,
      targetWeight: h%3===1 ? client.weight.start - 10 : client.weight.start - 4,
      milestones: [
        {label:'Complete 4-week onboarding block', done:true, date:'3 Feb'},
        {label:'First full week of 4 sessions', done:true, date:'17 Feb'},
        {label:'Down 3kg from start', done: client.weight.current <= client.weight.start-3, date: client.weight.current <= client.weight.start-3 ? '24 Mar' : null},
        {label:'Hit 8-week transformation photo', done:client.transPhoto, date:client.transPhoto?'6 Apr':null},
        {label:'Reach target weight', done:false, date:null},
      ],
    };
  }

  function buildNotes(client){
    const h = hash(client.name);
    return [
      {date:'24 Apr', text:'Travels a lot for work. Pre-send travel-friendly meal options before Mondays.'},
      {date:'8 Apr', text:'Mentioned knee niggle on lunges — keep volume lower until reassess in 2 weeks.'},
      {date:h%2?'2 Apr':'28 Mar', text:'Motivated by process, not outcome. Lead with effort + adherence in replies, weight second.'},
      {date:'15 Feb', text:'Prefers longer voice-note replies over text. Send Looms weekly.'},
    ];
  }

  // ───────────────────────────────────────────
  // UI bits
  // ───────────────────────────────────────────
  const moodColor = {Great:P.positive, Good:P.positive, Average:P.warn, Poor:P.danger};

  function TabHeader({tabs, active, onChange, counts}) {
    return (
      <div style={{display:'flex',gap:2,padding:'0 24px',borderBottom:`1px solid ${P.borderSoft}`,background:P.panel}}>
        {tabs.map(t=>{
          const on = t.id===active;

              {counts && counts[t.id]!=null && (
                <span style={{
                  fontSize:10,fontWeight:600,padding:'1px 6px',borderRadius:100,

              )}
            </button>
          );
        })}
      </div>
    );
  }

  // Check-ins — numbered chronological list (oldest top, newest bottom)
  const SUMMARY_TEMPLATES = [
    'Submitted on {day}, weight steady, mood good.',
    'Checked in {day} — adherence dipped midweek but recovered.',
    'Logged {day}. Strong sleep and training week, energy high.',
    'On time {day}. Weight ticked down slightly, nutrition on point.',
    'Submitted {day}. Reported a busy work week, stayed mostly on plan.',
    'Checked in {day} — small bump in weight, flagged stress and short sleep.',
    'Logged {day}. Big training PR, mood great, food dialled.',
    'On {day}. Travel disrupted meals but training stayed consistent.',
    'Submitted {day}. Cravings up, asked about a refeed day.',
    'Checked in {day} — clothes fitting better, photos showing progress.',
  ];
  function summaryFor(name, weekIdx, dayLabel){
    const h = hash(name + ':' + weekIdx);
    const t = SUMMARY_TEMPLATES[h % SUMMARY_TEMPLATES.length];
    return t.replace('{day}', dayLabel || 'Mon');
  }
  const STATUS_LETTER = {Submitted:'S',Yellow:'Y',Doing:'D',Missed:'M'};
  function statusForWeek(name, weekIdx){
    const h = hash(name + '|status|' + weekIdx);
    const opts = ['S','Y','D','M'];
    // Bias toward S
    const r = h % 10;
    if (r < 6) return 'S';
    if (r < 8) return 'Y';
    if (r < 9) return 'D';
    return 'M';
  }
  const STATUS_COLORS = {
    S:{bg:P.positiveSoft,fg:P.positive,label:'Submitted'},
    Y:{bg:P.warnSoft,fg:P.warn,label:'Yellow'},
    D:{bg:P.accentSoft,fg:P.accentDeep,label:'Doing'},
    M:{bg:P.dangerSoft,fg:P.danger,label:'Missed'},
  };

  function CheckinsTab({client}){
    const history = (window.SHARED_HISTORY && window.SHARED_HISTORY[client.name]) || [];
    const sharedDates = window.SHARED_DATES || [];
    const count = history.length;
    const day = client.day || 'Mon';

    if (count === 0) {
      return (
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:P.textMuted,fontSize:13,padding:'40px 28px'}}>
          No check-ins yet.
        </div>
      );
    }

    // Build oldest-first list. history is assumed newest-first; reverse for display.
    const items = [];
    for (let i = 0; i < count; i++) {
      const reverseIdx = count - 1 - i; // index into newest-first arrays
      const dateLabel = sharedDates[reverseIdx] || `Week ${i+1}`;
      const weekNumber = i + 1;
      const code = statusForWeek(client.name, weekNumber);
      items.push({
        n: weekNumber,
        date: dateLabel,
        code,
        summary: summaryFor(client.name, weekNumber, day),

    }

    return (
      <div style={{padding:'20px 28px',overflowY:'auto',flex:1}}>

          <span>Past check-ins</span>
          <span style={{color:P.textDim,textTransform:'none',letterSpacing:0,fontSize:11.5,fontWeight:500}}>Oldest first · scroll for newest</span>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {items.map((it)=>{
            const sc = STATUS_COLORS[it.code] || STATUS_COLORS.S;

              <div key={it.n} style={{
                background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:12,

              }}>
                <div style={{
                  fontSize:11,color:P.textMuted,fontWeight:700,
                  minWidth:62,paddingTop:2,letterSpacing:'.04em',textTransform:'uppercase',
                }}>Check-in<br/><span style={{fontSize:18,color:P.text,fontWeight:700,letterSpacing:0}}>{it.n}</span></div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,flexWrap:'wrap'}}>
                    <span style={{fontSize:12.5,color:P.text,fontWeight:600}}>{it.date}</span>
                    <span style={{
                      fontSize:10.5,fontWeight:700,padding:'2px 8px',borderRadius:100,
                      background:sc.bg,color:sc.fg,letterSpacing:'.04em',
                    }}>{it.code} · {sc.label}</span>
                  </div>
                  <div style={{fontSize:12.5,color:P.textDim,lineHeight:1.5}}>{it.summary}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // Messages
  function MessagesTab({client}){
    const msgs = buildMessages(client);
    const scrollRef = useRef(null);
    useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; },[]);
    return (
      <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
        <div ref={scrollRef} style={{flex:1,overflowY:'auto',padding:'20px 28px',display:'flex',flexDirection:'column',gap:8}}>
          {msgs.map((m,i)=>{
            const coach = m.from==='coach';
            const showTime = i===0 || msgs[i-1].t!==m.t;
            return (
              <React.Fragment key={i}>
                {showTime && <div style={{textAlign:'center',fontSize:10.5,color:P.textMuted,margin:'8px 0 4px'}}>{m.t}</div>}
                <div style={{alignSelf:coach?'flex-end':'flex-start',maxWidth:'78%',display:'flex',gap:8,alignItems:'flex-end',flexDirection:coach?'row-reverse':'row'}}>
                  {!coach && <Avatar name={client.name} size={22}/>}
                  <div style={{
                    padding:'9px 13px',borderRadius:14,
                    background:coach?P.accent:P.panel,
                    color:coach?'#fff':P.text,
                    border:coach?'none':`1px solid ${P.borderSoft}`,
                    fontSize:13,lineHeight:1.45,
                    borderBottomRightRadius:coach?4:14,
                    borderBottomLeftRadius:coach?14:4,
                  }}>{m.text}</div>
                </div>
              </React.Fragment>
            );
          })}
        </div>
        <div style={{borderTop:`1px solid ${P.borderSoft}`,padding:'12px 20px',background:P.panel,display:'flex',alignItems:'flex-end',gap:10}}>
          <button style={{background:'transparent',border:'none',color:P.textDim,cursor:'pointer',padding:6,display:'flex'}}><Icon d={ICONS.paperclip} size={17}/></button>
          <div style={{flex:1,background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:10,padding:'9px 12px',fontSize:13,color:P.textMuted}}>Message {client.name.split(' ')[0]}…</div>
          <button style={{background:P.accent,color:'#fff',border:'none',borderRadius:10,width:38,height:38,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon d={ICONS.send} size={16}/></button>
        </div>
      </div>
    );
  }

  // Goals
  function GoalsTab({client}){
    const g = buildGoals(client);
    const done = g.milestones.filter(m=>m.done).length;
    const progressPct = Math.max(0, Math.min(100,
      ((g.startWeight - g.currentWeight) / (g.startWeight - g.targetWeight)) * 100
    ));
    return (
      <div style={{padding:'20px 28px',overflowY:'auto',flex:1}}>
        {/* Primary goal */}
        <div style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:12,padding:'18px 20px',marginBottom:18}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:8,background:P.accentSoft,color:P.accentDeep,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <Icon d={ICONS.target} size={17}/>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10.5,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,marginBottom:3}}>Primary goal</div>
              <div style={{fontSize:15,fontWeight:600,color:P.text}}>{g.primary}</div>
              <div style={{fontSize:11.5,color:P.textDim,marginTop:3}}>Deadline: {g.deadline}</div>
            </div>
          </div>

          <div style={{marginTop:8}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11.5,color:P.textDim,marginBottom:6}}>
              <span>{g.startWeight}kg start</span>
              <span style={{fontWeight:600,color:P.text}}>{g.currentWeight}kg now</span>
              <span>{g.targetWeight}kg target</span>
            </div>
            <div style={{height:6,borderRadius:3,background:P.panel2,position:'relative',overflow:'hidden'}}>
              <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${progressPct}%`,background:`linear-gradient(90deg, ${P.accent}, ${P.positive})`,borderRadius:3}}/>
            </div>
            <div style={{fontSize:11.5,color:P.textDim,marginTop:8,textAlign:'center'}}>
              <b style={{color:P.text,fontWeight:600}}>{Math.round(progressPct)}%</b> toward target · <b style={{color:P.text,fontWeight:600}}>{(g.startWeight - g.currentWeight).toFixed(1)}kg</b> lost
            </div>
          </div>
        </div>

        {/* Milestones */}
        <div style={{fontSize:11,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,marginBottom:12,display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
          <span>Milestones</span>
          <span style={{color:P.textDim,textTransform:'none',letterSpacing:0,fontSize:11.5,fontWeight:500}}>{done} of {g.milestones.length} complete</span>
        </div>
        <div style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:12,overflow:'hidden'}}>
          {g.milestones.map((m,i)=>(
            <div key={i} style={{
              display:'flex',alignItems:'center',gap:12,padding:'13px 18px',
              borderBottom:i<g.milestones.length-1?`1px solid ${P.borderSoft}`:'none',
            }}>
              <div style={{
                width:22,height:22,borderRadius:'50%',flexShrink:0,
                background: m.done?P.positive:P.panel2,
                border: m.done?'none':`1.5px solid ${P.border}`,
                color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',
              }}>
                {m.done && <Icon d={ICONS.check} size={12}/>}
              </div>
              <div style={{flex:1,fontSize:13,color:m.done?P.textDim:P.text,textDecoration:m.done?'line-through':'none'}}>{m.label}</div>
              {m.date && <div style={{fontSize:11.5,color:P.textMuted}}>{m.date}</div>}
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Notes — editable, auto-saving. The single home for client notes.
  function NotesTab({client}){
    const [draft, setDraft] = useState(client.notes || '');
    const [savedAt, setSavedAt] = useState(null);
    const debounceRef = useRef(null);
    useEffect(()=>{ setDraft(client.notes || ''); }, [client.name]);
    const save = (val) => {
      window.updateClient(client.name, 'notes', val);
      const t = new Date();
      setSavedAt(t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
    };
    const onChange = (val) => {
      setDraft(val);
      if (debounceRef.current) clearTimeout(debounceRef.current);
      debounceRef.current = setTimeout(()=>save(val), 800);
    };
    return (
      <div style={{padding:'20px 28px',overflowY:'auto',flex:1,display:'flex',flexDirection:'column'}}>
        <div style={{background:'#fffcef',border:`1px solid #fde68a`,borderRadius:10,padding:'10px 14px',fontSize:11.5,color:'#92400e',marginBottom:16,display:'flex',alignItems:'center',gap:8}}>
          <span style={{display:'flex'}}><Icon d={ICONS.eye} size={13}/></span>
          Private — only you and other coaches can see these notes.
        </div>
        <div style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,padding:18,flex:1,display:'flex',flexDirection:'column'}}>
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:8}}>
            <div style={{fontSize:11,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600}}>Coaching notes</div>
            {savedAt && <div style={{fontSize:10.5,color:P.textMuted}}>Saved {savedAt}</div>}
          </div>
          <textarea
            value={draft}
            onChange={e=>onChange(e.target.value)}
            onBlur={e=>save(e.target.value)}
            placeholder="Add private coaching notes…"
            style={{
              flex:1,minHeight:240,resize:'vertical',
              background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:10,
              padding:'10px 12px',fontSize:13,color:P.text,fontFamily:'inherit',outline:'none',
              lineHeight:1.5,
            }}/>
        </div>
      </div>
    );
  }

  // ───────────────────────────────────────────
  // Overview tab
  // ───────────────────────────────────────────
  function addDays(dateStr, days){
    if (!dateStr) return null;
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return null;
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,10);
  }
  function daysBetween(dateStr){
    if (!dateStr) return null;
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return null;
    const now = new Date();
    return Math.floor((now - d) / (1000*60*60*24));
  }

  function OverviewTab({client}){
    const [, force] = useState(0);
    useEffect(() => window.registerDpListener(() => force(n => n + 1)), []);

    const [loomDraft, setLoomDraft] = useState(client.loomUrl || '');

    // Keep drafts in sync when client changes
    useEffect(()=>{ setLoomDraft(client.loomUrl || ''); }, [client.name]);

    const planLabel = client.plan === 'F' ? 'fortnightly' : 'weekly';
    const snapshot = `Started ${client.startDate}. Currently on ${planLabel} plan, week ${client.week}. Status: ${client.status}. Last check-in: ${client.lastCheckin}. Streak: ${client.streak} weeks.`;

    const lpd = client.lastProgramDate;
    const daysSince = daysBetween(lpd);
    const next = lpd ? addDays(lpd, 28) : null;
    let pillLabel = null, pillBg = P.panel2, pillFg = P.textDim;
    if (daysSince !== null) {
      if (daysSince <= 21) { pillLabel = 'On time'; pillBg = P.positiveSoft; pillFg = P.positive; }
      else if (daysSince <= 28) { pillLabel = 'Due soon'; pillBg = P.warnSoft; pillFg = P.warn; }
      else { pillLabel = 'Overdue'; pillBg = P.dangerSoft; pillFg = P.danger; }
    }

    const Toggle = ({label, field, value, options}) => (
      <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:10}}>
        <div style={{fontSize:12,color:P.textDim,minWidth:160,fontWeight:500}}>{label}</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {options.map(opt=>{
            const on = opt.value === value;
            return (
              <button key={String(opt.value)} onClick={()=>window.updateClient(client.name, field, opt.value)} style={{
                appearance:'none',border:`1px solid ${on?P.accent:P.borderSoft}`,
                background: on ? P.accent : P.panel3,
                color: on ? '#fff' : P.textDim,
                padding:'5px 12px',borderRadius:100,fontSize:11.5,fontWeight:600,
                cursor:'pointer',fontFamily:'inherit',
              }}>{opt.label}</button>
            );
          })}
        </div>
      </div>
    );

    return (
      <div style={{padding:'20px 28px',overflowY:'auto',flex:1}}>
        {/* A. Snapshot card */}
        <div style={{background:P.panel2,borderRadius:14,padding:18,marginBottom:18}}>
          <div style={{fontSize:10.5,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,marginBottom:6}}>Client snapshot</div>
          <div style={{fontSize:13.5,color:P.text,lineHeight:1.55}}>{snapshot}</div>
        </div>

        {/* B. Action toggles */}
        <div style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,padding:18,marginBottom:18}}>
          <Toggle label="Transformation Photo" field="transPhoto" value={!!client.transPhoto}
            options={[{value:true,label:'Yes'},{value:false,label:'No'}]}/>
          <Toggle label="Post Approval" field="postApproval" value={client.postApproval}
            options={[{value:'yes',label:'Yes'},{value:'pending',label:'Pending'},{value:'no',label:'No'}]}/>
          <Toggle label="Progress Rating" field="rating" value={client.rating}
            options={[{value:'Poor',label:'Poor'},{value:'Average',label:'Average'},{value:'Good',label:'Good'},{value:'Great',label:'Great'}]}/>
        </div>

        {/* B2. Transformation tracker */}
        <div style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,padding:18,marginBottom:18}}>
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:2}}>
            <div style={{fontSize:11,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600}}>Transformation tracker</div>
          </div>
          <div style={{fontSize:12,color:P.textDim,marginBottom:12}}>Before · current</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
            {[{label:'BEFORE'},{label:`WEEK ${client.week}`}].map((ph,i)=>(
              <div key={i} style={{
                position:'relative',height:140,borderRadius:10,background:P.panel2,
                border:`1px dashed ${P.borderSoft}`,
                display:'flex',alignItems:'center',justifyContent:'center',
                color:P.textMuted,
              }}>
                <span style={{
                  position:'absolute',top:8,left:8,fontSize:9.5,fontWeight:700,
                  letterSpacing:'.08em',color:P.textDim,
                  background:P.panel,padding:'2px 7px',borderRadius:100,
                  border:`1px solid ${P.borderSoft}`,
                }}>{ph.label}</span>
                <Icon d={ICONS.camera || ICONS.eye} size={32}/>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10,marginBottom:10}}>
            <button onClick={()=>{}} style={{
              flex:1,appearance:'none',cursor:'pointer',fontFamily:'inherit',
              background:P.panel3,border:`1px solid ${P.border}`,
              borderRadius:8,padding:'9px 12px',fontSize:12.5,fontWeight:600,color:P.text,
            }}>Compare to last week</button>
            <button onClick={()=>{}} style={{
              flex:1,appearance:'none',cursor:'pointer',fontFamily:'inherit',
              background:P.accentSolid || P.accent,border:'none',
              borderRadius:8,padding:'9px 12px',fontSize:12.5,fontWeight:600,color:'#fff',
            }}>Lock in / Approve</button>
          </div>
          <div style={{fontSize:11,color:P.textMuted,lineHeight:1.45}}>
            When you approve, the transformation pair gets pushed to Daniel's owner dashboard and the team Slack.
          </div>
        </div>

        {/* C. Last Program Date */}
        <div style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,padding:18,marginBottom:18}}>
          <div style={{fontSize:11,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,marginBottom:8}}>Last Program Date</div>
          <input type="date" value={lpd || ''}
            onChange={e=>window.updateClient(client.name, 'lastProgramDate', e.target.value)}
            style={{
              background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:8,
              padding:'8px 10px',fontSize:13,color:P.text,fontFamily:'inherit',outline:'none',
            }}/>
          <div style={{display:'flex',alignItems:'center',gap:10,marginTop:10}}>
            <div style={{fontSize:12,color:P.textDim}}>
              {lpd ? `Next program due: ${next}` : 'No program logged yet'}
            </div>
            {pillLabel && (
              <span style={{background:pillBg,color:pillFg,padding:'2px 9px',borderRadius:100,fontSize:10.5,fontWeight:600}}>{pillLabel}</span>
            )}
          </div>
        </div>

        {/* Loom URL */}
        <div style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,padding:18,marginBottom:18}}>
          <div style={{fontSize:11,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,marginBottom:8}}>Loom URL</div>
          <input type="text" value={loomDraft}
            onChange={e=>setLoomDraft(e.target.value)}
            onBlur={e=>window.updateClient(client.name, 'loomUrl', e.target.value)}
            placeholder="https://loom.com/share/…"
            style={{
              width:'100%',background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:8,
              padding:'8px 10px',fontSize:13,color:P.text,fontFamily:'inherit',outline:'none',
            }}/>
          {loomDraft && (
            <a href={loomDraft} target="_blank" rel="noreferrer" style={{display:'inline-block',marginTop:8,fontSize:12,color:P.accent,fontWeight:600,textDecoration:'none'}}>Open Loom →</a>
          )}
        </div>
      </div>
    );
  }

  function PlaceholderTab(){
    return (
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:P.textMuted,fontSize:24}}>—</div>
    );
  }

  // ───────────────────────────────────────────
  // Inline editable header tokens (plan + day)
  // ───────────────────────────────────────────
  function InlinePlanToggle({name, plan}){
    const [hover, setHover] = useState(null);
    const opts = [{v:'W',l:'W'},{v:'F',l:'F'}];
    return (
      <span style={{display:'inline-flex',background:P.panel3,borderRadius:6,padding:2,gap:2,border:`1px dashed ${P.borderSoft}`}}>
        {opts.map(o=>{
          const on = plan===o.v;
          const isHover = hover===o.v;
          return (
            <button
              key={o.v}
              onMouseEnter={()=>setHover(o.v)}
              onMouseLeave={()=>setHover(null)}
              onClick={()=>window.updateClient(name,'plan',o.v)}
              title={o.v==='W'?'Weekly':'Fortnightly'}
              style={{
                appearance:'none',border:'none',cursor:'pointer',fontFamily:'inherit',
                padding:'1px 7px',fontSize:11,fontWeight:on?700:500,borderRadius:4,
                background: on?P.accent:(isHover?P.panel2:'transparent'),
                color: on?'#fff':P.textDim,
              }}>{o.l}</button>
          );
        })}
      </span>
    );
  }

  function InlineDayPicker({name, day}){
    const [hover, setHover] = useState(false);
    const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    return (
      <span style={{position:'relative',display:'inline-flex'}}>
        <select
          value={day || 'Mon'}
          onChange={e=>window.updateClient(name,'day',e.target.value)}
          onMouseEnter={()=>setHover(true)}
          onMouseLeave={()=>setHover(false)}
          style={{
            appearance:'none',WebkitAppearance:'none',MozAppearance:'none',
            fontFamily:'inherit',fontSize:12,fontWeight:600,color:P.text,
            background:hover?P.panel2:P.panel3,
            border:'none',borderBottom:`1px dashed ${hover?P.accent:P.border}`,
            padding:'1px 14px 1px 6px',borderRadius:4,cursor:'pointer',outline:'none',
          }}>
          {days.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        <span style={{position:'absolute',right:3,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',fontSize:9,color:P.textDim}}>▾</span>
      </span>
    );
  }

  // ───────────────────────────────────────────
  // Main drawer
  // ───────────────────────────────────────────
  function ClientDetail({client, onClose}){
    const [tab, setTab] = useState('overview');

    // Subscribe to data changes so drawer reflects live updates from updateClient.
    const [, force] = useState(0);
    useEffect(() => window.registerDpListener(() => force(n => n + 1)), []);

    // Close on Escape
    useEffect(()=>{
      const onKey = (e)=>{ if(e.key==='Escape') onClose(); };
      window.addEventListener('keydown', onKey);
      return ()=>window.removeEventListener('keydown', onKey);
    },[onClose]);

    if(!client) return null;
    // Re-resolve from window.clients in case it was mutated by updateClient
    const live = (window.clients || []).find(c=>c.name===client.name) || client;
    const delta = live.weight.current - live.weight.start;
    const trend = delta<0?P.positive:delta>0?P.danger:P.textDim;

    const tabs = [
      {id:'overview',label:'Overview'},
      {id:'checkins',label:'Check-Ins'},
      {id:'messages',label:'Messages'},
      {id:'notes',label:'Notes'},
    ];
    const checkinsCount = ((window.SHARED_HISTORY && window.SHARED_HISTORY[live.name]) || []).length;
    const counts = {checkins:checkinsCount, messages:7, notes:4};

    return (
      <div style={{
        position:'fixed',inset:0,zIndex:50,
        background:'rgba(26,26,31,.35)',
        display:'flex',justifyContent:'flex-end',
        animation:'cd-fade .18s ease-out',
      }} onClick={onClose}>
        <style>{`
          @keyframes cd-fade { from{opacity:0} to{opacity:1} }
          @keyframes cd-slide { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }
        `}</style>
        <div onClick={e=>e.stopPropagation()} style={{
          width: 'min(720px, 94vw)', height:'100%', background:P.bg,
          display:'flex',flexDirection:'column',
          boxShadow:'-24px 0 60px rgba(0,0,0,.18)',
          animation:'cd-slide .22s ease-out',
        }}>
          {/* Header */}
          <div style={{padding:'20px 24px 16px',background:P.panel,borderBottom:`1px solid ${P.borderSoft}`}}>
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              <Avatar name={live.name} size={44}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:3}}>
                  <div className="display" style={{fontSize:22,color:P.text,lineHeight:1.15}}>{live.name}</div>
                  <Pill status={live.status} small/>
                </div>
                <div style={{fontSize:12,color:P.textDim,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                  <span>Wk {live.week} ·</span>
                  <InlinePlanToggle name={live.name} plan={live.plan}/>
                  <span>· started {live.startDate} ·</span>
                  <InlineDayPicker name={live.name} day={live.day}/>
                  <span>check-in</span>
                </div>
              </div>
              <button onClick={onClose} style={{
                appearance:'none',background:'transparent',border:`1px solid ${P.borderSoft}`,
                width:32,height:32,borderRadius:8,cursor:'pointer',color:P.textDim,
                display:'flex',alignItems:'center',justifyContent:'center',
              }}><Icon d={ICONS.x} size={15}/></button>
            </div>

            {/* Quick stats strip */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:20,marginTop:18,paddingTop:16,borderTop:`1px solid ${P.borderSoft}`}}>
              {[
                {l:'Check-ins',v: live.checkInRate===null?'—':live.checkInRate+'%', c: live.checkInRate===null?P.textDim:live.checkInRate>=80?P.positive:live.checkInRate>=60?P.warn:P.danger},
                {l:'Start → Current',v:`${live.weight.start} → ${live.weight.current}kg`, c: P.text},
                {l:'Weight Δ',v:`${delta>0?'+':''}${delta}kg`, c: trend},
                {l:'Waiting',v: live.waiting || '—', c: live.waiting?P.danger:P.textDim},
              ].map((s,i)=>(
                <div key={i}>
                  <div style={{fontSize:10,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:3}}>{s.l}</div>
                  <div style={{fontSize:18,fontWeight:600,color:s.c,display:'flex',alignItems:'center',gap:5}}>
                    {s.v}
                    {s.icon && <span style={{color:P.warn,display:'flex'}}><Icon d={ICONS[s.icon]} size={14}/></span>}
                  </div>
                </div>
              ))}
            </div>
          </div>

          <TabHeader tabs={tabs} active={tab} onChange={setTab} counts={counts}/>

          <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0,background:P.bg}}>
            {tab==='overview' && <OverviewTab client={live}/>}
            {tab==='checkins' && <CheckinsTab client={live}/>}
            {tab==='messages' && <MessagesTab client={live}/>}
            {tab==='notes' && <NotesTab client={live}/>}
          </div>
        </div>
      </div>
    );
  }

  window.ClientDetail = ClientDetail;
})();

</script>
<script type="text/babel" data-source="view-my-pay.jsx">
// My Pay — earnings ledger + Pay Log spreadsheet view.
// Reads pay rules from the Tier 1 foundation (computeWeekPay etc).

(function(){
  const { useState, useEffect, useMemo } = React;
  const P = window.P, Icon = window.Icon, ICONS = window.ICONS,
        Avatar = window.Avatar, Pill = window.Pill;

  const PAY_LOG_PASSWORD = 'DPperformancePayRoll';

  // ────────────────────────────────────────────────
  // Helpers
  // ────────────────────────────────────────────────
  const MONTH_INDEX = {
    Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5,
    Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11,
  };
  function parseStartDate(s){
    if (!s) return null;
    const parts = String(s).trim().split(/\s+/);
    if (parts.length < 3) return null;
    const day = parseInt(parts[0], 10);
    const month = MONTH_INDEX[parts[1].slice(0,3)];
    const year = parseInt(parts[2], 10);
    if (Number.isNaN(day) || month == null || Number.isNaN(year)) return null;
    return new Date(year, month, day);
  }
  function isoDate(d){ return d.toISOString().slice(0,10); }
  function todayDate(){
    // Today per spec is 2026-04-25
    const t = new Date();
    return new Date(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function firstOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
  function fmtMoney(n){
    const sign = n < 0 ? '-' : '';
    return sign + '$' + Math.round(Math.abs(n)).toLocaleString();
  }
  function nextFifth(d){
    const y = d.getFullYear(), m = d.getMonth();
    const thisFifth = new Date(y, m, 5);
    const target = d <= thisFifth ? thisFifth : new Date(y, m+1, 5);
    const monthName = ['January','February','March','April','May','June','July','August','September','October','November','December'][target.getMonth()];
    return `5 ${monthName} ${target.getFullYear()}`;
  }
  // Maps a JS Date → index into window.SHARED_DATES (last entry = current week).
  // Each SHARED_DATES entry is "D/M" without year, so we anchor the last entry
  // to today's week and step back 7 days per slot.
  function buildDateIndex(){
    const dates = window.SHARED_DATES || [];
    const today = todayDate();
    const out = [];
    for (let i = dates.length - 1; i >= 0; i--) {
      out[i] = addDays(today, -7 * (dates.length - 1 - i));
    }
    return out;
  }
  function weekIndexForDate(target, dateIndex){
    // Returns the SHARED_DATES index whose week (Mon-Sun, anchored to last)
    // contains `target`, or null if outside the range.
    if (!dateIndex.length) return null;
    const earliestStart = addDays(dateIndex[0], -3);
    const latestEnd = addDays(dateIndex[dateIndex.length-1], 3);
    if (target < earliestStart || target > latestEnd) return null;
    let best = 0;
    let bestDiff = Math.abs(target - dateIndex[0]);
    for (let i = 1; i < dateIndex.length; i++) {
      const diff = Math.abs(target - dateIndex[i]);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    }
    return best;
  }
  function rangeIndices(from, to, dateIndex){
    const out = [];
    for (let i = 0; i < dateIndex.length; i++) {
      if (dateIndex[i] >= from && dateIndex[i] <= addDays(to, 6)) out.push(i);
    }
    return out;
  }

  // ────────────────────────────────────────────────
  // Top-level wrapper — handles My Pay vs Pay Log routing
  // ────────────────────────────────────────────────
  function MyPay({clients}){
    const [, force] = useState(0);
    useEffect(() => window.registerDpListener(() => force(n => n + 1)), []);
    const [view, setView] = useState('pay'); // 'pay' | 'paylog'
    if (view === 'paylog') return <PayLog clients={clients} onBack={()=>setView('pay')}/>;
    return <PayView clients={clients} onOpenPayLog={()=>setView('paylog')}/>;
  }

  // ────────────────────────────────────────────────
  // My Pay view
  // ────────────────────────────────────────────────
  function PayView({clients, onOpenPayLog}){
    const today = todayDate();
    const [from, setFrom] = useState(isoDate(firstOfMonth(today)));
    const [to, setTo] = useState(isoDate(today));
    const [showCancelled, setShowCancelled] = useState(window.getPayShowCancelled());
    const [sortBy, setSortBy] = useState('highest'); // 'highest' | 'plan' | 'weeks'
    const [pwOpen, setPwOpen] = useState(false);
    const [pw, setPw] = useState('');
    const [pwError, setPwError] = useState('');

    const dateIndex = useMemo(() => buildDateIndex(), [clients.length]);
    const fromDate = useMemo(() => new Date(from + 'T00:00:00'), [from]);
    const toDate = useMemo(() => new Date(to + 'T00:00:00'), [to]);
    const weekIdxs = useMemo(() => rangeIndices(fromDate, toDate, dateIndex), [fromDate, toDate, dateIndex]);

    // Recalc trigger — `calcKey` is bumped when user clicks Calculate.
    const [calcKey, setCalcKey] = useState(0);

    // ── Summary computations
    // This Month: from first of current month to today.
    const monthStart = firstOfMonth(today);
    const monthIdxs = useMemo(() => rangeIndices(monthStart, today, dateIndex), [today, dateIndex]);
    const thisMonthTotal = useMemo(() => {
      let sum = 0;
      for (const c of clients) {
        for (const wi of monthIdxs) sum += window.computeWeekPay(c, wi).amount;
        sum += window.computeOnboardingBonus(c);
        sum += window.computeRetentionBonus(c);
      }
      return Math.round(sum);
    }, [clients, monthIdxs, calcKey]);

    const pendingRet = window.computePendingRetentionBonuses();
    const onboardingPaid = useMemo(() => {
      let count = 0;
      for (const c of clients) if (window.computeOnboardingBonus(c) > 0) count++;
      return count;
    }, [clients, calcKey]);

    const planCounts = useMemo(() => {
      let weekly = 0, fort = 0;
      for (const c of clients) {
        if (c.status === 'Paused' || c.status === 'Cancelled') continue;
        if (c.plan === 'F') fort++;
        else weekly++;
      }
      return {weekly, fort};
    }, [clients, calcKey]);

    // ── Per-client period earnings
    const ledgerRows = useMemo(() => {
      const visible = clients.filter(c => showCancelled ? true : c.status !== 'Cancelled');
      const rows = visible.map(c => {
        let periodEarnings = 0;
        for (const wi of weekIdxs) periodEarnings += window.computeWeekPay(c, wi).amount;
        return {
          client: c,
          rate: c.plan === 'F' ? 15 : 25,
          period: Math.round(periodEarnings),
          onboarding: window.computeOnboardingBonus(c),
          retention: window.computeRetentionBonus(c),
        };
      });
      if (sortBy === 'plan') {
        // Weekly first, then Fortnightly; within each, highest earner first
        rows.sort((a,b) => {
          if (a.client.plan !== b.client.plan) return a.client.plan === 'W' ? -1 : 1;
          return b.period - a.period;
        });
      } else if (sortBy === 'weeks') {
        // Fewest weeks first (newest clients first)
        rows.sort((a,b) => (a.client.week||0) - (b.client.week||0));
      } else {
        rows.sort((a,b) => b.period - a.period);
      }
      return rows;
    }, [clients, weekIdxs, showCancelled, calcKey, sortBy]);

    function generateInvoice(){
      const rows = ledgerRows.filter(r => r.period > 0 || r.onboarding > 0 || r.retention > 0);

        return `<tr>
          <td>${escapeHtml(r.client.name)}</td>

          <td style="text-align:right">$${r.onboarding}</td>
          <td style="text-align:right">$${r.retention}</td>
          <td style="text-align:right"><b>$${lineTotal}</b></td>
        </tr>`;
      }).join('');
      const html = `<!doctype html><html><head><meta charset="utf-8"><title>Invoice ${from}—${to}</title>
        <style>
          body{font-family:Georgia,serif;margin:48px;color:#1a1a1f}

          @media print { body{margin:24px} }
        </style></head><body>
        <div class="caption">Invoice</div>
        <h1>DPperformance Coach Portal</h1>
        <div style="color:#6b6b75;font-size:13px;margin-top:6px">Period: <b>${from}</b> to <b>${to}</b> · Generated ${isoDate(today)}</div>
        <table>
          <thead><tr><th>Client</th><th>Plan</th><th style="text-align:right">Period</th><th style="text-align:right">Onboarding</th><th style="text-align:right">Retention</th><th style="text-align:right">Total</th></tr></thead>
          <tbody>${tableRows || '<tr><td colspan="6" style="text-align:center;color:#a5a5ad;padding:24px">No earnings in this period.</td></tr>'}</tbody>
          <tfoot><tr><td colspan="5" style="text-align:right">Grand Total</td><td style="text-align:right">$${grand}</td></tr></tfoot>
        </table>
        <footer>This invoice is auto-generated by the DPperformance Coach Portal.</footer>
        <script>window.print && setTimeout(()=>window.print(), 300);<\/script>
        </body></html>`;
      const blob = new Blob([html], {type:'text/html'});
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function submitPw(e){
      if (e) e.preventDefault();
      if (pw === PAY_LOG_PASSWORD) {
        setPw(''); setPwError(''); setPwOpen(false);
        onOpenPayLog();

        setPwError('Incorrect password');
      }

    return (
      <div style={{flex:1,padding:'32px 40px',overflowY:'auto',display:'flex',flexDirection:'column',minWidth:0}}>
        {/* Header */}
        <div style={{marginBottom:24,display:'flex',justifyContent:'space-between',alignItems:'flex-end',gap:16,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:12,color:P.accent,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>Pay cycle</div>
            <div className="display" style={{fontSize:34}}>My Pay</div>
          </div>
          <button onClick={generateInvoice} style={{
            display:'flex',alignItems:'center',gap:6,
            background:'transparent',border:`1px solid ${P.border}`,color:P.text,
            fontSize:12.5,padding:'8px 14px',borderRadius:8,cursor:'pointer',
            fontFamily:'inherit',fontWeight:600,
          }}>
            <Icon d={ICONS.external} size={13}/> Generate Invoice
          </button>
        </div>

        {/* Summary cards */}
        <div style={{
          background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,
          marginBottom:20,display:'grid',gridTemplateColumns:'repeat(4,1fr)',
        }}>
          <SummaryCard
            label="This Month"
            primary={fmtMoney(thisMonthTotal)}
            secondary={`Next pay: ${nextFifth(today)}`}
            divider
          />
          <SummaryCard
            label="Pending Bonuses"
            primary={String(pendingRet.count)}
            secondary={`× $50 = $${pendingRet.value}`}
            divider
          />
          <SummaryCard
            label="Onboarding Bonuses"
            primary={String(onboardingPaid)}
            secondary={`${onboardingPaid} × $50 = $${onboardingPaid * 50}`}
            divider
          />
          <SummaryCard
            label="Weekly / Fortnightly"
            primary={`${planCounts.weekly}W · ${planCounts.fort}F`}
            secondary="$25/wk · $15/wk"
          />
        </div>

        {/* Date range */}
        <div style={{
          background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:12,
          padding:'16px 20px',marginBottom:20,
          display:'flex',gap:14,alignItems:'flex-end',flexWrap:'wrap',
        }}>
          <DateField label="From" value={from} onChange={setFrom}/>
          <DateField label="To" value={to} onChange={setTo}/>
          <button
            onClick={() => setCalcKey(k => k+1)}
            style={{
              appearance:'none',cursor:'pointer',fontFamily:'inherit',
              padding:'8px 16px',borderRadius:8,border:'none',
              background:P.accentSolid,color:'#fff',
              fontSize:12.5,fontWeight:600,
            }}
          >Calculate</button>
          <div style={{flex:1}}/>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:P.textDim}}>
            Sort by
            <select
              value={sortBy}
              onChange={e => setSortBy(e.target.value)}
              style={{
                appearance:'auto',background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:8,
                padding:'6px 10px',fontSize:12,color:P.text,fontFamily:'inherit',outline:'none',cursor:'pointer',

            >
              <option value="highest">Highest earner</option>

              <option value="weeks">Weeks (fewest first)</option>

          </label>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:P.textDim,cursor:'pointer'}}>
            <input
              type="checkbox"
              checked={showCancelled}
              onChange={e => { setShowCancelled(e.target.checked); window.setPayShowCancelled(e.target.checked); }}
            />
            Show cancelled

        </div>

        {/* Ledger table — scrollable, sticky header */}
        <div style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:12,marginBottom:20,maxHeight:520,overflow:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.5}}>
            <thead style={{position:'sticky',top:0,zIndex:1}}>
              <tr style={{background:P.panel3}}>
                {['Client','Plan','Week','Rate/wk','Period Earnings','Onboarding','Total Retention','Status'].map((h,i)=>(
                  <th key={i} style={{
                    padding:'11px 16px',

              {ledgerRows.map((r,i) => (
                <tr key={r.client.name} style={{borderBottom:i<ledgerRows.length-1?`1px solid ${P.borderSoft}`:'none'}}>
                  <td style={{padding:'10px 16px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <Avatar name={r.client.name} size={26}/>
                      <span style={{fontWeight:500,color:P.text}}>{r.client.name}</span>
                    </div>
                  </td>
                  <td style={{padding:'10px 16px'}}>
                    <span style={{
                      background:r.client.plan==='W'?P.planWeeklyBg:P.planFortBg,
                      color:r.client.plan==='W'?P.planWeeklyFg:P.planFortFg,
                      padding:'2px 8px',borderRadius:100,fontSize:10.5,fontWeight:600,
                    }}>{r.client.plan==='W'?'Weekly':'Fortnight'}</span>
                  </td>
                  <td style={{padding:'10px 16px',color:P.textDim}}>{r.client.week}</td>
                  <td style={{padding:'10px 16px',textAlign:'right',color:P.text}}>${r.rate}</td>
                  <td style={{padding:'10px 16px',textAlign:'right',fontWeight:600,color:P.text}}>${r.period}</td>
                  <td style={{padding:'10px 16px',textAlign:'right',color:r.onboarding?P.text:P.textMuted}}>
                    {r.onboarding ? '$50' : '—'}
                  </td>
                  <td style={{padding:'10px 16px',textAlign:'right',color:r.retention?P.text:P.textMuted,fontWeight:r.retention?600:400}}>
                    {r.retention ? `$${r.retention}` : '—'}
                  </td>
                  <td style={{padding:'10px 16px'}}><Pill status={r.client.status} small/></td>
                </tr>
              ))}
              {ledgerRows.length === 0 && (
                <tr><td colSpan="8" style={{padding:'30px',textAlign:'center',color:P.textMuted}}>No clients to show.</td></tr>
              )}
            </tbody>
          </table>
        </div>

        {/* Pay Log gate */}
        <div style={{display:'flex',justifyContent:'flex-end',marginBottom:20}}>
          {!pwOpen ? (
            <button
              onClick={() => { setPwOpen(true); setPw(''); setPwError(''); }}
              style={{
                appearance:'none',cursor:'pointer',fontFamily:'inherit',
                padding:'9px 16px',borderRadius:8,
                background:'transparent',border:`1px solid ${P.border}`,color:P.text,
                fontSize:12.5,fontWeight:600,
                display:'inline-flex',alignItems:'center',gap:6,
              }}
            >
              <Icon d={ICONS.lock} size={13}/> Pay Log →
            </button>
          ) : (
            <form onSubmit={submitPw} style={{
              display:'flex',gap:8,alignItems:'center',
              background:P.panel,border:`1px solid ${P.border}`,
              borderRadius:8,padding:'6px 8px',
            }}>
              <input
                type="password"
                autoFocus
                value={pw}
                onChange={e => { setPw(e.target.value); setPwError(''); }}
                placeholder="Password"
                style={{
                  appearance:'none',border:'none',outline:'none',background:'transparent',
                  fontSize:12.5,padding:'6px 8px',color:P.text,fontFamily:'inherit',
                  minWidth:160,
                }}
              />
              <button type="submit" style={{
                appearance:'none',cursor:'pointer',fontFamily:'inherit',
                padding:'6px 12px',borderRadius:6,border:'none',
                background:P.accentSolid,color:'#fff',
                fontSize:12,fontWeight:600,
              }}>Submit</button>
              <button type="button" onClick={() => setPwOpen(false)} style={{
                appearance:'none',cursor:'pointer',fontFamily:'inherit',
                padding:'6px 8px',borderRadius:6,border:'none',
                background:'transparent',color:P.textDim,
                fontSize:12,
              }}>Cancel</button>
              {pwError && <span style={{fontSize:11.5,color:P.danger,marginLeft:6}}>{pwError}</span>}
            </form>
          )}
        </div>
      </div>
    );
  }

  function SummaryCard({label, primary, secondary, divider}){
    return (
      <div style={{
        padding:'22px 24px',
        borderRight: divider ? `1px solid ${P.borderSoft}` : 'none',
        minWidth:0,
      }}>
        <div style={{fontSize:10.5,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:8}}>{label}</div>
        <div className="display" style={{fontSize:30,color:P.text,lineHeight:1,letterSpacing:'-0.01em'}}>{primary}</div>
        <div style={{fontSize:11.5,color:P.textDim,marginTop:6,fontWeight:500}}>{secondary}</div>

  }

  function DateField({label, value, onChange}){
    return (
      <label style={{display:'flex',flexDirection:'column',gap:4}}>
        <span style={{fontSize:10.5,color:P.textMuted,letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600}}>{label}</span>
        <input
          type="date"

          style={{

          }}

      </label>
    );
