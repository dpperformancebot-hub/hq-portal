function Checkins({onOpenClient, selectedClient}) {
  const c = window.SHARED_CLIENTS;
  const dates = window.SHARED_DATES;
  const history = window.SHARED_HISTORY;
  const [, force] = React.useState(0);
  React.useEffect(() => window.registerDpListener(() => force(n => n + 1)), []);

  const [sortMode, setSortMode] = React.useState('day'); // 'priority' | 'day' | 'start'
  const [hoveredRow, setHoveredRow] = React.useState(null);
  const [statusEditOpen, setStatusEditOpen] = React.useState(null); // client.name when editing
  const [filterOpen, setFilterOpen] = React.useState(false);
  const [dayFilter, setDayFilter] = React.useState('All');
  const [planFilter, setPlanFilter] = React.useState('All');
  const [ratingFilter, setRatingFilter] = React.useState('All');
  const [statusFilter, setStatusFilter] = React.useState('All');
  const [showCancelled, setShowCancelled] = React.useState(false);

  const allStatuses = ['Sent','Submitted','Due','Missed','Messaged','SendMessage','Ghosted','Paused','Cancelled'];

  const scrollRef = React.useRef(null);
  const filterBtnRef = React.useRef(null);
  const filterPanelRef = React.useRef(null);
  const statusEditRef = React.useRef(null);

  const visible = c.filter(cl=>{
    if (!showCancelled && cl.status==='Cancelled') return false;
    if (dayFilter!=='All' && cl.day!==dayFilter) return false;
    if (planFilter!=='All') {
      if (planFilter==='Weekly' && cl.plan!=='W') return false;
      if (planFilter==='Fortnightly' && cl.plan!=='F') return false;
    }
    if (ratingFilter!=='All' && cl.rating!==ratingFilter) return false;
    if (statusFilter!=='All' && cl.status!==statusFilter) return false;
    return true;
  });

  const priorityOrder = ['SendMessage','Due','Submitted','Missed','Ghosted','Messaged','Sent','Paused','Cancelled'];
  const dayOrder = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const sorted = [...visible].sort((a,b)=>{
    if (sortMode==='priority') {
      const pa = priorityOrder.indexOf(a.status); const pb = priorityOrder.indexOf(b.status);
      if (pa!==pb) return (pa<0?99:pa) - (pb<0?99:pb);
      return a.name.localeCompare(b.name);
    }
    if (sortMode==='start') {
      return (Date.parse(a.startDate)||0) - (Date.parse(b.startDate)||0);
    }
    // by day
    const da = dayOrder.indexOf(a.day); const db = dayOrder.indexOf(b.day);
    if (da!==db) return (da<0?99:da) - (db<0?99:db);
    return a.name.localeCompare(b.name);
  });

  const currentWeekIdx = dates.length - 1;

  // ── #25 Auto-scroll to current active week on mount ──
  React.useEffect(()=>{
    const el = scrollRef.current;
    if (!el) return;
    // Defer to next frame so layout is finalized.
    const t = requestAnimationFrame(()=>{
      const leftBlockWidth = 540;
      const visibleWidth = el.clientWidth;
      // Bring the current week column near the right edge of viewport (~70% across visible scroll-area).
      const target = el.scrollWidth - visibleWidth + 40;
      el.scrollLeft = Math.max(0, target);
    });
    return ()=>cancelAnimationFrame(t);
  }, []);

  // ── #13 Arrow-key navigation when side panel open ──
  React.useEffect(()=>{
    if (!selectedClient) return;
    const onKey = (e)=>{
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      const idx = sorted.findIndex(x=>x.name===selectedClient.name);
      if (idx < 0) return;
      e.preventDefault();
      const nextIdx = e.key==='ArrowDown'
        ? Math.min(sorted.length-1, idx+1)
        : Math.max(0, idx-1);
      if (nextIdx !== idx && onOpenClient) onOpenClient(sorted[nextIdx]);
    };
    document.addEventListener('keydown', onKey);
    return ()=>document.removeEventListener('keydown', onKey);
  }, [selectedClient, sorted, onOpenClient]);

  // ── #12 Click-outside for status edit dropdown ──
  React.useEffect(()=>{
    if (!statusEditOpen) return;
    const onDoc = (e)=>{
      if (statusEditRef.current && !statusEditRef.current.contains(e.target)) {
        setStatusEditOpen(null);
      }
    };
    const onEsc = (e)=>{ if (e.key==='Escape') setStatusEditOpen(null); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onEsc);
    return ()=>{
      document.removeEventListener('mousedown', onDoc);
      document.removeEventListener('keydown', onEsc);
    };
  }, [statusEditOpen]);

  // ── #26 Click-outside / Esc for filter dropdown ──
  React.useEffect(()=>{
    if (!filterOpen) return;
    const onDoc = (e)=>{
      const inPanel = filterPanelRef.current && filterPanelRef.current.contains(e.target);
      const inBtn = filterBtnRef.current && filterBtnRef.current.contains(e.target);
      if (!inPanel && !inBtn) setFilterOpen(false);
    };
    const onEsc = (e)=>{ if (e.key==='Escape') setFilterOpen(false); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onEsc);
    return ()=>{
      document.removeEventListener('mousedown', onDoc);
      document.removeEventListener('keydown', onEsc);
    };
  }, [filterOpen]);

  // Helper: row background colour (handles hover + active selection across sticky cells)
  const rowBg = (cl, idx)=>{
    const isActive = selectedClient && cl.name === selectedClient.name;
    if (isActive) return P.accentSoft;
    if (hoveredRow === idx) return P.panel3;
    return P.panel;
  };

  // Status code map (centralised for cells + pills)
  const codeFor = (status) => (window.STATUS_CODES && window.STATUS_CODES[status]) || (window.statusCode && window.statusCode(status)) || '';

  // Renderer for a coloured square+code chip (used in date cells)
  const statusSquare = (status, size=22) => {
    const m = window.SHARED_STATUS_LIGHT[status];
    if (!m) return null;
    const code = codeFor(status);
    return (
      <span style={{
        display:'inline-flex',alignItems:'center',justifyContent:'center',
        width:size,height:size,background:m.dot,borderRadius:5,
        color:'#fff',fontWeight:700,fontSize:size>=20?10.5:9.5,letterSpacing:'.02em',
      }} title={m.label}>{code}</span>
    );
  };

  // Renderer for the inline-editable status pill (Status column)
  const StatusPill = ({status}) => {
    const m = window.SHARED_STATUS_LIGHT[status];
    if (!m) return null;
    const code = codeFor(status);
    return (
      <span style={{
        display:'inline-flex',alignItems:'center',gap:6,
        background:m.dot, color:'#fff',
        fontSize:11, fontWeight:700,
        padding:'3px 10px', borderRadius:100,
        cursor:'pointer',userSelect:'none',
      }}>
        <span style={{
          display:'inline-flex',alignItems:'center',justifyContent:'center',
          minWidth:16,height:16,padding:'0 4px',
          background:'rgba(255,255,255,0.22)',borderRadius:3,
          color:'#fff',fontSize:10,fontWeight:700,letterSpacing:'.02em',
        }}>{code}</span>
        <span style={{color:'#fff'}}>{m.label}</span>
      </span>
    );
  };

  // Frozen-column geometry (#24)
  const COLS = {
    client:    {left:0,   width:180},
    day:       {left:180, width:60},
    plan:      {left:240, width:50},
    week:      {left:290, width:50},
    status:    {left:340, width:110},
    startDate: {left:450, width:90},
  };
  const FROZEN_WIDTH = 540;

  // Common sticky-column style fragment
  const stickyCol = (left, width, bg, extra={}) => ({
    position:'sticky', left, width, minWidth:width, maxWidth:width,
    background:bg, zIndex:2,
    ...extra,
  });
  const stickyHeader = (left, width, bg, extra={}) => ({
    position:'sticky', left, top:0, width, minWidth:width, maxWidth:width,
    background:bg, zIndex:4, // header sticky on top of column-only sticky
    ...extra,
  });

  return (
    <div style={{flex:1,padding:'32px 40px',overflow:'hidden',display:'flex',flexDirection:'column'}}>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:12,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>Week of 27 Apr</div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
          <div className="display" style={{fontSize:34}}>Check-In Log</div>
          <div style={{display:'flex',gap:6,alignItems:'center',position:'relative'}}>
            {/* #26 Real Filter button */}
            <button ref={filterBtnRef} onClick={()=>setFilterOpen(v=>!v)} style={{
              display:'flex',alignItems:'center',gap:6,
              background:filterOpen?P.accentSoft:P.panel,
              border:`1px solid ${filterOpen?P.accent:P.border}`,
              color:filterOpen?(P.accentDeep||P.accent):P.text,
              fontSize:12.5,padding:'7px 12px',borderRadius:8,cursor:'pointer',fontFamily:'inherit',
            }}>
              <Icon d={ICONS.filter} size={13}/> Filter
              {(dayFilter!=='All'||planFilter!=='All'||ratingFilter!=='All'||statusFilter!=='All'||showCancelled) && (
                <span style={{display:'inline-block',width:6,height:6,borderRadius:'50%',background:P.accent,marginLeft:2}}/>
              )}
            </button>
            {filterOpen && (
              <div ref={filterPanelRef} style={{
                position:'absolute',top:'calc(100% + 6px)',right:0,zIndex:50,
                background:P.panel,border:`1px solid ${P.border}`,borderRadius:10,
                padding:14,minWidth:240,
                boxShadow:'0 12px 28px rgba(0,0,0,.10)',
                display:'flex',flexDirection:'column',gap:10,
              }}>
                <div style={{fontSize:11,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600}}>Filter</div>
                {[
                  {label:'Day', val:dayFilter, set:setDayFilter, opts:['All','Mon','Tue','Wed','Thu','Fri','Sat','Sun']},
                  {label:'Plan', val:planFilter, set:setPlanFilter, opts:['All','Weekly','Fortnightly']},
                  {label:'Rating', val:ratingFilter, set:setRatingFilter, opts:['All','Great','Good','Average','Poor']},
                  {label:'Status', val:statusFilter, set:setStatusFilter, opts:['All',...allStatuses]},
                ].map(f=>(
                  <label key={f.label} style={{display:'flex',alignItems:'center',gap:10,fontSize:12,color:P.textDim}}>
                    <span style={{width:54,fontWeight:500}}>{f.label}</span>
                    <select value={f.val} onChange={e=>f.set(e.target.value)} style={{
                      flex:1,background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:7,
                      padding:'5px 8px',fontSize:12,color:P.text,fontFamily:'inherit',cursor:'pointer',outline:'none',
                    }}>
                      {f.opts.map(o=><option key={o} value={o}>{o}</option>)}
                    </select>
                  </label>
                ))}
                <div style={{borderTop:`1px solid ${P.borderSoft}`,marginTop:4,paddingTop:10,display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                  <span style={{fontSize:12,color:P.textDim}}>Show cancelled</span>
                  <button onClick={()=>setShowCancelled(v=>!v)} style={{
                    appearance:'none',border:'none',cursor:'pointer',padding:0,
                    width:32,height:18,borderRadius:99,position:'relative',
                    background:showCancelled?P.accent:P.panel2,
                    transition:'background .15s',
                  }}>
                    <span style={{
                      position:'absolute',top:2,left:showCancelled?16:2,
                      width:14,height:14,borderRadius:'50%',background:'#fff',
                      boxShadow:'0 1px 2px rgba(0,0,0,.2)',transition:'left .15s',
                    }}/>
                  </button>
                </div>
                <button onClick={()=>{
                  setDayFilter('All');setPlanFilter('All');setRatingFilter('All');setStatusFilter('All');setShowCancelled(false);
                }} style={{
                  appearance:'none',background:'transparent',border:'none',cursor:'pointer',
                  fontSize:11.5,color:P.accent,fontWeight:500,fontFamily:'inherit',padding:0,alignSelf:'flex-start',
                }}>Reset filters</button>
              </div>
            )}
            <div style={{display:'flex',gap:2,background:P.panel2,border:`1px solid ${P.borderSoft}`,borderRadius:8,padding:3}}>
              {[['priority','Priority'],['day','By Day'],['start','By Start']].map(([v,l])=>(
                <button key={v} onClick={()=>setSortMode(v)} style={{
                  padding:'5px 10px',borderRadius:6,fontSize:11.5,fontWeight:500,border:'none',cursor:'pointer',
                  background:sortMode===v?P.panel:'transparent',
                  color:sortMode===v?P.text:P.textDim,
                  boxShadow:sortMode===v?'0 1px 2px rgba(0,0,0,.04)':'none',
                  fontFamily:'inherit',
                }}>{l}</button>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div style={{display:'flex',gap:0,marginBottom:18,background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:12,overflow:'hidden'}}>
        {['Submitted','Sent','Due','Missed','SendMessage','Ghosted'].map((s,i)=>{
          const n = visible.filter(x=>x.status===s).length;
          const m = window.SHARED_STATUS_LIGHT[s];
          return (
            <div key={s} style={{flex:1,padding:'14px 18px',borderRight:i<5?`1px solid ${P.borderSoft}`:'none'}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
                <div style={{width:6,height:6,borderRadius:'50%',background:m.dot}}/>
                <span style={{fontSize:11,color:P.textDim,fontWeight:500}}>{m.label}</span>
              </div>
              <div className="display" style={{fontSize:26,lineHeight:1}}>{n}</div>
            </div>
          );
        })}
      </div>

      <div ref={scrollRef} style={{flex:1,background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:12,overflow:'auto',position:'relative'}}>
        <table style={{borderCollapse:'separate',borderSpacing:0,fontSize:13,width:'max-content',minWidth:'100%'}}>
          <thead>
            <tr>
              <th style={{padding:'12px 14px',textAlign:'left',fontSize:10.5,fontWeight:600,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap',borderBottom:`1px solid ${P.borderSoft}`,...stickyHeader(COLS.client.left, COLS.client.width, P.panel)}}>Client</th>
              <th style={{padding:'12px 8px',textAlign:'center',fontSize:10.5,fontWeight:600,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap',borderBottom:`1px solid ${P.borderSoft}`,...stickyHeader(COLS.day.left, COLS.day.width, P.panel)}}>Day</th>
              <th style={{padding:'12px 8px',textAlign:'center',fontSize:10.5,fontWeight:600,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap',borderBottom:`1px solid ${P.borderSoft}`,...stickyHeader(COLS.plan.left, COLS.plan.width, P.panel)}}>Plan</th>
              <th style={{padding:'12px 8px',textAlign:'center',fontSize:10.5,fontWeight:600,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap',borderBottom:`1px solid ${P.borderSoft}`,...stickyHeader(COLS.week.left, COLS.week.width, P.panel)}}>Wk</th>
              <th style={{padding:'12px 12px',textAlign:'center',fontSize:10.5,fontWeight:600,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap',borderBottom:`1px solid ${P.borderSoft}`,...stickyHeader(COLS.status.left, COLS.status.width, P.panel)}}>Status</th>
              <th style={{padding:'12px 12px',textAlign:'center',fontSize:10.5,fontWeight:600,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap',borderBottom:`1px solid ${P.borderSoft}`,borderRight:`1px solid ${P.borderSoft}`,...stickyHeader(COLS.startDate.left, COLS.startDate.width, P.panel)}}>Start Date</th>
              {dates.map((h,i)=>{
                const isCurrentWeek = i === currentWeekIdx;
                return (
                  <th key={i} style={{
                    padding:'12px 12px',textAlign:'center',
                    fontSize:10.5,fontWeight:600,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.06em',
                    position:'sticky',top:0,zIndex:3,background:isCurrentWeek?P.accentSoft:P.panel,
                    borderBottom:`1px solid ${P.borderSoft}`,
                    whiteSpace:'nowrap',minWidth:64,
                  }}>{h}</th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {sorted.map((cl, rowIdx)=>{
              const isActive = selectedClient && cl.name === selectedClient.name;
              const bg = rowBg(cl, rowIdx);
              return (
              <tr key={cl.name}
                  onMouseEnter={()=>setHoveredRow(rowIdx)}
                  onMouseLeave={()=>setHoveredRow(null)}
                  style={{cursor:'pointer'}}>
                <td onClick={()=>onOpenClient && onOpenClient(cl)} style={{
                  padding:'10px 14px',fontWeight:500,whiteSpace:'nowrap',
                  borderLeft:isActive?`3px solid ${P.accent}`:'3px solid transparent',
                  borderBottom:`1px solid ${P.borderSoft}`,
                  ...stickyCol(COLS.client.left, COLS.client.width, bg),
                }}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <Avatar name={cl.name} size={26}/>
                    <span style={{color:isActive?P.accent:P.text,fontWeight:isActive?600:500,overflow:'hidden',textOverflow:'ellipsis'}}>{cl.name}</span>
                  </div>
                </td>
                <td onClick={()=>onOpenClient && onOpenClient(cl)} style={{padding:'10px 8px',textAlign:'center',color:P.textDim,borderBottom:`1px solid ${P.borderSoft}`,...stickyCol(COLS.day.left, COLS.day.width, bg)}}>{cl.day}</td>
                <td onClick={()=>onOpenClient && onOpenClient(cl)} style={{padding:'10px 6px',textAlign:'center',borderBottom:`1px solid ${P.borderSoft}`,...stickyCol(COLS.plan.left, COLS.plan.width, bg)}}>
                  <span style={{background:cl.plan==='W'?P.planWeeklyBg:P.planFortBg,color:cl.plan==='W'?P.planWeeklyFg:P.planFortFg,padding:'2px 7px',borderRadius:100,fontSize:10.5,fontWeight:600}}>{cl.plan==='W'?'W':'F'}</span>
                </td>
                <td onClick={()=>onOpenClient && onOpenClient(cl)} style={{padding:'10px 6px',textAlign:'center',color:P.textDim,fontWeight:500,borderBottom:`1px solid ${P.borderSoft}`,...stickyCol(COLS.week.left, COLS.week.width, bg)}}>{cl.week}</td>
                <td style={{padding:'10px 12px',borderBottom:`1px solid ${P.borderSoft}`,position:'sticky',left:COLS.status.left,width:COLS.status.width,minWidth:COLS.status.width,maxWidth:COLS.status.width,background:bg,zIndex: statusEditOpen===cl.name ? 50 : 2,textAlign:'center'}}>
                  <div style={{position:'relative',display:'inline-block'}} ref={statusEditOpen===cl.name?statusEditRef:null}>
                    <span onClick={(e)=>{ e.stopPropagation(); setStatusEditOpen(prev=>prev===cl.name?null:cl.name); }}>
                      <StatusPill status={cl.status}/>
                    </span>
                    {statusEditOpen===cl.name && (
                      <div style={{
                        position:'absolute',top:'calc(100% + 4px)',left:0,zIndex:1000,
                        background:P.panel,border:`1px solid ${P.border}`,borderRadius:8,
                        boxShadow:'0 10px 24px rgba(0,0,0,.12)',
                        padding:4,minWidth:140,
                        display:'flex',flexDirection:'column',gap:1,
                      }}
                      onClick={(e)=>e.stopPropagation()}>
                        {allStatuses.map(s=>{
                          const m = window.SHARED_STATUS_LIGHT[s];
                          const code = codeFor(s);
                          const isCur = s===cl.status;
                          return (
                            <button key={s} onClick={(e)=>{
                              e.stopPropagation();
                              if (window.updateClient) window.updateClient(cl.name, 'status', s);
                              setStatusEditOpen(null);
                            }} style={{
                              appearance:'none',border:'none',cursor:'pointer',fontFamily:'inherit',
                              display:'flex',alignItems:'center',gap:8,
                              padding:'6px 10px',borderRadius:6,textAlign:'left',
                              background:isCur?P.panel3:'transparent',
                              fontSize:12,color:P.text,fontWeight:isCur?600:500,
                            }}
                            onMouseEnter={e=>e.currentTarget.style.background=P.panel3}
                            onMouseLeave={e=>e.currentTarget.style.background=isCur?P.panel3:'transparent'}>
                              <span style={{
                                display:'inline-flex',alignItems:'center',justifyContent:'center',
                                width:18,height:18,background:m.dot,borderRadius:4,
                                color:'#fff',fontWeight:700,fontSize:9.5,
                              }}>{code}</span>
                              <span>{m.label}</span>
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </td>
                <td onClick={()=>onOpenClient && onOpenClient(cl)} style={{padding:'10px 12px',textAlign:'center',color:P.textDim,whiteSpace:'nowrap',borderRight:`1px solid ${P.borderSoft}`,borderBottom:`1px solid ${P.borderSoft}`,...stickyCol(COLS.startDate.left, COLS.startDate.width, bg)}}>{cl.startDate}</td>
                {dates.map((d,di)=>{
                  const code = history[cl.name]?.[di] || '';
                  const st = window.CODE_TO_STATUS[code] || '';
                  const isCur = di === currentWeekIdx;
                  const cellBg = isCur ? P.accentSoft : bg;
                  if (!st) return <td key={d} onClick={()=>onOpenClient && onOpenClient(cl)} style={{background:cellBg,minWidth:64,borderBottom:`1px solid ${P.borderSoft}`}}/>;
                  return (
                    <td key={d} onClick={()=>onOpenClient && onOpenClient(cl)} style={{padding:'6px 4px',textAlign:'center',background:cellBg,minWidth:64,borderBottom:`1px solid ${P.borderSoft}`}}>
                      {statusSquare(st, 22)}
                    </td>
                  );
                })}
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────
// My Clients — list + card views (scales to 100+)
// ────────────────────────────────────────────────
function MyClients({viewMode, density, onOpenClient, selectedClient, onAddClient}) {
  const c = window.SHARED_CLIENTS;
  const [, force] = React.useState(0);
  React.useEffect(() => window.registerDpListener(() => force(n => n + 1)), []);

  const [q, setQ] = React.useState('');
  const [dayFilter, setDayFilter] = React.useState('All');
  const [planFilter, setPlanFilter] = React.useState('All');
  const [ratingFilter, setRatingFilter] = React.useState('All');
  const [statusFilter, setStatusFilter] = React.useState('All');
  const [transFilter, setTransFilter] = React.useState('All'); // All | Yes | No
  const [sortMode, setSortMode] = React.useState('default'); // default | lastMessaged | statusPriority | startDate
  const [showCancelled, setShowCancelled] = React.useState(false);

  const allStatuses = ['Sent','Submitted','Due','Missed','Messaged','SendMessage','Ghosted','Paused','Cancelled'];

  const filtered = c.filter(cl=>{
    if (!showCancelled && cl.status==='Cancelled') return false;
    if (q && !cl.name.toLowerCase().includes(q.toLowerCase())) return false;
    if (dayFilter!=='All' && cl.day!==dayFilter) return false;
    if (planFilter!=='All') {
      if (planFilter==='Weekly' && cl.plan!=='W') return false;
      if (planFilter==='Fortnightly' && cl.plan!=='F') return false;
    }
    if (ratingFilter!=='All' && cl.rating!==ratingFilter) return false;
    if (statusFilter!=='All' && cl.status!==statusFilter) return false;
    if (transFilter!=='All') {
      if (transFilter==='Yes' && !cl.transPhoto) return false;
      if (transFilter==='No' && cl.transPhoto) return false;
    }
    return true;
  });

  // Sorting
  const lastMsgHours = (s) => {
    if (!s || s === '—') return -1; // unknown -> sorts last under desc
    const m = String(s).trim().match(/^(\d+(?:\.\d+)?)([hdwm])$/i);
    if (!m) return -1;
    const n = parseFloat(m[1]);
    const u = m[2].toLowerCase();
    if (u==='h') return n;
    if (u==='d') return n * 24;
    if (u==='w') return n * 24 * 7;
    if (u==='m') return n * 24 * 30;
    return -1;
  };
  const statusPriorityOrder = ['SendMessage','Due','Submitted','Missed','Ghosted','Messaged','Sent','Paused','Cancelled'];
  const sorted = [...filtered].sort((a,b)=>{
    if (sortMode==='lastMessaged') {
      const ha = lastMsgHours(a.lastMsg), hb = lastMsgHours(b.lastMsg);
      if (hb !== ha) return hb - ha; // longest wait first
      return a.name.localeCompare(b.name);
    }
    if (sortMode==='statusPriority') {
      const pa = statusPriorityOrder.indexOf(a.status);
      const pb = statusPriorityOrder.indexOf(b.status);
      if (pa !== pb) return (pa<0?99:pa) - (pb<0?99:pb);
      return a.name.localeCompare(b.name);
    }
    if (sortMode==='startDate') {
      const ta = Date.parse(a.startDate) || 0;
      const tb = Date.parse(b.startDate) || 0;
      if (ta !== tb) return ta - tb; // oldest first
      return a.name.localeCompare(b.name);
    }
    return a.name.localeCompare(b.name);
  });

  const rowPad = density==='compact'?'6px 14px':density==='comfy'?'14px 14px':'10px 14px';
  const rowFont = density==='compact'?12:density==='comfy'?13.5:12.5;

  const ratingPill = (rating) => {
    if (!rating) return <span style={{color:P.textMuted}}>—</span>;
    const map = {
      Great:   {bg:P.accentSoft,    fg:P.accentDeep || P.accent},
      Good:    {bg:P.positiveSoft,  fg:P.positive},
      Average: {bg:P.warnSoft,      fg:P.warn},
      Poor:    {bg:P.dangerSoft,    fg:P.danger},
    };
    const m = map[rating] || {bg:P.panel2,fg:P.textDim};
    return (
      <span style={{background:m.bg,color:m.fg,padding:'2px 8px',borderRadius:100,fontSize:10.5,fontWeight:600}}>{rating}</span>
    );
  };

  const selectStyle = {
    background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:8,
    padding:'6px 10px',fontSize:12,color:P.text,fontFamily:'inherit',cursor:'pointer',outline:'none',
  };

  return (
    <div style={{flex:1,padding:'32px 40px',overflow:'hidden',display:'flex',flexDirection:'column'}}>
      <div style={{marginBottom:20,display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div style={{fontSize:12,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>{c.length} total · {c.filter(x=>x.status!=='Paused' && x.status!=='Cancelled').length} active</div>
          <div className="display" style={{fontSize:34}}>My Clients</div>
        </div>
        <div style={{display:'flex',gap:6}}>
          <button onClick={()=>onAddClient && onAddClient()} style={{display:'flex',alignItems:'center',gap:6,background:P.accentSolid,color:'#fff',border:'none',fontSize:12.5,fontWeight:600,padding:'8px 14px',borderRadius:8,cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit'}}>
            <Icon d={ICONS.plus} size={13}/> Add client
          </button>
        </div>
      </div>

      {/* Toolbar — row 1: search + show cancelled + count */}
      <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:10,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:8,padding:'7px 12px',width:240,maxWidth:240}}>
          <span style={{color:P.textMuted,display:'flex'}}><Icon d={ICONS.search} size={14}/></span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search clients…" style={{border:'none',outline:'none',background:'transparent',flex:1,fontSize:13,fontFamily:'inherit',color:P.text,minWidth:0}}/>
        </div>
        <button onClick={()=>setShowCancelled(v=>!v)} style={{
          background:showCancelled?P.accentSoft:P.panel,
          color:showCancelled?(P.accentDeep||P.accent):P.textDim,
          border:`1px solid ${showCancelled?P.accent:P.borderSoft}`,
          borderRadius:8,padding:'6px 10px',fontSize:12,fontWeight:500,cursor:'pointer',fontFamily:'inherit',
        }}>{showCancelled?'Hide cancelled':'Show cancelled'}</button>
        <select value={sortMode} onChange={e=>setSortMode(e.target.value)} style={selectStyle}>
          <option value="default">Sort: Default (A-Z)</option>
          <option value="lastMessaged">Sort: Last Messaged</option>
          <option value="startDate">Sort: Start Date</option>
          <option value="statusPriority">Sort: Status priority</option>
        </select>
        <div style={{marginLeft:'auto',fontSize:12,color:P.textMuted}}>{sorted.length} shown</div>
      </div>

      {/* Toolbar — row 2: filters aligned roughly under their corresponding columns */}
      <div style={{display:'flex',gap:10,alignItems:'flex-end',marginBottom:14,flexWrap:'wrap'}}>
        {[
          {label:'Day',    el:<select value={dayFilter} onChange={e=>setDayFilter(e.target.value)} style={{...selectStyle,width:'100%'}}>{['All','Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(v=><option key={v} value={v}>{v}</option>)}</select>},
          {label:'Plan',   el:<select value={planFilter} onChange={e=>setPlanFilter(e.target.value)} style={{...selectStyle,width:'100%'}}>{['All','Weekly','Fortnightly'].map(v=><option key={v} value={v}>{v}</option>)}</select>},
          {label:'Status', el:<select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{...selectStyle,width:'100%'}}><option value="All">All</option>{allStatuses.map(v=><option key={v} value={v}>{v}</option>)}</select>},
          {label:'Rating', el:<select value={ratingFilter} onChange={e=>setRatingFilter(e.target.value)} style={{...selectStyle,width:'100%'}}>{['All','Great','Good','Average','Poor'].map(v=><option key={v} value={v}>{v}</option>)}</select>},
          {label:'Transformation', el:<select value={transFilter} onChange={e=>setTransFilter(e.target.value)} style={{...selectStyle,width:'100%'}}>{['All','Yes','No'].map(v=><option key={v} value={v}>{v}</option>)}</select>},
        ].map(({label, el}) => (
          <div key={label} style={{flex:'1 1 0',minWidth:120,display:'flex',flexDirection:'column',gap:4}}>
            <span style={{fontSize:10,color:P.textMuted,letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,paddingLeft:2}}>{label}</span>
            {el}
          </div>
        ))}
      </div>

      {viewMode==='cards' ? (
        <div style={{flex:1,overflowY:'auto',paddingRight:4}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:14}}>
            {sorted.map(cl=>{
              const delta = cl.weight.current - cl.weight.start;
              const trend = delta<0?P.positive:delta>0?P.danger:P.textDim;
              return (
                <div key={cl.name} onClick={()=>onOpenClient && onOpenClient(cl)} style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,padding:'18px 20px',cursor:'pointer',transition:'border-color .12s'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=P.border}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=P.borderSoft}}
                >
                  <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
                    <Avatar name={cl.name} size={40}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:600,color:P.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{cl.name}</div>
                      <div style={{fontSize:11.5,color:P.textDim,marginTop:2}}>Wk {cl.week} · {cl.plan==='W'?'Weekly':'Fortnight'} · {cl.day}</div>
                    </div>
                    <Pill status={cl.status} small/>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,paddingTop:12,borderTop:`1px solid ${P.borderSoft}`}}>
                    <div>
                      <div style={{fontSize:10,color:P.textMuted,letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:3}}>Check-ins</div>
                      <div style={{fontSize:16,fontWeight:600,color:cl.checkInRate===null?P.textDim:cl.checkInRate>=80?P.positive:cl.checkInRate>=60?P.warn:P.danger}}>{cl.checkInRate===null?'—':cl.checkInRate+'%'}</div>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:P.textMuted,letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:3}}>Streak</div>
                      <div style={{fontSize:16,fontWeight:600,color:P.text,display:'flex',alignItems:'center',gap:4}}>
                        {cl.streak}{cl.streak>=8 && <Icon d={ICONS.flame} size={13}/>}
                      </div>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:P.textMuted,letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600,marginBottom:3}}>Weight Δ</div>
                      <div style={{fontSize:16,fontWeight:600,color:trend}}>{delta>0?'+':''}{delta}kg</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        <div style={{flex:1,background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:12,overflow:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:rowFont}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${P.borderSoft}`}}>
                {['Client','Day','Plan','Status','Rating','Weeks Active','Check-in Rate','Transformation','Last Messaged'].map((h,i)=>(
                  <th key={i} style={{
                    padding:'11px 14px',textAlign:i===0?'left':'center',
                    fontSize:10.5,fontWeight:600,color:P.textMuted,textTransform:'uppercase',letterSpacing:'.06em',
                    position:'sticky',top:0,background:P.panel,zIndex:1,borderBottom:`1px solid ${P.borderSoft}`,
                    whiteSpace:'nowrap',
                  }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sorted.map((cl)=>{
                const isActive = selectedClient && cl.name === selectedClient.name;
                return (
                  <tr key={cl.name} style={{borderBottom:`1px solid ${P.borderSoft}`,cursor:'pointer'}}
                      onClick={()=>onOpenClient && onOpenClient(cl)}
                      onMouseEnter={e=>e.currentTarget.style.background=P.panel3}
                      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    <td style={{padding:rowPad,whiteSpace:'nowrap',borderLeft:isActive?`3px solid ${P.accent}`:'3px solid transparent'}}>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <Avatar name={cl.name} size={density==='compact'?22:28}/>
                        <span style={{fontWeight:isActive?600:600,color:isActive?P.accent:P.text}}>{cl.name}</span>
                      </div>
                    </td>
                    <td style={{padding:rowPad,textAlign:'center',color:P.textDim}}>{cl.day}</td>
                    <td style={{padding:rowPad,textAlign:'center'}}>
                      <span style={{background:cl.plan==='W'?P.planWeeklyBg:P.planFortBg,color:cl.plan==='W'?P.planWeeklyFg:P.planFortFg,padding:'2px 8px',borderRadius:100,fontSize:10.5,fontWeight:600}}>{cl.plan==='W'?'Weekly':'Fortnight'}</span>
                    </td>
                    <td style={{padding:rowPad,textAlign:'center'}}><Pill status={cl.status} small/></td>
                    <td style={{padding:rowPad,textAlign:'center'}}>{ratingPill(cl.rating)}</td>
                    <td style={{padding:rowPad,textAlign:'center',color:P.textDim,fontWeight:500}}>{cl.week}</td>
                    <td style={{padding:rowPad,textAlign:'center',fontWeight:600,color:cl.checkInRate===null?P.textDim:cl.checkInRate>=80?P.positive:cl.checkInRate>=60?P.warn:P.danger}}>{cl.checkInRate===null?'—':cl.checkInRate+'%'}</td>
                    <td style={{padding:rowPad,textAlign:'center'}}>
                      {cl.transPhoto
                        ? <span style={{background:P.accentSoft,color:P.accentDeep||P.accent,padding:'2px 8px',borderRadius:100,fontSize:10.5,fontWeight:600}}>Yes</span>
                        : <span style={{background:P.panel2,color:P.textMuted,padding:'2px 8px',borderRadius:100,fontSize:10.5,fontWeight:600}}>No</span>}
                    </td>
                    <td style={{padding:rowPad,textAlign:'center',color:P.textDim,whiteSpace:'nowrap'}}>{cl.lastMsg}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ────────────────────────────────────────────────
// Stub pages

function Stub({title, subtitle}) {
  return (
    <div style={{flex:1,padding:'32px 40px',display:'flex',flexDirection:'column'}}>
      <div style={{fontSize:12,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>{subtitle}</div>
      <div className="display" style={{fontSize:34,marginBottom:20}}>{title}</div>
      <div style={{flex:1,background:P.panel,border:`1px dashed ${P.border}`,borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',color:P.textMuted,fontSize:13}}>
        This view will be built out next — Dashboard, Check-In Log, and My Clients are fully designed.
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────
// Add Client modal
// ────────────────────────────────────────────────
function AddClientModal({onClose}) {
  const [first, setFirst] = React.useState('');
  const [last, setLast] = React.useState('');
  const [day, setDay] = React.useState('Mon');
  const [plan, setPlan] = React.useState('W');
  const [startDate, setStartDate] = React.useState(() => new Date().toISOString().slice(0,10));

  React.useEffect(()=>{
    const onKey = (e)=>{ if (e.key==='Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  }, [onClose]);

  const canSubmit = first.trim() && last.trim();

  function submit(){
    if (!canSubmit) return;
    const name = `${first.trim()} ${last.trim()}`;
    const newClient = {
      name, day, plan, week:1, startDate,
      status:'Sent', rating:null, checkInRate:null, transPhoto:false,
      postApproval:'no', streak:0, lastCheckin:'—', phone:'', trend:null,
      weight:{start:0,current:0}, lastMsg:'—', waiting:null,
      history:[], notes:'', loomUrl:'',
    };
    if (Array.isArray(window.SHARED_CLIENTS)) {
      window.SHARED_CLIENTS.push(newClient);
    }
    if (window.SHARED_HISTORY && !window.SHARED_HISTORY[name]) {
      window.SHARED_HISTORY[name] = [];
    }
    if (typeof window.refreshVisibleViews === 'function') {
      window.refreshVisibleViews();
    }
    onClose();
  }

  const inputStyle = {
    width:'100%',background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:8,
    padding:'8px 10px',fontSize:13,color:P.text,fontFamily:'inherit',boxSizing:'border-box',outline:'none',
  };
  const labelStyle = {fontSize:11,color:P.textMuted,letterSpacing:'.06em',textTransform:'uppercase',fontWeight:600};

  return (
    <div
      onClick={onClose}
      style={{
        position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',
        display:'flex',alignItems:'center',justifyContent:'center',
        zIndex:200,
      }}
    >
      <div
        onClick={e=>e.stopPropagation()}
        style={{
          width:'100%',maxWidth:480,
          background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:16,
          boxShadow:'0 24px 60px rgba(0,0,0,0.25)',
          padding:24,display:'flex',flexDirection:'column',gap:14,
          margin:16,
        }}
      >
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
          <div className="display" style={{fontSize:22,color:P.text}}>Add Client</div>
          <button onClick={onClose} aria-label="Close" style={{
            appearance:'none',background:'transparent',border:'none',cursor:'pointer',
            color:P.textMuted,padding:4,display:'flex',
          }}>
            <Icon d={ICONS.close || 'M6 6l12 12M18 6L6 18'} size={16}/>
          </button>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <label style={{display:'flex',flexDirection:'column',gap:5}}>
            <span style={labelStyle}>First name</span>
            <input value={first} onChange={e=>setFirst(e.target.value)} style={inputStyle} autoFocus/>
          </label>
          <label style={{display:'flex',flexDirection:'column',gap:5}}>
            <span style={labelStyle}>Last name</span>
            <input value={last} onChange={e=>setLast(e.target.value)} style={inputStyle}/>
          </label>
        </div>

        <label style={{display:'flex',flexDirection:'column',gap:5}}>
          <span style={labelStyle}>Day of week</span>
          <select value={day} onChange={e=>setDay(e.target.value)} style={{...inputStyle,appearance:'auto'}}>
            {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>(
              <option key={d} value={d}>{d}</option>
            ))}
          </select>
        </label>

        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          <span style={labelStyle}>Plan</span>
          <div style={{display:'flex',background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:8,padding:3,gap:2}}>
            {[['W','Weekly'],['F','Fortnightly']].map(([val,lbl])=>{
              const on = plan===val;
              return (
                <button key={val} type="button" onClick={()=>setPlan(val)} style={{
                  flex:1,appearance:'none',border:'none',cursor:'pointer',fontFamily:'inherit',
                  padding:'7px 10px',borderRadius:6,
                  background: on?P.panel:'transparent',
                  color: on?P.text:P.textDim,
                  fontSize:12.5,fontWeight:on?600:500,
                  boxShadow: on?'0 1px 2px rgba(0,0,0,0.05)':'none',
                }}>{lbl}</button>
              );
            })}
          </div>
        </div>

        <label style={{display:'flex',flexDirection:'column',gap:5}}>
          <span style={labelStyle}>Start date</span>
          <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={inputStyle}/>
        </label>

        <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:8,paddingTop:12,borderTop:`1px solid ${P.borderSoft}`}}>
          <button onClick={onClose} style={{
            appearance:'none',cursor:'pointer',fontFamily:'inherit',
            background:P.panel,border:`1px solid ${P.border}`,color:P.text,
            fontSize:12.5,fontWeight:500,padding:'8px 14px',borderRadius:8,
          }}>Cancel</button>
          <button onClick={submit} disabled={!canSubmit} style={{
            appearance:'none',cursor:canSubmit?'pointer':'not-allowed',fontFamily:'inherit',
            background:canSubmit?P.accentSolid:P.panel2,
            color:canSubmit?'#fff':P.textMuted,
            border:'none',fontSize:12.5,fontWeight:600,padding:'8px 14px',borderRadius:8,
            opacity:canSubmit?1:0.7,
          }}>Add client</button>
        </div>
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────
// Shell
// ────────────────────────────────────────────────
function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "clientsView": "list",
    "density": "regular",
    "accent": "#16a34a",
    "theme": "light"
  }/*EDITMODE-END*/;
  const [t, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [active, setActive] = React.useState('clients');
  const [openClient, setOpenClient] = React.useState(null);
  const [addClientOpen, setAddClientOpen] = React.useState(false);
  const [theme, setThemeState] = React.useState(()=>{
    try { return localStorage.getItem('dp.theme') || t.theme || 'light'; } catch(e){ return t.theme || 'light'; }
  });
  const [themeTick, setThemeTick] = React.useState(0);
  const [bonusToast, setBonusToast] = React.useState(null);

  React.useEffect(()=>{
    const onBonus = (e)=>{
      const name = e?.detail?.clientName || e?.detail?.name || (e?.detail?.client && e.detail.client.name) || '';
      setBonusToast({name, ts: Date.now()});
      setTimeout(()=>setBonusToast(b => (b && Date.now()-b.ts >= 2900) ? null : b), 3000);
    };
    window.addEventListener('dp:onboarding-bonus', onBonus);
    return ()=>window.removeEventListener('dp:onboarding-bonus', onBonus);
  }, []);

  // Apply theme on mount + whenever it changes
  React.useEffect(()=>{
    window.applyTheme(theme);
    try { localStorage.setItem('dp.theme', theme); } catch(e){}
    setTweak('theme', theme);
    setThemeTick(n=>n+1); // force cascade rerender
  }, [theme]);

  // Apply accent tweak live (accent survives theme switch because it's applied after)
  React.useEffect(()=>{ P.accent = t.accent; setThemeTick(n=>n+1); }, [t.accent]);

  const onToggleTheme = (next) => setThemeState(next);

  const views = {
    dashboard: <Dashboard onOpenClient={setOpenClient}/>,
    checkins: <Checkins onOpenClient={setOpenClient} selectedClient={openClient}/>,
    clients: <MyClients viewMode={t.clientsView} density={t.density} onOpenClient={setOpenClient} selectedClient={openClient} onAddClient={()=>setAddClientOpen(true)}/>,
    audits: <window.ClientAudits/>,
    pay: <window.MyPay clients={window.SHARED_CLIENTS}/>,
    recipes: <window.Recipes/>,
    resources: <window.Resources/>,
    quizzes: <window.Quizzes/>,
    academy: <window.Academy/>,
    calculators: <window.Calculators/>,
    assistant: <window.CoachAssistant/>,
    settings: <window.Settings theme={theme} onToggleTheme={onToggleTheme} accent={t.accent} setAccent={v=>{setTweak('accent',v); P.accent=v; setThemeTick(n=>n+1);}} density={t.density} setDensity={v=>setTweak('density',v)} clientsView={t.clientsView} setClientsView={v=>setTweak('clientsView',v)}/>,
  };
  return (
    <div key={themeTick} style={{height:'100vh',width:'100vw',display:'flex',background:P.bg,color:P.text}}>
      <Sidebar active={active} onNav={setActive} theme={theme} onToggleTheme={onToggleTheme}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        <TopBar onAddClient={()=>setAddClientOpen(true)} onOpenClient={setOpenClient}/>
        {views[active]}
      </div>
      {openClient && <window.ClientDetail client={openClient} onClose={()=>setOpenClient(null)}/>}
      {addClientOpen && <AddClientModal onClose={()=>setAddClientOpen(false)}/>}
      {bonusToast && (
        <div style={{
          position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',
          background:P.accent,color:'#fff',
          padding:'10px 18px',borderRadius:10,
          fontSize:13,fontWeight:600,
          boxShadow:'0 8px 24px rgba(0,0,0,.18)',
          zIndex:100,
          animation:'dp-toast-fade 3s ease forwards',
        }}>
          <style>{`@keyframes dp-toast-fade { 0%{opacity:0;transform:translate(-50%,8px)} 10%{opacity:1;transform:translate(-50%,0)} 85%{opacity:1} 100%{opacity:0} }`}</style>
          $50 onboarding bonus added{bonusToast.name?` · ${bonusToast.name}`:''}
        </div>
      )}
      <window.TweaksPanel title="Tweaks">
        <window.TweakSection label="My Clients"/>
        <window.TweakRadio label="View" value={t.clientsView}
          options={[{value:'list',label:'List'},{value:'cards',label:'Cards'}]}
          onChange={v=>setTweak('clientsView',v)}/>
        <window.TweakRadio label="Row density" value={t.density}
          options={[{value:'compact',label:'Compact'},{value:'regular',label:'Regular'},{value:'comfy',label:'Comfy'}]}
          onChange={v=>setTweak('density',v)}/>
        <window.TweakSection label="Theme"/>
        <window.TweakRadio label="Mode" value={theme}
          options={[{value:'light',label:'Light'},{value:'dark',label:'Dark'}]}
          onChange={onToggleTheme}/>
        <window.TweakColor label="Accent" value={t.accent}
          onChange={v=>{setTweak('accent',v); P.accent=v; setThemeTick(n=>n+1);}}/>
      </window.TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
