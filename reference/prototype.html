  // ────────────────────────────────────────────────
  // Pay Log view (B6)
  // ────────────────────────────────────────────────
  function PayLog({clients, onBack}){
    const [, force] = useState(0);
    useEffect(() => window.registerDpListener(() => force(n => n + 1)), []);
    const [showCancelled, setShowCancelled] = useState(window.getPayLogShowCancelled());

    // Build the column date range: earliest startDate → today + 4 weeks, weekly cadence.
    const today = todayDate();
    const sharedDates = window.SHARED_DATES || [];
    const sharedIdx = useMemo(() => buildDateIndex(), [clients.length]);

    const earliestStart = useMemo(() => {
      let earliest = null;
      for (const c of clients) {
        const d = parseStartDate(c.startDate);
        if (d && (!earliest || d < earliest)) earliest = d;
      }
      return earliest || addDays(today, -7 * 12);
    }, [clients]);

    // Build week column headers, anchored so SHARED_DATES alignment is preserved.
    // Use the latest shared date as our reference and step 7 days outward.
    const columns = useMemo(() => {
      const ref = sharedIdx.length ? sharedIdx[sharedIdx.length-1] : today;
      // Steps before ref (back to earliestStart) and after (4 weeks)
      const cols = [];
      // backward
      let d = ref;
      const back = [];
      while (d >= earliestStart) {
        back.push(d);
        d = addDays(d, -7);
      }
      back.reverse();
      cols.push(...back);
      // forward (4 weeks past today)
      let f = addDays(ref, 7);
      const stop = addDays(today, 28);
      while (f <= stop) {
        cols.push(f);
        f = addDays(f, 7);
      }
      return cols;
    }, [earliestStart, sharedIdx, today]);

    // For each column date, compute its index into SHARED_HISTORY (or null = not in history range).
    const colSharedIdxMap = useMemo(() => {
      return columns.map(c => {
        if (!sharedIdx.length) return null;
        const ref = sharedIdx[sharedIdx.length-1];
        const diffWeeks = Math.round((c - ref) / (7 * 24 * 3600 * 1000));
        const idx = sharedIdx.length - 1 + diffWeeks;
        if (idx < 0 || idx >= sharedIdx.length) return null;
        return idx;
      });
    }, [columns, sharedIdx]);

    function fmtCol(d){
      const day = d.getDate();
      const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
      return `${day} ${mon}`;
    }

    const rowsRaw = clients.filter(c => showCancelled ? true : c.status !== 'Cancelled');
    const rows = useMemo(() => rowsRaw.map(c => {
      const startD = parseStartDate(c.startDate);
      const cells = columns.map((colDate, ci) => {
        if (startD && colDate < addDays(startD, -3)) return {empty:true};
        const histIdx = colSharedIdxMap[ci];
        // Outside history but past startDate → use current status as fallback
        if (histIdx == null) {
          const fakeIdx = -1;
          // Simulate via a fake hist array that uses client.status
          const r = window.computeWeekPay({...c, history:undefined}, fakeIdx);
          return {amount: r.amount, reason: r.reason};
        }
        const r = window.computeWeekPay(c, histIdx);
        return {amount: r.amount, reason: r.reason};
      });
      const rowSum = cells.reduce((a,b) => a + (b.empty ? 0 : (b.amount || 0)), 0);
      const onboarding = window.computeOnboardingBonus(c);
      const retention = window.computeRetentionBonus(c);
      const total = rowSum + onboarding + retention;
      return {client:c, startD, cells, rowSum, onboarding, retention, total};
    }), [rowsRaw, columns, colSharedIdxMap]);

    // Column totals (top totals row)
    const colTotals = useMemo(() => columns.map((_, ci) => {
      let sum = 0;
      for (const r of rows) {
        const cell = r.cells[ci];
        if (cell && !cell.empty) sum += cell.amount || 0;
      }
      return sum;
    }), [rows, columns]);

    // ── Sticky offsets for the 7 pinned columns
    const COL_W = [80, 90, 170, 100, 100, 90, 100]; // $/Week, Start, Client, Onboarding, Retention, Wks, Total
    const offsets = COL_W.reduce((acc, w, i) => { acc.push((acc[i-1] || 0) + (i===0?0:COL_W[i-1])); return acc; }, []);
    // Above produces wrong: we want left-cumulative where offset[0]=0, offset[1]=COL_W[0], etc.
    const leftOffsets = (() => {
      const o = [0];
      for (let i = 1; i < COL_W.length; i++) o.push(o[i-1] + COL_W[i-1]);
      return o;
    })();

    function reasonStyle(reason){
      switch (reason) {
        case 'full': return {bg:P.accentSoft, fg:P.accentDeep};
        case 'ghosted-50': return {bg:P.warnSoft || '#fef3c7', fg:'#7a5b00'};
        case 'ghosted-zero': return {bg:P.dangerSoft || '#fee2e2', fg:'#7f1d1d'};
        case 'paused': return {bg:P.textMuted, fg:'#fff', label:'P'};
        case 'cancelled': return {bg:P.panel2, fg:P.textMuted, label:'C'};
        default: return {bg:'transparent', fg:P.textMuted};
      }
    }

    const stickyHead = (i) => ({
      position:'sticky',top:0,left:leftOffsets[i],zIndex:5,
      background:P.panel3,
      width:COL_W[i],minWidth:COL_W[i],
      padding:'10px 12px',fontSize:10.5,fontWeight:600,color:P.textMuted,
      textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap',
      borderBottom:`1px solid ${P.border}`,
      borderRight: i===COL_W.length-1 ? `2px solid ${P.border}` : `1px solid ${P.borderSoft}`,
      textAlign:'left',
    });
    const stickyCell = (i, extra={}) => ({
      position:'sticky',left:leftOffsets[i],zIndex:2,
      background:P.panel,
      width:COL_W[i],minWidth:COL_W[i],
      padding:'10px 12px',fontSize:12,color:P.text,
      borderBottom:`1px solid ${P.borderSoft}`,
      borderRight: i===COL_W.length-1 ? `2px solid ${P.border}` : `1px solid ${P.borderSoft}`,
      whiteSpace:'nowrap',
      ...extra,
    });

    return (
      <div style={{flex:1,padding:'32px 40px',overflow:'hidden',display:'flex',flexDirection:'column',minWidth:0}}>
        {/* Header */}
        <div style={{marginBottom:20,display:'flex',justifyContent:'space-between',alignItems:'flex-end',gap:16,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:12,color:P.accent,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>Spreadsheet view</div>
            <div className="display" style={{fontSize:34}}>Pay Log</div>
          </div>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:P.textDim,cursor:'pointer'}}>
              <input
                type="checkbox"
                checked={showCancelled}
                onChange={e => { setShowCancelled(e.target.checked); window.setPayLogShowCancelled(e.target.checked); }}
              />
              Show cancelled
            </label>
            <button onClick={onBack} style={{
              appearance:'none',cursor:'pointer',fontFamily:'inherit',
              padding:'8px 14px',borderRadius:8,
              background:'transparent',border:`1px solid ${P.border}`,color:P.text,
              fontSize:12.5,fontWeight:600,
            }}>← Back to My Pay</button>
          </div>
        </div>

        {/* Spreadsheet */}
        <div style={{
          flex:1,minHeight:0,
          background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:12,
          overflow:'auto',position:'relative',
        }}>
          <table style={{borderCollapse:'separate',borderSpacing:0,fontSize:12,width:'max-content'}}>
            <thead>
              <tr>
                {['$/Week','Start Date','Client','Onboarding','Retention','Wks Active','Total'].map((h,i) => (
                  <th key={i} style={stickyHead(i)}>{h}</th>
                ))}
                {columns.map((d, i) => (
                  <th key={i} style={{
                    position:'sticky',top:0,zIndex:3,
                    background:P.panel3,
                    padding:'10px 10px',fontSize:10.5,fontWeight:600,color:P.textMuted,
                    textTransform:'uppercase',letterSpacing:'.04em',whiteSpace:'nowrap',
                    borderBottom:`1px solid ${P.border}`,
                    borderRight:`1px solid ${P.borderSoft}`,
                    minWidth:64,textAlign:'center',
                  }}>{fmtCol(d)}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {/* Pinned totals row at top */}
              <tr>
                <td style={{...stickyCell(0, {background:P.panel2, fontWeight:700, zIndex:4})}}>—</td>
                <td style={{...stickyCell(1, {background:P.panel2, fontWeight:700, zIndex:4})}}>—</td>
                <td style={{...stickyCell(2, {background:P.panel2, fontWeight:700, zIndex:4})}}>Weekly totals</td>
                <td style={{...stickyCell(3, {background:P.panel2, fontWeight:700, zIndex:4, textAlign:'right'})}}>—</td>
                <td style={{...stickyCell(4, {background:P.panel2, fontWeight:700, zIndex:4, textAlign:'right'})}}>—</td>
                <td style={{...stickyCell(5, {background:P.panel2, fontWeight:700, zIndex:4, textAlign:'right'})}}>—</td>
                <td style={{...stickyCell(6, {background:P.panel2, fontWeight:700, zIndex:4, textAlign:'right'})}}>${colTotals.reduce((a,b)=>a+b,0)}</td>
                {colTotals.map((t,i) => (
                  <td key={i} style={{
                    background:P.panel2,fontWeight:700,
                    padding:'10px 10px',fontSize:11.5,color:P.text,
                    textAlign:'center',whiteSpace:'nowrap',
                    borderBottom:`1px solid ${P.border}`,
                    borderRight:`1px solid ${P.borderSoft}`,
                  }}>${t}</td>
                ))}
              </tr>
              {rows.map((r, ri) => (
                <tr key={r.client.name}>
                  <td style={stickyCell(0)}>${r.client.plan === 'F' ? 15 : 25}</td>
                  <td style={stickyCell(1)}>{r.client.startDate || '—'}</td>
                  <td style={stickyCell(2)}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <Avatar name={r.client.name} size={22}/>
                      <span style={{fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:120}}>{r.client.name}</span>
                    </div>
                  </td>
                  <td style={{...stickyCell(3, {textAlign:'right', color:r.onboarding?P.text:P.textMuted})}}>{r.onboarding ? `$${r.onboarding}` : '—'}</td>
                  <td style={{...stickyCell(4, {textAlign:'right', color:r.retention?P.text:P.textMuted, fontWeight:r.retention?600:400})}}>{r.retention ? `$${r.retention}` : '—'}</td>
                  <td style={{...stickyCell(5, {textAlign:'right'})}}>{r.client.week}</td>
                  <td style={{...stickyCell(6, {textAlign:'right', fontWeight:700})}}>${r.total}</td>
                  {r.cells.map((cell, ci) => {
                    if (cell.empty) {
                      return (
                        <td key={ci} style={{
                          padding:'10px 10px',
                          borderBottom:`1px solid ${P.borderSoft}`,
                          borderRight:`1px solid ${P.borderSoft}`,
                          background:P.panel,
                        }}/>
                      );
                    }
                    const s = reasonStyle(cell.reason);
                    return (
                      <td key={ci} style={{
                        padding:'10px 10px',
                        textAlign:'center',whiteSpace:'nowrap',
                        background:s.bg,color:s.fg,
                        fontWeight:cell.reason==='full'?600:500,
                        borderBottom:`1px solid ${P.borderSoft}`,
                        borderRight:`1px solid ${P.borderSoft}`,
                        fontSize:11.5,
                      }}>
                        {s.label ? s.label : (cell.amount > 0 ? `$${cell.amount}` : (cell.amount === 0 ? '$0' : ''))}
                      </td>
                    );
                  })}
                </tr>
              ))}
              {rows.length === 0 && (
                <tr><td colSpan={7 + columns.length} style={{padding:30,textAlign:'center',color:P.textMuted}}>No clients to show.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  window.MyPay = MyPay;
})();

</script>
<script type="text/babel" data-source="view-audits.jsx">
// Client Audits — Hybrid layout.
// Top tabs: All / Due / Overdue / Completed filter the cards.
// Below tabs: 4-column kanban (W4 · W8 · W12 · W16) groups by milestone.

(function(){
  const { useState, useEffect, useMemo, useRef } = React;
  const P = window.P, Icon = window.Icon, ICONS = window.ICONS,
        Avatar = window.Avatar, Pill = window.Pill;

  const MILESTONES = [4, 8, 12, 16];

  const RATING_COLOR = {
    Great:   {bg:'#d4ecc9', fg:'#1f5a1f'},
    Good:    {bg:'#e6f2df', fg:'#2d6a2d'},
    Average: {bg:'#fef3c7', fg:'#7a5b00'},
    Poor:    {bg:'#fde2dd', fg:'#8b2a1c'},
  };

  function ratingPill(label){
    const m = RATING_COLOR[label] || {bg:P.panel2, fg:P.textDim};
    return (
      <span style={{
        display:'inline-flex',alignItems:'center',
        background:m.bg,color:m.fg,
        fontSize:10.5,fontWeight:600,
        padding:'2px 8px',borderRadius:100,whiteSpace:'nowrap',
      }}>{label || '—'}</span>
    );
  }

  function ClientAudits(){
    const [, force] = useState(0);
    useEffect(() => window.registerDpListener(() => force(n => n + 1)), []);

    const [auditData, setAuditData] = useState(() => window.loadAuditData());
    // Re-load audit data when client data refreshes too
    useEffect(() => {
      const off = window.registerDpListener(() => setAuditData(window.loadAuditData()));
      return off;
    }, []);

    const [tab, setTab] = useState('All');
    // expandMap keyed by `${name}::${milestone}` -> bool. undefined => follow global.
    const [expandMap, setExpandMap] = useState({});
    const [globalExpand, setGlobalExpand] = useState(true);

    function persistAudit(clientName, milestone, patch){
      setAuditData(prev => {
        const next = {...prev};
        const forClient = {...(next[clientName] || {})};
        const forWk = {...(forClient[milestone] || {})};
        Object.assign(forWk, patch);
        forClient[milestone] = forWk;
        next[clientName] = forClient;
        window.saveAuditData(next);
        return next;
      });
    }

    const clients = window.clients || [];

    // Bucket each non-Paused/Cancelled client into Due / Overdue / Completed.
    // Priority: Due > Overdue > Completed (a client appears in only one).
    const buckets = useMemo(() => {
      const due = [], overdue = [], completed = [];
      for (const c of clients) {
        if (c.status === 'Paused' || c.status === 'Cancelled') continue;

        const records = auditData[c.name] || {};

        // Is the client currently AT a milestone week?
        const atMilestone = MILESTONES.includes(c.week);
        const currentRec = atMilestone ? (records[c.week] || null) : null;
        const dueNow = atMilestone && (!currentRec || !currentRec.completedDate);

        // Earliest previous milestone with no completedDate.
        let earliestOverdue = null;
        for (const m of MILESTONES) {
          if (m < c.week) {
            const r = records[m];
            if (!r || !r.completedDate) { earliestOverdue = m; break; }
          }
        }

        if (dueNow) {
          due.push({client:c, milestone:c.week, source:'due'});
        } else if (earliestOverdue !== null) {
          overdue.push({client:c, milestone:earliestOverdue, source:'overdue'});
        } else {
          // Most recent completed milestone — only show if any completed exist.
          let lastDone = null;
          for (const m of MILESTONES) {
            const r = records[m];
            if (r && r.completedDate) lastDone = m;
          }
          if (lastDone !== null) {
            completed.push({client:c, milestone:lastDone, source:'completed'});
          }
        }
      }
      // Stable sort by name
      const byName = (a,b) => a.client.name.localeCompare(b.client.name);
      due.sort(byName); overdue.sort(byName); completed.sort(byName);
      return {Due:due, Overdue:overdue, Completed:completed};
    }, [clients, auditData]);

    const counts = {
      All: buckets.Due.length + buckets.Overdue.length + buckets.Completed.length,
      Due: buckets.Due.length,
      Overdue: buckets.Overdue.length,
      Completed: buckets.Completed.length,
    };
    const totalUp = counts.Due + counts.Overdue;

    // Build the active list of items for the selected tab.
    const activeList = useMemo(() => {
      if (tab === 'All') return [...buckets.Due, ...buckets.Overdue, ...buckets.Completed];
      return buckets[tab] || [];
    }, [tab, buckets]);

    // Group items by milestone week.
    const byMilestone = useMemo(() => {
      const out = {4:[], 8:[], 12:[], 16:[]};
      for (const item of activeList) {
        if (out[item.milestone]) out[item.milestone].push(item);
      }
      // Within a column, order: due first, then overdue, then completed (already sorted by name within each).
      const order = {due:0, overdue:1, completed:2};
      for (const m of MILESTONES) {
        out[m].sort((a,b) => {
          const da = order[a.source] - order[b.source];
          if (da !== 0) return da;
          return a.client.name.localeCompare(b.client.name);
        });
      }
      return out;
    }, [activeList]);

    function setCardExpanded(key, val){
      setExpandMap(prev => ({...prev, [key]: val}));
    }
    function toggleCard(key){
      setExpandMap(prev => {
        const cur = prev[key];
        const effective = cur === undefined ? globalExpand : cur;
        return {...prev, [key]: !effective};
      });
    }
    function expandAll(){
      setGlobalExpand(true);
      setExpandMap({}); // clear overrides so all follow global
    }
    function collapseAll(){
      setGlobalExpand(false);
      setExpandMap({});
    }

    const tabBtn = (key) => {
      const on = tab === key;
      const tone = key==='Overdue' ? P.danger : key==='Completed' ? P.positive : P.accent;
      const onBg = key==='Overdue' ? (P.dangerSoft||'#fde2dd')
                 : key==='Completed' ? (P.positiveSoft||'#e6f2df')
                 : P.accentSoft;
      const onFg = key==='Overdue' ? P.danger
                 : key==='Completed' ? P.positive
                 : (P.accentDeep||P.accent);
      return (
        <button key={key} onClick={()=>setTab(key)} style={{
          appearance:'none',cursor:'pointer',fontFamily:'inherit',
          padding:'8px 14px',borderRadius:8,
          border:`1px solid ${on ? tone : P.borderSoft}`,
          background: on ? P.panel : 'transparent',
          color: on ? P.text : P.textDim,
          fontSize:13,fontWeight:on?600:500,
          display:'inline-flex',alignItems:'center',gap:8,
        }}>
          {key}
          <span style={{
            fontSize:10.5,fontWeight:600,padding:'1px 7px',borderRadius:100,
            background: on ? onBg : P.panel2,
            color: on ? onFg : P.textMuted,
          }}>{counts[key]}</span>
        </button>
      );
    };

    const ctrlBtn = {
      appearance:'none',cursor:'pointer',fontFamily:'inherit',
      background:P.panel,border:`1px solid ${P.borderSoft}`,color:P.textDim,
      fontSize:12,fontWeight:500,padding:'6px 11px',borderRadius:8,
    };

    return (
      <div style={{flex:1,padding:'32px 40px',overflowY:'auto',display:'flex',flexDirection:'column',minWidth:0}}>
        {/* Header */}
        <div style={{marginBottom:20,display:'flex',justifyContent:'space-between',alignItems:'flex-end',gap:16,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:12,color:P.accent,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>QA Review · 4-week cadence</div>
            <div className="display" style={{fontSize:34}}>Client Audits</div>
          </div>
          <div style={{fontSize:12.5,color:P.textDim}}>
            <b style={{color:P.text,fontWeight:600}}>{totalUp}</b> client{totalUp===1?'':'s'} up for audit this week
          </div>
        </div>

        {/* Tabs */}
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}}>
          {['All','Due','Overdue','Completed'].map(tabBtn)}
        </div>

        {/* Expand / collapse controls */}
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginBottom:14}}>
          <button onClick={collapseAll} style={ctrlBtn}>Collapse all</button>
          <button onClick={expandAll} style={ctrlBtn}>Expand all</button>
        </div>

        {/* Kanban: 4 columns by milestone — no horizontal scroll */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,minWidth:0}}>
          {MILESTONES.map(m => {
            const colItems = byMilestone[m] || [];
            return (
              <div key={m} style={{minWidth:0,display:'flex',flexDirection:'column',gap:14}}>
                {/* Column header */}
                <div style={{
                  display:'flex',alignItems:'center',justifyContent:'space-between',gap:6,
                  padding:'4px 2px',
                }}>
                  <span style={{
                    fontSize:13,fontWeight:700,color:P.accent,letterSpacing:'.04em',
                  }}>W{m}</span>
                  <span style={{
                    fontSize:10.5,fontWeight:600,padding:'1px 7px',borderRadius:100,
                    background:P.panel2,color:P.textMuted,
                  }}>{colItems.length}</span>
                </div>

                {colItems.length === 0 ? (
                  <div style={{
                    background:P.panel2,border:`1px dashed ${P.borderSoft}`,borderRadius:12,
                    padding:'18px 8px',textAlign:'center',
                    color:P.textMuted,fontSize:13,minWidth:0,
                  }}>—</div>
                ) : (
                  colItems.map(({client, milestone, source}) => {
                    const key = client.name + '::' + milestone;
                    const override = expandMap[key];
                    const expanded = override === undefined ? globalExpand : override;
                    return (
                      <div key={key} style={{width:'100%',minWidth:0}}>
                        <AuditCard
                          client={client}
                          milestone={milestone}
                          record={(auditData[client.name] || {})[milestone] || {}}
                          prevRecords={auditData[client.name] || {}}
                          onPersist={persistAudit}
                          expanded={expanded}
                          onToggle={()=>toggleCard(key)}
                          tab={tab}
                          source={source}
                        />
                      </div>
                    );
                  })
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  function AuditCard({client, milestone, record, prevRecords, onPersist, expanded, onToggle, tab, source}){
    const completed = !!record.completedDate;
    const [showHistory, setShowHistory] = useState(false);
    const [notesLocal, setNotesLocal] = useState(record.notes || '');
    const notesTimer = useRef(null);

    // Sync local notes when external record changes (e.g. listener refresh)
    useEffect(() => {
      if ((record.notes || '') !== notesLocal && document.activeElement?.dataset?.dpNotesFor !== client.name+':'+milestone) {
        setNotesLocal(record.notes || '');
      }
      // eslint-disable-next-line
    }, [record.notes]);

    const delta = (client.weight?.current ?? 0) - (client.weight?.start ?? 0);
    const deltaColor = delta < 0 ? P.positive : delta > 0 ? P.warn : P.textDim;
    const deltaSign = delta > 0 ? '+' : delta < 0 ? '−' : '';

    function commit(patch){
      onPersist(client.name, milestone, patch);
    }

    function onNotesChange(e){
      const v = e.target.value;
      setNotesLocal(v);
      if (notesTimer.current) clearTimeout(notesTimer.current);
      notesTimer.current = setTimeout(() => {
        commit({notes: v});
      }, 800);
    }
    function onNotesBlur(){
      if (notesTimer.current) { clearTimeout(notesTimer.current); notesTimer.current = null; }
      commit({notes: notesLocal});
    }

    function markComplete(){
      const today = new Date().toISOString().slice(0,10);
      commit({completedDate: today});
    }

    const previous = Object.entries(prevRecords)
      .filter(([k, v]) => Number(k) < milestone && v && v.completedDate)
      .sort((a,b) => Number(a[0]) - Number(b[0]));

    const inputBase = {
      width:'100%',
      background:P.panel,
      border:`1px solid ${P.border}`,
      borderRadius:8,
      padding:'7px 10px',
      fontSize:12.5,
      color:P.text,
      fontFamily:'inherit',
      boxSizing:'border-box',
      outline:'none',
    };

    // Chevron path (down when expanded, right when collapsed). Use ICONS if present.
    const chevDown = ICONS.chevron_down || 'M6 9l6 6 6-6';
    const chevRight = ICONS.chevron_right || 'M9 6l6 6-6 6';

    return (
      <div style={{
        background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,
        padding:18,display:'flex',flexDirection:'column',gap:expanded?12:0,
        opacity: completed ? 0.78 : 1,
        transition:'opacity .15s',
      }}>
        {/* Header — name on top, week + status underneath, chevron at right */}
        <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
          <Avatar name={client.name} size={32}/>
          <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:5}}>
            <div style={{fontSize:14,fontWeight:600,color:P.text,lineHeight:1.2,wordBreak:'break-word'}}>{client.name}</div>
            <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
              <span style={{
                fontSize:10.5,fontWeight:700,padding:'2px 7px',borderRadius:6,
                background:P.accentSoft,color:P.accentDeep,letterSpacing:'.03em',
              }}>W{milestone}</span>
              <Pill status={client.status} small/>
              {tab === 'Completed' && record.completedDate && (
                <span style={{
                  fontSize:10.5,fontWeight:600,padding:'2px 8px',borderRadius:100,
                  background:P.positiveSoft||'#e6f2df',color:P.positive,
                }}>Completed {record.completedDate}</span>
              )}
              {tab === 'Overdue' && (
                <span style={{
                  fontSize:10.5,fontWeight:600,padding:'2px 8px',borderRadius:100,
                  background:P.dangerSoft||'#fde2dd',color:P.danger,
                }}>Overdue</span>
              )}
              {tab === 'All' && source === 'due' && (
                <span style={{
                  fontSize:10.5,fontWeight:600,padding:'2px 8px',borderRadius:100,
                  background:P.accentSoft,color:P.accentDeep||P.accent,
                }}>Due</span>
              )}
              {tab === 'All' && source === 'overdue' && (
                <span style={{
                  fontSize:10.5,fontWeight:600,padding:'2px 8px',borderRadius:100,
                  background:P.dangerSoft||'#fde2dd',color:P.danger,
                }}>Overdue</span>
              )}
              {tab === 'All' && source === 'completed' && record.completedDate && (
                <span style={{
                  fontSize:10.5,fontWeight:600,padding:'2px 8px',borderRadius:100,
                  background:P.positiveSoft||'#e6f2df',color:P.positive,
                }}>Completed {record.completedDate}</span>
              )}
            </div>
          </div>
          <button
            onClick={onToggle}
            aria-label={expanded?'Collapse':'Expand'}
            style={{
              appearance:'none',background:'transparent',border:'none',cursor:'pointer',
              padding:4,color:P.textMuted,display:'flex',alignItems:'center',
            }}
          >
            <Icon d={expanded ? chevDown : chevRight} size={16}/>
          </button>
        </div>

        {expanded && (
          <>
        {/* Weight row */}
        <div style={{
          display:'flex',gap:10,fontSize:11.5,color:P.textDim,
          paddingBottom:10,borderBottom:`1px solid ${P.borderSoft}`,
          flexWrap:'wrap',
        }}>
          <span>Start: <b style={{color:P.text,fontWeight:600}}>{client.weight?.start ?? '—'}kg</b></span>
          <span style={{color:P.textMuted}}>·</span>
          <span>Now: <b style={{color:P.text,fontWeight:600}}>{client.weight?.current ?? '—'}kg</b></span>
          <span style={{marginLeft:'auto',color:deltaColor,fontWeight:600}}>{deltaSign}{Math.abs(delta)}kg</span>
        </div>

        {/* Two pills row */}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontSize:10.5,color:P.textMuted,letterSpacing:'.05em',textTransform:'uppercase',fontWeight:600,marginRight:2}}>Full transformation</span>
          <span style={{
            fontSize:10.5,fontWeight:600,padding:'2px 8px',borderRadius:100,
            background: client.transPhoto ? P.accentSoft : P.panel2,

  // ─────────────────────────────────────────────────────────────
  // Lightweight markdown renderer for SOP body content.
  // Handles: **bold** (inline), bullet lists (- / *), numbered lists,
  // section headers (whole line wrapped in **...**), and paragraphs.
  // ─────────────────────────────────────────────────────────────
  function renderInlineBold(text, keyPrefix){
    // Split on **...** preserving the wrapped sections
    const parts = text.split(/(\*\*[^*]+\*\*)/g);
    return parts.map((part, i) => {
      if (part.startsWith('**') && part.endsWith('**') && part.length > 4) {
        return (
          <strong key={`${keyPrefix}-b${i}`} style={{fontWeight:600,color:P.text}}>
            {part.slice(2, -2)}
          </strong>
        );
      }
      return <React.Fragment key={`${keyPrefix}-t${i}`}>{part}</React.Fragment>;
    });
  }

  function renderMarkdown(body){
    if (!body) return null;
    const blocks = body.split(/\n\n+/);
    const out = [];

    blocks.forEach((rawBlock, bi) => {
      const block = rawBlock.replace(/\s+$/,'').replace(/^\s+/,'');
      if (!block) return;

      const lines = block.split('\n');

      // Whole-block section header: a single line entirely wrapped in **...**
      if (lines.length === 1) {
        const m = block.match(/^\*\*(.+)\*\*$/);
        if (m) {
          out.push(
            <h4 key={`h-${bi}`} style={{
              fontSize:14.5,fontWeight:600,color:P.text,
              marginTop: bi === 0 ? 0 : 18,
              marginBottom:6,letterSpacing:'.01em',
            }}>
              {m[1]}
            </h4>
          );
          return;
        }
      }

      // Bulleted list — every non-empty line starts with "- " or "* "
      const isBullet = lines.every(l => /^\s*[-*]\s+/.test(l));
      if (isBullet && lines.length >= 1) {
        out.push(
          <ul key={`ul-${bi}`} style={{
            marginLeft:0,paddingLeft:18,marginTop:0,marginBottom:12,
            fontSize:14,lineHeight:1.6,color:P.text,
          }}>
            {lines.map((l, li) => {
              const text = l.replace(/^\s*[-*]\s+/, '');
              return (
                <li key={`ul-${bi}-li-${li}`} style={{marginBottom:4}}>
                  {renderInlineBold(text, `ul-${bi}-li-${li}`)}
                </li>
              );
            })}
          </ul>
        );
        return;
      }

      // Numbered list — every non-empty line starts with "1. ", "2. " etc
      const isNumbered = lines.every(l => /^\s*\d+\.\s+/.test(l));
      if (isNumbered && lines.length >= 1) {
        out.push(
          <ol key={`ol-${bi}`} style={{
            marginLeft:0,paddingLeft:22,marginTop:0,marginBottom:12,
            fontSize:14,lineHeight:1.6,color:P.text,
          }}>
            {lines.map((l, li) => {
              const text = l.replace(/^\s*\d+\.\s+/, '');
              return (
                <li key={`ol-${bi}-li-${li}`} style={{marginBottom:4}}>
                  {renderInlineBold(text, `ol-${bi}-li-${li}`)}
                </li>
              );
            })}
          </ol>
        );
        return;
      }

      // Default — paragraph (may contain multiple lines + inline bold)
      out.push(
        <p key={`p-${bi}`} style={{
          fontSize:14,lineHeight:1.65,color:P.text,
          margin:'0 0 12px',whiteSpace:'pre-wrap',
        }}>
          {renderInlineBold(block, `p-${bi}`)}
        </p>
      );
    });

    return out;
  }

  function SopDetail({sop}){
    // Backwards-compat: support both `looms: [{label?, url}]` and legacy `loomUrl` string.
    const looms = sop.looms && sop.looms.length
      ? sop.looms
      : (sop.loomUrl ? [{url: sop.loomUrl}] : []);
    const hasDoc = sop.googleDocUrl && sop.googleDocUrl.length > 0;

    return (
      <div style={{flex:1,overflowY:'auto'}}>
        <div style={{padding:'28px 32px 24px',borderBottom:`1px solid ${P.borderSoft}`}}>
          <div style={{fontSize:11,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:8}}>{sop.category}</div>
          <div className="display" style={{fontSize:26,lineHeight:1.2,color:P.text}}>{sop.title}</div>
          {looms.length > 1 && (
            <div style={{fontSize:12,color:P.textDim,marginTop:6}}>{looms.length} parts</div>
          )}
        </div>

        <div style={{padding:'22px 32px'}}>
          {/* Summary card */}
          {sop.summary && (
            <div style={{
              background:P.panel2,border:`1px solid ${P.borderSoft}`,borderRadius:10,
              padding:'14px 16px',marginBottom:20,
            }}>
              <div style={{fontSize:10.5,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>Summary</div>
              <div style={{fontSize:13.5,lineHeight:1.6,color:P.text}}>{sop.summary}</div>
            </div>
          )}

          {/* Loom(s) */}
          {looms.length === 0 ? (
            <LoomEmbed url=""/>
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:18}}>
              {looms.map((l, i) => (
                <div key={i}>
                  {looms.length > 1 && (
                    <div style={{fontSize:11,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:8}}>
                      {l.label || `Part ${i+1}`}
                    </div>
                  )}
                  <LoomEmbed url={shareToEmbed(l.url)}/>
                </div>
              ))}
            </div>
          )}

          {/* Body content */}
          <div style={{marginTop:24}}>
            {renderMarkdown(sop.body)}
          </div>

          {/* Google Doc link */}
          {hasDoc && (
            <a href={sop.googleDocUrl} target="_blank" rel="noreferrer" style={{
              display:'inline-flex',alignItems:'center',gap:6,marginTop:24,
              fontSize:12.5,color:P.accent,fontWeight:600,textDecoration:'none',
              padding:'8px 12px',border:`1px solid ${P.borderSoft}`,borderRadius:8,
              background:P.panel,
            }}>
              Open original Google Doc →
            </a>
          )}
        </div>
      </div>
    );
  }

  function LoomEmbed({url}){
    if (url && url.length > 0) {
      return (
        <div style={{
          width:'100%',aspectRatio:'16/9',
          background:'#000',borderRadius:10,overflow:'hidden',
          border:`1px solid ${P.borderSoft}`,
        }}>
          <iframe
            src={url}
            title="Loom"
            style={{width:'100%',height:'100%',border:0,display:'block'}}
            allow="autoplay; fullscreen"
            allowFullScreen
          />
        </div>
      );
    }
    // Empty placeholder
    return (
      <div style={{
        width:'100%',aspectRatio:'16/9',
        background:P.panel2,
        borderRadius:10,
        border:`1px dashed ${P.border}`,
        display:'flex',alignItems:'center',justifyContent:'center',
        color:P.textMuted,
        flexDirection:'column',gap:10,
      }}>
        <div style={{
          width:54,height:54,borderRadius:'50%',
          background:P.panel,border:`1px solid ${P.borderSoft}`,
          display:'flex',alignItems:'center',justifyContent:'center',
          color:P.textDim,
        }}>
          {/* play triangle */}
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <div style={{fontSize:12,fontWeight:500}}>No Loom attached yet</div>
        <div style={{fontSize:11,color:P.textMuted}}>Loom embed will render here once a URL is added.</div>
      </div>
    );
  }

  window.Resources = Resources;
})();

</script>
<script type="text/babel" data-source="view-recipes.jsx">
// Recipe Index — shared team library.

(function(){
  const { useState, useEffect } = React;
  const P = window.P, Icon = window.Icon, ICONS = window.ICONS,
        Avatar = window.Avatar;

  // Placeholder image gradient generator (avoids real image files)
  const GRADIENTS = [
    'linear-gradient(135deg,#fde2b3,#e67e22)',
    'linear-gradient(135deg,#d9ebe1,#5a9e7a)',
    'linear-gradient(135deg,#fde2dd,#c0392b)',
    'linear-gradient(135deg,#e4e0fa,#7c6fd8)',
    'linear-gradient(135deg,#fef3c7,#d4a017)',
    'linear-gradient(135deg,#c7e3f0,#3f88a8)',
    'linear-gradient(135deg,#f4d0e4,#c13c8a)',
    'linear-gradient(135deg,#d4f2e5,#3aa673)',
  ];

  const RECIPES = [
    {title:'High-protein overnight oats',      tags:['Breakfast','High-protein'], kcal:420, protein:38, carbs:45, fats:12, rating:4.8},
    {title:'Chicken teriyaki meal-prep bowl',  tags:['Lunch','Meal prep'],         kcal:540, protein:45, carbs:55, fats:14, rating:4.9},
    {title:'One-pan salmon & greens',          tags:['Dinner','Low-carb'],         kcal:510, protein:40, carbs:12, fats:30, rating:4.6},
    {title:'Greek yoghurt berry parfait',      tags:['Breakfast','Snack'],         kcal:250, protein:24, carbs:28, fats:5,  rating:4.7},
    {title:'Peanut-butter protein shake',      tags:['Snack','High-protein'],      kcal:380, protein:35, carbs:22, fats:16, rating:4.5},
    {title:'Beef & veg stir fry',              tags:['Dinner','High-protein'],     kcal:580, protein:44, carbs:35, fats:26, rating:4.7},
    {title:'Tuna & white bean salad',          tags:['Lunch','Low-carb'],          kcal:430, protein:36, carbs:38, fats:12, rating:4.4},
    {title:'Egg white veggie scramble',        tags:['Breakfast','Low-carb'],      kcal:280, protein:28, carbs:14, fats:10, rating:4.3},
    {title:'Slow-cooker chilli con carne',     tags:['Dinner','Meal prep'],        kcal:560, protein:42, carbs:45, fats:22, rating:4.8},
    {title:'Sheet-pan chicken fajitas',        tags:['Dinner','Meal prep'],        kcal:490, protein:41, carbs:35, fats:18, rating:4.9},
    {title:'Banana & whey protein pancakes',   tags:['Breakfast','High-protein'],  kcal:410, protein:32, carbs:50, fats:8,  rating:4.7},
    {title:'Prawn & rice noodle bowl',         tags:['Lunch'],                     kcal:460, protein:34, carbs:60, fats:10, rating:4.5},
  ];

  const TAGS = ['All','Breakfast','Lunch','Dinner','Snack','High-protein','Low-carb'];

  const MEAL_TYPES = ['Breakfast','Lunch','Dinner','Snack'];
  const MODIFIERS = ['High-protein','Low-carb','Meal prep'];

  // Heart icon paths (filled and outlined). ICONS may not include a heart, so define inline.
  const HEART_FILLED = 'M12 21s-7.5-4.5-9.5-9.5C1.2 8 3.5 5 6.5 5c1.8 0 3.4 1 4.5 2.5C12.1 6 13.7 5 15.5 5c3 0 5.3 3 4 6.5C19.5 16.5 12 21 12 21z';
  const HEART_OUTLINED = 'M12 20.3s-6.7-4.1-8.5-8.5C2.2 8.5 4 6 6.5 6c1.6 0 3 .9 4 2.3l1.5 2 1.5-2c1-1.4 2.4-2.3 4-2.3 2.5 0 4.3 2.5 3 5.8C18.7 16.2 12 20.3 12 20.3z';

  function Recipes(){
    const [active, setActive] = useState('All');
    const [q, setQ] = useState('');
    const [showCollectionsOnly, setShowCollectionsOnly] = useState(false);
    const [favorites, setFavorites] = useState(()=>{
      try {
        const raw = localStorage.getItem('dp_recipe_favorites');
        if (raw) return new Set(JSON.parse(raw));
      } catch(e){}
      return new Set();
    });
    const [customRecipes, setCustomRecipes] = useState(()=>{
      try {
        const raw = localStorage.getItem('dp_custom_recipes');
        if (raw) return JSON.parse(raw);
      } catch(e){}
      return [];
    });
    const [addOpen, setAddOpen] = useState(false);

    useEffect(()=>{
      try { localStorage.setItem('dp_recipe_favorites', JSON.stringify(Array.from(favorites))); } catch(e){}
    }, [favorites]);

    useEffect(()=>{
      try { localStorage.setItem('dp_custom_recipes', JSON.stringify(customRecipes)); } catch(e){}
    }, [customRecipes]);

    useEffect(()=>{
      if (!addOpen) return;
      const onKey = (e)=>{ if (e.key==='Escape') setAddOpen(false); };
      window.addEventListener('keydown', onKey);
      return ()=>window.removeEventListener('keydown', onKey);
    }, [addOpen]);

    const toggleFavorite = (title)=>{
      setFavorites(prev=>{
        const next = new Set(prev);
        if (next.has(title)) next.delete(title); else next.add(title);
        return next;
      });
    };

    const merged = customRecipes.concat(RECIPES);

    const filtered = merged.filter(r=>{
      if (showCollectionsOnly && !favorites.has(r.title)) return false;
      if (active!=='All' && !r.tags.includes(active)) return false;
      if (q && !r.title.toLowerCase().includes(q.toLowerCase())) return false;
      return true;
    });

    const collectionsActive = showCollectionsOnly;

    return (
      <div style={{flex:1,padding:'32px 40px',overflow:'hidden',display:'flex',flexDirection:'column'}}>
        <div style={{marginBottom:20,display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
          <div>
            <div style={{fontSize:12,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>Shared team library · {merged.length} recipes · contributed by 3 coaches</div>
            <div className="display" style={{fontSize:34}}>Recipe Index</div>
          </div>
          <div style={{display:'flex',gap:6}}>
            <button onClick={()=>setShowCollectionsOnly(v=>!v)} style={{display:'flex',alignItems:'center',gap:6,background:collectionsActive?P.accent:P.panel,border:collectionsActive?'none':`1px solid ${P.border}`,color:collectionsActive?'#fff':P.text,fontSize:12.5,fontWeight:collectionsActive?600:400,padding:collectionsActive?'8px 13px':'7px 12px',borderRadius:8,cursor:'pointer',fontFamily:'inherit'}}>
              <Icon d={ICONS.folder} size={13}/> My collections
            </button>
            <button onClick={()=>setAddOpen(true)} style={{display:'flex',alignItems:'center',gap:6,background:P.accent,color:'#fff',border:'none',fontSize:12.5,fontWeight:600,padding:'8px 14px',borderRadius:8,cursor:'pointer',fontFamily:'inherit'}}>
              <Icon d={ICONS.plus} size={13}/> Add recipe
            </button>
          </div>
        </div>

        {/* Toolbar */}
        <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:14}}>
          <div style={{display:'flex',alignItems:'center',gap:8,background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:8,padding:'7px 12px',flex:1,maxWidth:320}}>
            <span style={{color:P.textMuted,display:'flex'}}><Icon d={ICONS.search} size={14}/></span>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search recipes…" style={{border:'none',outline:'none',background:'transparent',flex:1,fontSize:13,fontFamily:'inherit',color:P.text}}/>
          </div>
          <div style={{marginLeft:'auto',fontSize:12,color:P.textMuted}}>{filtered.length} showing</div>
        </div>

        {/* Tag filter pills */}
        <div style={{display:'flex',gap:6,marginBottom:18,flexWrap:'wrap'}}>
          {TAGS.map(tag=>{
            const on = tag===active;
            return (
              <button key={tag} onClick={()=>setActive(tag)} style={{
                appearance:'none',border:`1px solid ${on?P.text:P.borderSoft}`,cursor:'pointer',
                padding:'5px 11px',fontSize:12,borderRadius:100,fontFamily:'inherit',
                background:on?P.text:P.panel,
                color:on?'#fff':P.textDim,fontWeight:500,
              }}>{tag}</button>
            );
          })}
        </div>

        {/* Grid */}
        <div style={{flex:1,overflowY:'auto',paddingRight:4}}>
          {showCollectionsOnly && favorites.size===0 ? (
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',minHeight:240,textAlign:'center',color:P.textDim,fontSize:13,padding:24}}>
              <div>
                <div style={{display:'flex',justifyContent:'center',marginBottom:10,color:P.textMuted}}>
                  <Icon d={HEART_OUTLINED} size={28}/>
                </div>
                <div style={{fontWeight:600,color:P.text,fontSize:14,marginBottom:4}}>No favorites yet.</div>
                <div>Tap the heart on any recipe to add it to your collection.</div>
              </div>
            </div>
          ) : (
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:16,paddingBottom:20}}>
              {filtered.map((r,i)=>{
                const idx = merged.indexOf(r);
                return <RecipeCard key={r.title+'_'+i} r={r} gIdx={idx>=0?idx:i} isFav={favorites.has(r.title)} onToggleFav={()=>toggleFavorite(r.title)}/>;
              })}
            </div>
          )}
        </div>

        {addOpen && <AddRecipeModal onClose={()=>setAddOpen(false)} onSubmit={(rec)=>{
          setCustomRecipes(prev=>[rec, ...prev]);
          setAddOpen(false);
        }}/>}
      </div>
    );
  }

  function RecipeCard({r, gIdx, isFav, onToggleFav}){
    return (
      <div style={{background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,overflow:'hidden',cursor:'pointer',display:'flex',flexDirection:'column'}}
        onMouseEnter={e=>{e.currentTarget.style.borderColor=P.border}}
        onMouseLeave={e=>{e.currentTarget.style.borderColor=P.borderSoft}}
      >
        {/* Image placeholder */}
        <div style={{height:140,background:GRADIENTS[gIdx%GRADIENTS.length],position:'relative',display:'flex',alignItems:'flex-end',padding:12}}>
          <button onClick={(e)=>{e.stopPropagation(); onToggleFav && onToggleFav();}} style={{position:'absolute',top:10,left:10,background:'rgba(255,255,255,.9)',border:'none',width:28,height:28,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',padding:0}}>
            <span style={{color:isFav?P.accent:P.textDim,display:'flex'}}>
              <Icon d={isFav?HEART_FILLED:HEART_OUTLINED} size={14} fill={isFav}/>
            </span>
          </button>
          <span style={{position:'absolute',top:10,right:10,background:'rgba(255,255,255,.9)',padding:'3px 9px',borderRadius:100,fontSize:11,fontWeight:600,color:P.text,display:'flex',alignItems:'center',gap:4}}>
            <span style={{color:P.warn,display:'flex'}}><Icon d={ICONS.star} size={11} fill={true}/></span>
            {r.rating}
          </span>
          <span style={{background:'rgba(26,26,31,.75)',color:'#fff',padding:'3px 10px',borderRadius:100,fontSize:11,fontWeight:600,backdropFilter:'blur(6px)'}}>{r.tags[0] || 'Recipe'}</span>
        </div>

        <div style={{padding:'14px 16px 16px',display:'flex',flexDirection:'column',gap:10,flex:1}}>
          <div style={{fontSize:14,fontWeight:600,color:P.text,lineHeight:1.3}}>{r.title}</div>

          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,fontSize:11,color:P.textDim}}>
            <div><div style={{fontSize:10,color:P.textMuted,letterSpacing:'.05em',textTransform:'uppercase',fontWeight:600,marginBottom:1}}>Cals</div><div style={{color:P.text,fontWeight:600,fontSize:13}}>{r.kcal}</div></div>
            <div><div style={{fontSize:10,color:P.textMuted,letterSpacing:'.05em',textTransform:'uppercase',fontWeight:600,marginBottom:1}}>Protein</div><div style={{color:P.text,fontWeight:600,fontSize:13}}>{r.protein}g</div></div>
            <div><div style={{fontSize:10,color:P.textMuted,letterSpacing:'.05em',textTransform:'uppercase',fontWeight:600,marginBottom:1}}>Carbs</div><div style={{color:P.text,fontWeight:600,fontSize:13}}>{r.carbs}g</div></div>
            <div><div style={{fontSize:10,color:P.textMuted,letterSpacing:'.05em',textTransform:'uppercase',fontWeight:600,marginBottom:1}}>Fats</div><div style={{color:P.text,fontWeight:600,fontSize:13}}>{r.fats}g</div></div>
          </div>

          <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:'auto'}}>
            {r.tags.slice(1,3).map((t,i)=>(
              <span key={i} style={{background:P.panel2,color:P.textDim,padding:'1px 8px',borderRadius:100,fontSize:10.5,fontWeight:500}}>{t}</span>
            ))}
          </div>
        </div>
      </div>
    );
  }

  function AddRecipeModal({onClose, onSubmit}){
    const [title, setTitle] = useState('');
    const [kcal, setKcal] = useState('');
    const [protein, setProtein] = useState('');
    const [carbs, setCarbs] = useState('');
    const [fats, setFats] = useState('');
    const [tags, setTags] = useState([]);
    const [err, setErr] = useState('');

    const toggleTag = (t)=>{
      setTags(prev=> prev.includes(t) ? prev.filter(x=>x!==t) : prev.concat(t));
    };

    const submit = ()=>{
      if (!title.trim()){ setErr('Title is required'); return; }
      const rec = {
        title: title.trim(),
        tags: tags.length ? tags : ['Recipe'],
        kcal: Number(kcal)||0,
        protein: Number(protein)||0,
        carbs: Number(carbs)||0,
        fats: Number(fats)||0,
        rating: 4.5,
      };
      onSubmit(rec);
    };

    const inputStyle = {width:'100%',border:`1px solid ${P.borderSoft}`,background:P.panel2||P.panel,color:P.text,borderRadius:8,padding:'8px 10px',fontSize:13,fontFamily:'inherit',outline:'none',boxSizing:'border-box'};
    const labelStyle = {fontSize:11,color:P.textMuted,letterSpacing:'.05em',textTransform:'uppercase',fontWeight:600,marginBottom:6,display:'block'};

    return (
      <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
        <div onClick={e=>e.stopPropagation()} style={{width:520,maxWidth:'92vw',maxHeight:'90vh',overflowY:'auto',background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:16,padding:24,boxShadow:'0 20px 50px rgba(0,0,0,0.3)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:18}}>
            <div>
              <div style={{fontSize:11,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:4}}>New recipe</div>
              <div style={{fontSize:20,fontWeight:700,color:P.text}}>Add a recipe</div>
            </div>
            <button onClick={onClose} style={{background:'transparent',border:'none',cursor:'pointer',color:P.textMuted,padding:4,display:'flex',fontFamily:'inherit'}}>
              <Icon d={ICONS.close || ICONS.x || 'M6 6l12 12M18 6L6 18'} size={16}/>
            </button>
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div>
              <label style={labelStyle}>Title *</label>
              <input value={title} onChange={e=>{setTitle(e.target.value); if(err) setErr('');}} placeholder="e.g. Spinach feta wrap" style={inputStyle}/>
            </div>

            <div>
              <label style={labelStyle}>Image</label>
              <div style={{border:`1px dashed ${P.borderSoft}`,borderRadius:8,padding:'14px',textAlign:'center',color:P.textMuted,fontSize:12,background:P.panel2||'transparent'}}>
                Image upload coming soon
              </div>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
              <div>
                <label style={labelStyle}>Calories</label>
                <input type="number" value={kcal} onChange={e=>setKcal(e.target.value)} style={inputStyle}/>
              </div>
              <div>
                <label style={labelStyle}>Protein g</label>
                <input type="number" value={protein} onChange={e=>setProtein(e.target.value)} style={inputStyle}/>
              </div>
              <div>
                <label style={labelStyle}>Carbs g</label>
                <input type="number" value={carbs} onChange={e=>setCarbs(e.target.value)} style={inputStyle}/>
              </div>
              <div>
                <label style={labelStyle}>Fats g</label>
                <input type="number" value={fats} onChange={e=>setFats(e.target.value)} style={inputStyle}/>
              </div>
            </div>

            <div>
              <label style={labelStyle}>Meal type</label>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {MEAL_TYPES.map(t=>{
                  const on = tags.includes(t);
                  return (
                    <button key={t} onClick={()=>toggleTag(t)} style={{
                      appearance:'none',border:`1px solid ${on?P.text:P.borderSoft}`,cursor:'pointer',
                      padding:'5px 11px',fontSize:12,borderRadius:100,fontFamily:'inherit',
                      background:on?P.text:P.panel,color:on?'#fff':P.textDim,fontWeight:500,
                    }}>{t}</button>
                  );
                })}
              </div>
            </div>

            <div>
              <label style={labelStyle}>Modifiers</label>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {MODIFIERS.map(t=>{
                  const on = tags.includes(t);
                  return (
                    <button key={t} onClick={()=>toggleTag(t)} style={{
                      appearance:'none',border:`1px solid ${on?P.text:P.borderSoft}`,cursor:'pointer',
                      padding:'5px 11px',fontSize:12,borderRadius:100,fontFamily:'inherit',
                      background:on?P.text:P.panel,color:on?'#fff':P.textDim,fontWeight:500,
                    }}>{t}</button>
                  );
                })}
              </div>
            </div>

            {err && <div style={{color:P.danger||'#c0392b',fontSize:12}}>{err}</div>}

            <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:8}}>
              <button onClick={onClose} style={{background:P.panel,border:`1px solid ${P.border}`,color:P.text,fontSize:12.5,padding:'8px 14px',borderRadius:8,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
              <button onClick={submit} style={{background:P.accentSolid||P.accent,color:'#fff',border:'none',fontSize:12.5,fontWeight:600,padding:'8px 14px',borderRadius:8,cursor:'pointer',fontFamily:'inherit'}}>Add recipe</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  window.Recipes = Recipes;
})();

</script>
<script type="text/babel" data-source="view-quizzes.jsx">
// Quizzes — internal coach-knowledge quizzes.
// 4 quizzes, 100% pass mark, retry-missed loop until all correct.

(function(){
  const { useState, useMemo, useEffect, useRef } = React;
  const P = window.P, Icon = window.Icon, ICONS = window.ICONS;

  // ─────────────────────────────────────────────────────────────
  // Quiz data — 4 quizzes, plausible coaching-knowledge questions.
  // ─────────────────────────────────────────────────────────────
  const QUIZZES = [
    {
      id: 'comm',
      title: 'Communication & Coaching Fundamentals',
      description: 'Covers tone, response timing, message templates, and when to escalate inside a coach-client conversation.',
      expect: [
        '18 multiple-choice questions',
        'Mix of tone and judgement scenarios',
        'Pass mark: 100%',
      ],

  // ─────────────────────────────────────────────────────────────
  // Helpers

  function fmtTime(ms){
    if (ms < 0) ms = 0;
    const total = Math.floor(ms/1000);
    const m = Math.floor(total/60);
    const s = total % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // ─────────────────────────────────────────────────────────────
  // Main component
  // ─────────────────────────────────────────────────────────────
  function Quizzes(){
    const [view, setView] = useState('list'); // list | intro | active | retryNotice | pass
    const [activeQuizId, setActiveQuizId] = useState(null);

    // attempt state
    const [queue, setQueue] = useState([]);            // indices into the active quiz's questions array
    const [pos, setPos] = useState(0);                 // current index in queue
    const [missed, setMissed] = useState([]);          // indices for retry queue
    const [attempt, setAttempt] = useState(1);
    const [selected, setSelected] = useState(null);    // selected option index for current question
    const [revealed, setRevealed] = useState(false);   // whether wrong-answer reveal is shown
    const [feedback, setFeedback] = useState(null);    // 'correct' | 'wrong' | null

    // timer state — accumulates across attempts
    const [startedAt, setStartedAt] = useState(null);
    const [now, setNow] = useState(Date.now());
    const tickRef = useRef(null);

    useEffect(()=>{
      if (view === 'active' || view === 'retryNotice') {
        tickRef.current = setInterval(()=>setNow(Date.now()), 1000);
        return ()=>clearInterval(tickRef.current);
      }
    }, [view]);

    const activeQuiz = useMemo(
      ()=>QUIZZES.find(q=>q.id===activeQuizId) || null,
      [activeQuizId]
    );

    function openIntro(quizId){
      setActiveQuizId(quizId);
      setAttempt(1);
      setMissed([]);
      setSelected(null);
      setRevealed(false);
      setFeedback(null);
      setStartedAt(null);
      setView('intro');
    }

    function startQuiz(){
      if (!activeQuiz) return;
      const initQueue = activeQuiz.questions.map((_,i)=>i);
      setQueue(initQueue);
      setPos(0);
      setMissed([]);
      setSelected(null);
      setRevealed(false);
      setFeedback(null);
      setStartedAt(Date.now());
      setNow(Date.now());
      setView('active');
    }

    function handleSubmit(){
      if (selected == null || !activeQuiz) return;
      const qIdx = queue[pos];
      const q = activeQuiz.questions[qIdx];
      if (selected === q.correct) {
        setFeedback('correct');
        // brief flash, then advance
        setTimeout(()=>{
          advance();
        }, 380);
      } else {
        setFeedback('wrong');
        setRevealed(true);
        setMissed(m => m.includes(qIdx) ? m : [...m, qIdx]);
      }
    }

    function handleSkip(){
      if (!activeQuiz) return;
      const qIdx = queue[pos];
      setMissed(m => m.includes(qIdx) ? m : [...m, qIdx]);
      setFeedback(null);
      setRevealed(false);
      setSelected(null);
      // advance directly (skip is a wrong-but-no-reveal)
      stepForward();
    }

    function advance(){
      // called after correct answer flash, or after Continue on wrong
      stepForward();
    }

    function stepForward(){
      const nextPos = pos + 1;
      setSelected(null);
      setRevealed(false);
      setFeedback(null);
      if (nextPos < queue.length) {
        setPos(nextPos);
      } else {
        // queue done
        if (missed.length === 0) {
          setView('pass');
        } else {
          // build retry queue
          setView('retryNotice');
        }
      }
    }

    function startRetry(){
      // missed array is in the original-order of the source questions
      const retryQueue = [...missed].sort((a,b)=>a-b);
      setQueue(retryQueue);
      setPos(0);
      setMissed([]);
      setSelected(null);
      setRevealed(false);
      setFeedback(null);
      setAttempt(a=>a+1);
      setView('active');
    }

    function backToList(){
      setView('list');
      setActiveQuizId(null);
      setQueue([]);
      setPos(0);
      setMissed([]);
      setSelected(null);
      setRevealed(false);
      setFeedback(null);
      setStartedAt(null);
      setAttempt(1);
    }

    const elapsed = startedAt ? (now - startedAt) : 0;

    // ──────────────── Render ────────────────
    return (
      <div style={{flex:1,padding:'32px 40px',overflowY:'auto',display:'flex',flexDirection:'column'}}>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:12,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>Internal coach knowledge · Pass mark 100%</div>
          <div className="display" style={{fontSize:34}}>Quizzes</div>
        </div>

        {view === 'list' && (
          <QuizList quizzes={QUIZZES} onPick={openIntro}/>
        )}

        {view === 'intro' && activeQuiz && (
          <QuizIntro
            quiz={activeQuiz}
            attempt={attempt}
            onStart={startQuiz}
            onBack={backToList}
          />
        )}

        {view === 'active' && activeQuiz && queue.length > 0 && (
          <QuizActive
            quiz={activeQuiz}
            queue={queue}
            pos={pos}
            attempt={attempt}
            elapsed={elapsed}
            selected={selected}
            setSelected={setSelected}
            revealed={revealed}
            feedback={feedback}
            onSubmit={handleSubmit}
            onSkip={handleSkip}
            onContinue={advance}
          />
        )}

        {view === 'retryNotice' && activeQuiz && (
          <RetryNotice
            count={missed.length}
            onContinue={startRetry}
            elapsed={elapsed}
          />
        )}

        {view === 'pass' && activeQuiz && (
          <QuizPass
            quiz={activeQuiz}
            attempts={attempt}
            elapsed={elapsed}
            onBack={backToList}
          />
        )}
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // Active view
  // ─────────────────────────────────────────────────────────────
  function QuizActive({quiz, queue, pos, attempt, elapsed, selected, setSelected, revealed, feedback, onSubmit, onSkip, onContinue}){
    const qIdx = queue[pos];
    const q = quiz.questions[qIdx];
    const total = queue.length;

    const flashBg = feedback === 'correct'
      ? P.positiveSoft
      : (feedback === 'wrong' ? P.dangerSoft : P.panel);

    return (
      <div style={{maxWidth:640,width:'100%',margin:'0 auto'}}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:14}}>
          <div style={{
            fontSize:11,color:P.textMuted,letterSpacing:'.08em',
            textTransform:'uppercase',fontWeight:600,
          }}>{quiz.title}</div>
          <div style={{flex:1}}/>
          <div style={{fontSize:12,color:P.textDim,fontWeight:500}}>
            Q {pos+1} of {total}
          </div>
          <div style={{
            fontSize:11.5,color:P.textMuted,fontFamily:'ui-monospace,monospace',
            background:P.panel,border:`1px solid ${P.borderSoft}`,
            borderRadius:6,padding:'2px 8px',
          }}>{fmtTime(elapsed)}</div>
        </div>

        {/* Progress bar */}
        <div style={{
          height:4,background:P.panel2,borderRadius:100,overflow:'hidden',marginBottom:18,
        }}>
          <div style={{
            height:'100%',width:`${((pos)/total)*100}%`,
            background:P.accent,transition:'width .25s ease',
          }}/>
        </div>

        {/* Card */}
        <div style={{
          background:flashBg,border:`1px solid ${P.borderSoft}`,borderRadius:16,
          padding:'24px 26px',transition:'background .25s',
        }}>
          <div style={{fontSize:11,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:8}}>
            {attempt > 1 ? `Retry · attempt ${attempt}` : 'Question'}
          </div>
          <div className="display" style={{fontSize:20,lineHeight:1.35,color:P.text,marginBottom:18}}>
            {q.q}
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {q.options.map((opt, i) => {
              const isSel = selected === i;
              const isCorrect = i === q.correct;
              let bg = P.panel;
              let bd = P.borderSoft;
              let fg = P.text;

              if (revealed) {
                if (isCorrect) { bg = P.positiveSoft; bd = P.positive; fg = P.text; }
                else if (isSel) { bg = P.dangerSoft; bd = P.danger; fg = P.text; }
              } else if (isSel) {

          loomUrl: '',
          body: `**What DPperformance actually is**

DPperformance is a lifestyle-first online coaching service. Our clients are professionals, parents, business owners, expats, students, and people who already have full lives. They want to look better, feel stronger, and trust the structure of a real plan — but they will not, and should not, blow up their week to chase a physique. The job of a DPperformance coach is to deliver structured progress without breaking the rest of someone's life.

That sentence is the lens for every decision in this course. If a recommendation is "technically optimal" but it requires a client to weigh fish at a wedding, refuse a friend's birthday cake, or do fasted cardio at 4:30am because their plan has no flex, it is the wrong recommendation for our model. There are coaches who specialise in that — we are not them, and we are not trying to be.

**Lifestyle-first coaching**

Lifestyle-first means coaching that bends without breaking. Clients have weddings, holidays, work travel, sick kids, late nights, and bad weeks. Our plans assume that. We build:

- Meal-structured plans the client can actually run on a Tuesday and a Saturday
- Travel options, eat-out swaps, and named "easier" days for high-stress weeks
- Step targets and cardio levels that fit the client's actual schedule, not a fantasy one
- Communication that anticipates real-life friction instead of being surprised by it

When something disrupts the plan, we don't shame, we adjust. The client keeps moving. That is the DPperformance experience.

**Adherence beats perfection — every time**

Clean Health, Layne Norton, and every credible coach in the space agree on one thing: the best diet is the one the client will actually follow. We take that further. We design specifically so the client can follow it. A 90% adherent client on a 350-calorie deficit will out-progress a 60% adherent client on a 600-calorie deficit, every time. Our defaults are graduated and conservative for a reason — they leave headroom so adherence stays high.

Practical examples:

- We do not push hunger higher than necessary. If progress is on track, calories hold.
- We do not stack a deficit, low sleep, high cardio, and a stressful week on top of each other. We pick the lever that matters most.
- We do not punish a missed workout. We adjust forward and rebuild the week.

**Structured plans + flexibility within structure**

This is where we deliberately diverge from much of the wider industry. Many systems "graduate" intermediate clients into IIFYM — flexible dieting where the client tracks macros and chooses their own meals freely. We don't. Every DPperformance client gets a 3+2 (or similar) meal-structured plan, regardless of how experienced they are. Why:

- Adherence is higher when the next meal is already decided
- Decision fatigue is the #1 quiet killer of long-term plans
- Clients come to us for an answer, not a calorie budget

Inside that structure we are very flexible — swaps, eat-out options, travel kits, named easier days. Flexibility lives **inside** the structure, not instead of it.

**The macros exception.** If a client specifically asks to track macros instead of following a structured plan, we don't refuse — but the deal is conditional. They get the macro target, and they show us the logs. We monitor results. If progress stalls, our first move is to gently steer them back into a meal plan because we know decision fatigue is usually the cause. If after that conversation they still push hard for macros, we respect their autonomy and let them run it. We don't argue people into a system they don't want — we just stay accountable for the result, and we keep the door open to swap back if it's not working.

**Multi-system pluralism**

We have a default DP system (3+2 meal-structured, animal-protein-anchored, controlled carb cycling), but we are not religious about it. Coaches learn the default plus alternative frameworks: keto, intermittent fasting, vegan, Mediterranean, isocaloric, low-carb, and paleo. When a client's lifestyle, religion, ethics, or biology genuinely doesn't fit the default, we adapt the system to the client — never force the client into the system. The flag here is "genuine fit" — not novelty or trend chasing.

**Results without rigidity**

What a DPperformance client will get:
- A real, structured plan with named meals, swaps, training, cardio and steps
- A coach who replies thoughtfully, predicts what comes next, and sees them as a person
- Progress they can sustain — typically 5–10 kg over a 12-week cut, then a planned reverse
- Education they can keep — what their body did and why

What we will not ask of them:
- Aggressive deficits beyond the graduated cap, even on request
- Cardio over the weekly ceiling, even on request
- Pushing a deficit through multi-week symptoms — sleep, mood, performance, or adherence drops mean step out, not push through
- Anything that puts results above their physical or mental health

**How we differ from contest prep and generic gym coaching**

Two ends of the spectrum bracket where we sit. On one end is contest prep — extreme depletion, peak weeks, water and sodium manipulation, posing, federations. That world is its own sport, with coaches trained for it. We are not those coaches. On the other end is generic gym coaching — a PDF program, occasional WhatsApp tips, no real check-ins, no real plan. That model is too thin to actually move the needle for someone with a life.

DPperformance sits in the structured middle: a real, written plan; a real coach who reads every check-in; a real progression through phases; and a real respect for the client's actual schedule. That middle is where the durable physique work happens.

**What success looks like for a DPperformance client**

A real, visible transformation. The scale moved, the photos changed, the lifts went up — and the client still has a life. A 12-week cut down 6 kg with their social life, relationships, and job intact, and the discipline to repeat it next year if they want to — that is a DPperformance success.

Lifestyle-first does not mean soft. Transformations are the game. We are not running a wellness retreat. Clients pay us to deliver visible physical change, and we hold them — and ourselves — to that bar. The lifestyle frame just means we deliver that change without burning the client's existence to the ground in the process. It is genuinely harder than coaching someone who has nothing else going on, because we have to engineer real adherence inside real life.

The wrong success is a client who hit a scale number but burned out, lied on check-ins, hated training, or never wants to coach again. That's a system failure regardless of the photo. The other wrong success is a client who "felt great" and "loved the experience" but didn't actually transform — that's also a system failure, regardless of how nice the relationship was. Hold both edges. We are coaching, not babysitting.

**The frame to carry into the rest of the Academy**

Every later module — nutrition, training, cardio, check-ins, edge cases — is taught against the same lens. When you're deciding whether to push calories down another 100, the questions are: *Will it move the result? Can the client adhere to it without their life unravelling?* If both are yes, push. If only one is yes, hold. When you're tempted to add a fourth cardio session, same test. The lens is constant: drive the transformation, protect the life. We optimise for both — never just one.`,
