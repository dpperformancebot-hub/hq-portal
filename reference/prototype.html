            background:P.panel2,border:`1px solid ${P.borderSoft}`,borderRadius:12,
            padding:'18px 20px',display:'flex',alignItems:'center',gap:14,
          }}>
            <div style={{
              width:36,height:36,borderRadius:8,
              background:P.warnSoft,color:P.warn,
              display:'flex',alignItems:'center',justifyContent:'center',
            }}>
              <Icon d={ICONS.lock} size={16}/>
            </div>
            <div>
              <div style={{fontSize:13.5,fontWeight:600,color:P.text,marginBottom:3}}>Coming soon</div>
              <div style={{fontSize:12.5,color:P.textDim,lineHeight:1.5}}>
                Lessons and quiz for this module are in development. Module 1 is fully live.
              </div>
            </div>
          </div>
        )}

        {!mod.comingSoon && mod.lessons.length > 0 && (
          <>
            <div style={{
              fontSize:11,color:P.textMuted,letterSpacing:'.10em',textTransform:'uppercase',fontWeight:600,
              marginBottom:10,
            }}>Lessons</div>
            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:24}}>
              {mod.lessons.map(lesson => {
                const done = !!moduleData[lesson.id];
                return (
                  <div
                    key={lesson.id}
                    onClick={()=>onSelectLesson(lesson.id)}
                    style={{
                      background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:11,
                      padding:'16px 18px',cursor:'pointer',
                      transition:'border-color .12s, background .12s',
                      display:'flex',alignItems:'flex-start',gap:14,
                    }}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=P.border; e.currentTarget.style.background=P.panel2;}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor=P.borderSoft; e.currentTarget.style.background=P.panel;}}
                  >
                    <div style={{
                      width:32,height:32,borderRadius:'50%',
                      background: done ? P.positiveSoft : P.panel3,
                      color: done ? P.positive : P.textMuted,
                      display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
                      border: `1px solid ${done ? P.positive : P.borderSoft}`,
                      fontSize:11,fontWeight:700,
                    }}>
                      {done ? <Icon d={ICONS.check} size={14}/> : lesson.number}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{
                        fontSize:14.5,fontWeight:600,color:P.text,marginBottom:4,
                      }}>{lesson.title}</div>
                      <div style={{fontSize:12.5,color:P.textDim,lineHeight:1.5}}>
                        {lesson.summary}
                      </div>
                    </div>
                    <div style={{color:P.textMuted,display:'flex',marginTop:6}}>
                      <Icon d={ICONS.chevron_right} size={15}/>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Quiz card */}
            {mod.quiz && (
              <div style={{
                background: quizPassed ? P.positiveSoft : (allLessonsDone ? P.accentSoft : P.panel),
                border:`1px solid ${quizPassed ? P.positive : (allLessonsDone ? P.accent : P.borderSoft)}`,
                borderRadius:12,padding:'20px 22px',
                display:'flex',alignItems:'center',gap:16,
              }}>
                <div style={{
                  width:42,height:42,borderRadius:'50%',
                  background: quizPassed ? P.positive : (allLessonsDone ? P.accent : P.panel2),
                  color:'#fff',
                  display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
                }}>
                  <Icon d={ICONS.award} size={20}/>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{
                    fontSize:11,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:3,
                  }}>
                    {quizPassed ? 'Passed' : `${mod.quiz.questions.length} questions · 100% to pass`}
                  </div>
                  <div style={{fontSize:15,fontWeight:600,color:P.text}}>
                    {mod.quiz.title}
                  </div>
                </div>
                <button
                  onClick={onStartQuiz}
                  disabled={!allLessonsDone && !quizPassed}
                  style={{
                    background: (!allLessonsDone && !quizPassed) ? P.panel2 : P.accent,
                    color: (!allLessonsDone && !quizPassed) ? P.textMuted : '#fff',
                    border:'none',
                    fontSize:13,fontWeight:600,
                    padding:'10px 16px',borderRadius:9,
                    cursor: (!allLessonsDone && !quizPassed) ? 'not-allowed' : 'pointer',
                    fontFamily:'inherit',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap',
                  }}
                >
                  {quizPassed ? 'Review' : (allLessonsDone ? 'Start Quiz' : 'Finish lessons first')}
                  {(allLessonsDone || quizPassed) && <Icon d={ICONS.arrow_right} size={13}/>}
                </button>
              </div>
            )}
          </>
        )}
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // Lesson view
  // ─────────────────────────────────────────────────────────────
  function LessonView({module: mod, lesson, progress, onComplete, onSelectLesson, onStartQuiz, onBackToModule}){
    const moduleData = progress[mod.id] || {};
    const done = !!moduleData[lesson.id];
    const idx = mod.lessons.findIndex(l => l.id === lesson.id);
    const next = idx >= 0 && idx < mod.lessons.length - 1 ? mod.lessons[idx + 1] : null;
    const prev = idx > 0 ? mod.lessons[idx - 1] : null;
    const allLessonsDone = mod.lessons.every(l => moduleData[l.id] || l.id === lesson.id);

    function handleMarkComplete(){
      if (!done) onComplete();
      // auto-advance to next lesson if there is one
      if (next) onSelectLesson(next.id);
      else if (mod.quiz && allLessonsDone) onStartQuiz();
    }

    return (
      <div style={{padding:'32px 40px 60px',maxWidth:820}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
          <button onClick={onBackToModule} style={{
            background:'transparent',border:'none',color:P.textDim,
            fontSize:12.5,fontWeight:500,cursor:'pointer',
            display:'flex',alignItems:'center',gap:6,padding:'4px 0',
            fontFamily:'inherit',
          }}>
            <span style={{transform:'rotate(180deg)',display:'flex'}}><Icon d={ICONS.arrow_right} size={13}/></span>
            Module {mod.number}
          </button>
          <span style={{color:P.borderSoft}}>·</span>
          <span style={{fontSize:12,color:P.textMuted,fontWeight:500}}>Lesson {lesson.number}</span>
          {done && (
            <span style={{
              marginLeft:8,
              background:P.positiveSoft,color:P.positive,
              fontSize:10,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',
              padding:'2px 8px',borderRadius:100,
              display:'inline-flex',alignItems:'center',gap:4,
            }}>
              <Icon d={ICONS.check} size={10}/> Complete
            </span>
          )}
        </div>

        <div style={{marginBottom:22}}>
          <div className="display" style={{fontSize:30,lineHeight:1.15,color:P.text,marginBottom:8}}>
            {lesson.title}
          </div>
          <div style={{fontSize:14,color:P.textDim,lineHeight:1.6,maxWidth:680}}>
            {lesson.summary}
          </div>
        </div>

        {(() => {
          // Support both legacy single `loomUrl` and new multi-Loom `looms: [{label?, url}]`
          const looms = lesson.looms && lesson.looms.length
            ? lesson.looms
            : (lesson.loomUrl ? [{url: lesson.loomUrl}] : []);
          if (!looms.length) return null;
          const shareToEmbed = (u) => (u || '').replace('/share/', '/embed/');
          return (
            <div style={{display:'flex',flexDirection:'column',gap:14,marginBottom:22}}>
              {looms.map((l, i) => (
                <div key={i}>
                  {looms.length > 1 && (
                    <div style={{fontSize:11,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>
                      {l.label || `Part ${i+1}`}
                    </div>
                  )}
                  <div style={{
                    width:'100%',aspectRatio:'16/9',
                    background:'#000',borderRadius:10,overflow:'hidden',
                    border:`1px solid ${P.borderSoft}`,
                  }}>
                    <iframe
                      src={shareToEmbed(l.url)}
                      title={`Loom ${i+1}`}
                      style={{width:'100%',height:'100%',border:0,display:'block'}}
                      allow="autoplay; fullscreen"
                      allowFullScreen
                    />
                  </div>
                </div>
              ))}
            </div>
          );
        })()}

        <div style={{
          background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:14,
          padding:'28px 32px',marginBottom:24,
        }}>
          {renderMarkdown(lesson.body)}
        </div>

        {/* Lesson nav */}
        <div style={{
          display:'flex',alignItems:'center',gap:12,
          padding:'18px 0',borderTop:`1px solid ${P.borderSoft}`,
        }}>
          {prev && (
            <button onClick={()=>onSelectLesson(prev.id)} style={{
              background:'transparent',border:`1px solid ${P.border}`,color:P.text,
              fontSize:12.5,fontWeight:500,cursor:'pointer',
              padding:'9px 13px',borderRadius:8,
              fontFamily:'inherit',display:'flex',alignItems:'center',gap:6,
            }}>
              <span style={{transform:'rotate(180deg)',display:'flex'}}><Icon d={ICONS.arrow_right} size={13}/></span>
              Previous
            </button>
          )}
          <div style={{flex:1}}/>
          <button onClick={handleMarkComplete} style={{
            background: done ? P.panel2 : P.accent,
            color: done ? P.text : '#fff',
            border: done ? `1px solid ${P.border}` : 'none',
            fontSize:13,fontWeight:600,cursor:'pointer',
            padding:'10px 18px',borderRadius:9,
            fontFamily:'inherit',display:'flex',alignItems:'center',gap:6,
          }}>
            {done ? (next ? 'Next lesson' : (mod.quiz ? 'Go to quiz' : 'Continue')) : 'Mark complete & continue'}
            <Icon d={ICONS.arrow_right} size={13}/>
          </button>
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // Quiz runner — 100% pass with retry-missed loop
  // ─────────────────────────────────────────────────────────────
  function QuizRunner({module: mod, onPass, onExit}){
    const quiz = mod.quiz;
    const [view, setView] = useState('intro'); // intro | active | retryNotice | pass
    const [queue, setQueue] = useState([]);
    const [pos, setPos] = useState(0);
    const [missed, setMissed] = useState([]);
    const [attempt, setAttempt] = useState(1);
    const [selected, setSelected] = useState(null);
    const [revealed, setRevealed] = useState(false);
    const [feedback, setFeedback] = useState(null);

    function startQuiz(){
      const initQueue = quiz.questions.map((_, i) => i);
      setQueue(initQueue);
      setPos(0);
      setMissed([]);
      setSelected(null);
      setRevealed(false);
      setFeedback(null);
      setAttempt(1);
      setView('active');
    }

    function handleSubmit(){
      if (selected == null) return;
      const qIdx = queue[pos];
      const q = quiz.questions[qIdx];
      if (selected === q.correct) {
        setFeedback('correct');
        setTimeout(() => {
          stepForward();
        }, 380);
      } else {
        setFeedback('wrong');
        setRevealed(true);
        setMissed(m => m.includes(qIdx) ? m : [...m, qIdx]);
      }
    }

    function stepForward(){
      const nextPos = pos + 1;
      setSelected(null);
      setRevealed(false);
      setFeedback(null);
      if (nextPos < queue.length) {
        setPos(nextPos);
      } else {
        if (missed.length === 0) {
          setView('pass');
          onPass();
        } else {
          setView('retryNotice');
        }
      }
    }

    function startRetry(){
      const retryQueue = [...missed].sort((a,b) => a - b);
      setQueue(retryQueue);
      setPos(0);
      setMissed([]);
      setSelected(null);
      setRevealed(false);
      setFeedback(null);
      setAttempt(a => a + 1);
      setView('active');
    }

    if (view === 'intro') {
      return (
        <div style={{padding:'32px 40px',maxWidth:640}}>
          <button onClick={onExit} style={{
            background:'transparent',border:'none',color:P.textDim,
            fontSize:12.5,fontWeight:500,cursor:'pointer',
            display:'flex',alignItems:'center',gap:6,padding:'4px 0',marginBottom:14,
            fontFamily:'inherit',
          }}>
            <span style={{transform:'rotate(180deg)',display:'flex'}}><Icon d={ICONS.arrow_right} size={13}/></span>
            Back to module
          </button>

          <div style={{
            background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:16,
            padding:'30px 32px',display:'flex',flexDirection:'column',gap:18,
          }}>
            <div>
              <div style={{fontSize:11,color:P.textMuted,letterSpacing:'.10em',textTransform:'uppercase',fontWeight:600,marginBottom:8}}>
                Module {mod.number} · Quiz
              </div>
              <div className="display" style={{fontSize:28,lineHeight:1.2,color:P.text,marginBottom:10}}>
                {quiz.title}
              </div>
              <div style={{fontSize:13.5,color:P.textDim,lineHeight:1.6}}>
                Pass at 100% to unlock Module {mod.number + 1}. Wrong answers loop back into a retry queue until every question is correct.
              </div>
            </div>

            <div style={{
              display:'flex',gap:14,alignItems:'center',
              padding:'12px 14px',background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:10,
              fontSize:12,color:P.textDim,
            }}>
              <span><b style={{color:P.text,fontWeight:600}}>{quiz.questions.length}</b> questions</span>
              <span style={{color:P.borderSoft}}>·</span>
              <span><b style={{color:P.text,fontWeight:600}}>100%</b> to pass</span>
              <span style={{color:P.borderSoft}}>·</span>
              <span>Retry missed only</span>
            </div>

            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <button onClick={startQuiz} style={{
                background:P.accent,color:'#fff',border:'none',
                fontSize:13.5,fontWeight:600,
                padding:'10px 18px',borderRadius:10,cursor:'pointer',
                fontFamily:'inherit',display:'flex',alignItems:'center',gap:6,
              }}>
                Start Quiz <Icon d={ICONS.arrow_right} size={14}/>
              </button>
              <button onClick={onExit} style={{
                background:'transparent',border:'none',color:P.textDim,
                fontSize:13,fontWeight:500,cursor:'pointer',padding:'10px 8px',
                fontFamily:'inherit',
              }}>Back</button>
            </div>
          </div>
        </div>
      );
    }

    if (view === 'active' && queue.length > 0) {
      const qIdx = queue[pos];
      const q = quiz.questions[qIdx];
      const total = queue.length;
      const flashBg = feedback === 'correct'
        ? P.positiveSoft
        : (feedback === 'wrong' ? P.dangerSoft : P.panel);

      return (
        <div style={{padding:'32px 40px',maxWidth:640}}>
          <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:14}}>
            <div style={{
              fontSize:11,color:P.textMuted,letterSpacing:'.08em',
              textTransform:'uppercase',fontWeight:600,
            }}>{quiz.title}</div>
            <div style={{flex:1}}/>
            <div style={{fontSize:12,color:P.textDim,fontWeight:500}}>
              Q {pos+1} of {total}
            </div>
          </div>

          <div style={{
            height:4,background:P.panel2,borderRadius:100,overflow:'hidden',marginBottom:18,
          }}>
            <div style={{
              height:'100%',width:`${((pos)/total)*100}%`,
              background:P.accent,transition:'width .25s ease',
            }}/>
          </div>

          <div style={{
            background:flashBg,border:`1px solid ${P.borderSoft}`,borderRadius:16,
            padding:'24px 26px',transition:'background .25s',
          }}>
            <div style={{fontSize:11,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:8}}>
              {attempt > 1 ? `Retry · attempt ${attempt}` : 'Question'}
            </div>
            <div className="display" style={{fontSize:20,lineHeight:1.35,color:P.text,marginBottom:18}}>
              {q.q}
            </div>

            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {q.options.map((opt, i) => {
                const isSel = selected === i;
                const isCorrect = i === q.correct;
                let bg = P.panel;
                let bd = P.borderSoft;
                let fg = P.text;

                if (revealed) {
                  if (isCorrect) { bg = P.positiveSoft; bd = P.positive; }
                  else if (isSel) { bg = P.dangerSoft; bd = P.danger; }
                } else if (isSel) {
                  bg = P.accentSoft; bd = P.accent;
                }
                return (
                  <button
                    key={i}
                    disabled={revealed || feedback === 'correct'}
                    onClick={()=>setSelected(i)}
                    style={{
                      appearance:'none',textAlign:'left',
                      cursor: (revealed || feedback === 'correct') ? 'default' : 'pointer',
                      background:bg,
                      border:`1.5px solid ${bd}`,
                      color:fg,
                      fontFamily:'inherit',fontSize:13.5,fontWeight:isSel?600:500,
                      padding:'12px 14px',borderRadius:10,
                      display:'flex',alignItems:'center',gap:12,
                      transition:'background .12s, border-color .12s',
                    }}
                  >
                    <span style={{
                      width:22,height:22,borderRadius:'50%',
                      border:`1.5px solid ${isSel || (revealed && isCorrect) ? bd : P.border}`,
                      display:'flex',alignItems:'center',justifyContent:'center',
                      fontSize:11,fontWeight:700,
                      color:isSel || (revealed && isCorrect) ? bd : P.textMuted,
                      flexShrink:0,
                    }}>{String.fromCharCode(65+i)}</span>
                    <span style={{flex:1}}>{opt}</span>
                    {revealed && isCorrect && (
                      <span style={{color:P.positive,display:'flex'}}><Icon d={ICONS.check} size={15}/></span>
                    )}
                    {revealed && isSel && !isCorrect && (
                      <span style={{color:P.danger,display:'flex'}}><Icon d={ICONS.x} size={15}/></span>
                    )}
                  </button>
                );
              })}
            </div>

            {revealed && (
              <div style={{
                marginTop:16,padding:'10px 14px',
                background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:10,
                fontSize:12.5,color:P.textDim,lineHeight:1.5,
              }}>
                <span style={{color:P.text,fontWeight:600}}>Correct answer:</span>{' '}
                {q.options[q.correct]}
              </div>
            )}

            <div style={{display:'flex',alignItems:'center',gap:10,marginTop:18}}>
              {!revealed && feedback !== 'correct' && (
                <button
                  onClick={handleSubmit}
                  disabled={selected == null}
                  style={{
                    background: selected == null ? P.panel2 : P.accent,
                    color: selected == null ? P.textMuted : '#fff',
                    border:'none',fontSize:13,fontWeight:600,
                    padding:'9px 16px',borderRadius:9,
                    cursor: selected == null ? 'default' : 'pointer',
                    fontFamily:'inherit',
                  }}
                >Submit</button>
              )}
              {revealed && (
                <button onClick={stepForward} style={{
                  background:P.accent,color:'#fff',border:'none',
                  fontSize:13,fontWeight:600,padding:'9px 16px',borderRadius:9,cursor:'pointer',
                  fontFamily:'inherit',marginLeft:'auto',display:'flex',alignItems:'center',gap:6,
                }}>
                  Continue <Icon d={ICONS.arrow_right} size={13}/>
                </button>
              )}
              {feedback === 'correct' && !revealed && (
                <div style={{
                  marginLeft:'auto',display:'flex',alignItems:'center',gap:6,
                  color:P.positive,fontSize:13,fontWeight:600,
                }}>
                  <Icon d={ICONS.check} size={14}/> Correct
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    if (view === 'retryNotice') {
      return (
        <div style={{padding:'32px 40px',maxWidth:480}}>
          <div style={{
            background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:16,
            padding:'30px 32px',textAlign:'center',
            display:'flex',flexDirection:'column',gap:14,alignItems:'center',
          }}>
            <div style={{
              width:54,height:54,borderRadius:'50%',
              background:P.warnSoft,color:P.warn,
              display:'flex',alignItems:'center',justifyContent:'center',
            }}>
              <Icon d={ICONS.arrow_right} size={22}/>
            </div>
            <div className="display" style={{fontSize:22,lineHeight:1.2,color:P.text}}>
              Retry missed
            </div>
            <div style={{fontSize:13.5,color:P.textDim,lineHeight:1.55,maxWidth:340}}>
              Re-take just the questions you missed. Once they're all correct, the module is complete.
            </div>
            <button onClick={startRetry} style={{
              background:P.accent,color:'#fff',border:'none',
              fontSize:13,fontWeight:600,padding:'10px 18px',borderRadius:10,cursor:'pointer',
              fontFamily:'inherit',display:'flex',alignItems:'center',gap:6,marginTop:6,
            }}>
              Continue <Icon d={ICONS.arrow_right} size={13}/>
            </button>
          </div>
        </div>
      );
    }

    if (view === 'pass') {
      const nextModuleNum = mod.number + 1;
      const isLastModule = !MODULES.find(m => m.number === nextModuleNum);
      return (
        <div style={{padding:'32px 40px',maxWidth:520}}>
          <div style={{
            background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:16,
            padding:'36px 32px',textAlign:'center',
            display:'flex',flexDirection:'column',gap:14,alignItems:'center',
          }}>
            <div style={{
              width:64,height:64,borderRadius:'50%',
              background:P.positiveSoft,color:P.positive,
              display:'flex',alignItems:'center',justifyContent:'center',
            }}>
              <Icon d={ICONS.award} size={28}/>
            </div>
            <div style={{fontSize:11,color:P.textMuted,letterSpacing:'.10em',textTransform:'uppercase',fontWeight:600}}>
              Module {mod.number} complete
            </div>
            <div className="display" style={{fontSize:30,lineHeight:1.15,color:P.text}}>
              {mod.title} — passed
            </div>
            <div style={{fontSize:13.5,color:P.textDim,lineHeight:1.55,maxWidth:380}}>
              {isLastModule
                ? 'You\'ve completed every available module. The Academy will expand from here.'
                : `Module ${nextModuleNum} unlocks soon — content is in development.`}
            </div>

            <button onClick={onExit} style={{
              background:P.accent,color:'#fff',border:'none',
              fontSize:13.5,fontWeight:600,padding:'10px 18px',borderRadius:10,cursor:'pointer',
              fontFamily:'inherit',marginTop:6,
            }}>
              Back to module
            </button>
          </div>
        </div>
      );
    }

    return null;
  }

  window.Academy = Academy;
})();

</script>
<script type="text/babel" data-source="view-calculators.jsx">
// Calculators — DPperformance coach tools.
// Currently: Starting Macro Calculator. Designed to grow (rate-of-loss projector,
// step titration, refeed/diet break trigger, mesocycle deload checker, etc.)

(function(){
  const { useState, useMemo } = React;
  const P = window.P, Icon = window.Icon, ICONS = window.ICONS;

  // ──────────────────────────────────────────────
  // Calculator catalogue — extensible
  // ──────────────────────────────────────────────
  const CALCULATORS = [
    {id:'starting-macro', title:'Starting Macro Calculator', summary:'Sanity check for new client calories + macros. Use the rule of thumb for in-the-bracket clients; the calculator earns its keep on outliers (very tall / short, very high / low BW, atypical training freq).'},
    // Future: rate-of-loss projector, step titration, refeed trigger, deload checker
  ];

  // ──────────────────────────────────────────────
  // Shared input components
  // ──────────────────────────────────────────────
  const inputBase = {
    width:'100%', padding:'9px 12px', fontSize:13, color:P.text,
    background:P.panel3, border:`1px solid ${P.borderSoft}`, borderRadius:8,
    fontFamily:'inherit', outline:'none', boxSizing:'border-box',
  };
  const labelBase = {
    fontSize:11, color:P.textMuted, letterSpacing:'.06em',
    textTransform:'uppercase', fontWeight:600, marginBottom:6, display:'block',
  };

  function Field({label, children, hint}){
    return (
      <label style={{display:'block', marginBottom:14}}>
        <span style={labelBase}>{label}</span>
        {children}
        {hint && <div style={{fontSize:11, color:P.textMuted, marginTop:4}}>{hint}</div>}
      </label>
    );
  }

  function Segmented({value, onChange, options, fluid}){
    return (
      <div style={{display:'flex', gap:0, background:P.panel3, border:`1px solid ${P.borderSoft}`, borderRadius:8, padding:3}}>
        {options.map(opt => {
          const on = value === opt.value;
          return (
            <button key={String(opt.value)} type="button" onClick={()=>onChange(opt.value)} style={{
              flex: fluid ? 1 : '0 0 auto',
              padding:'7px 12px', fontSize:12.5, fontWeight:on?600:500,
              border:'none', borderRadius:6, cursor:'pointer', fontFamily:'inherit',
              background: on ? P.panel : 'transparent',
              color: on ? P.text : P.textDim,
              boxShadow: on ? '0 1px 3px rgba(0,0,0,.06)' : 'none',
              transition:'all 120ms',
            }}>{opt.label}</button>
          );
        })}
      </div>
    );
  }

  // ──────────────────────────────────────────────
  // Starting Macro Calculator
  // ──────────────────────────────────────────────
  function StartingMacroCalculator(){
    const [gender, setGender] = useState('M');
    const [age, setAge] = useState(30);
    const [heightCm, setHeightCm] = useState(178);
    const [weightKg, setWeightKg] = useState(80);
    const [targetWeightKg, setTargetWeightKg] = useState(''); // optional, for protein calc
    const [trainingDays, setTrainingDays] = useState(4);
    const [activity, setActivity] = useState('moderate'); // sedentary/light/moderate/active/very
    const [goal, setGoal] = useState('cut'); // cut/maintain/bulk
    const [bfRange, setBfRange] = useState('mid'); // low/mid/high — drives graduated deficit
    const [showRestDay, setShowRestDay] = useState(true);

    const result = useMemo(() => {
      const w = Number(weightKg) || 0;
      const h = Number(heightCm) || 0;
      const a = Number(age) || 0;
      const td = Number(trainingDays) || 0;
      const tw = Number(targetWeightKg) || w;
      if (!w || !h || !a) return null;

      // Mifflin-St Jeor BMR
      const bmr = gender === 'M'
        ? (10 * w) + (6.25 * h) - (5 * a) + 5
        : (10 * w) + (6.25 * h) - (5 * a) - 161;

      // Activity multiplier (NEAT-based, NOT including formal training)
      const actMult = {
        sedentary: 1.2,   // desk + minimal steps (<5k)
        light: 1.35,      // some walking (5–7.5k steps)
        moderate: 1.5,    // moderate activity (7.5–10k steps)
        active: 1.65,     // very active (10–14k steps)
        very: 1.8,        // highly active (14k+, manual job)
      }[activity];

      // Training day premium — adds ~150-250 kcal per training day spread over the week
      const trainingPremium = (td * 220) / 7;

      let tdee = Math.round((bmr * actMult) + trainingPremium);

      // Sanity check: implausible inputs
      const inputWarnings = [];
      if (w < 35 || w > 200) inputWarnings.push(`Weight ${w} kg looks off — re-check the number is in kilograms (typical adult range 35–200 kg).`);
      if (h < 130 || h > 220) inputWarnings.push(`Height ${h} cm looks off — re-check the number is in centimetres (typical adult range 130–220 cm).`);
      if (a < 13 || a > 90) inputWarnings.push(`Age ${a} looks off — coaching range typically 13–90.`);
      if (tw < 35 || tw > 200) inputWarnings.push(`Target weight ${tw} kg looks off — re-check kilograms.`);
      if (tdee < 1000 || tdee > 5000) inputWarnings.push(`Estimated TDEE of ${tdee.toLocaleString()} kcal/day is implausible — almost certainly an input units error. Cross-check height (cm) and weight (kg).`);

      // Cross-check vs DP rule of thumb — flag if wildly out of bracket
      const ruleOfThumb = gender === 'M' ? 2200 : 1750;
      const inBracket = gender === 'M'
        ? (w >= 75 && w <= 85 && h >= 175 && h <= 185)
        : (w >= 55 && w <= 65 && h >= 158 && h <= 170);

      // Goal adjustment — graduated deficit by BF range (Daniel Q1 stance)
      let trainingDayKcal = tdee;
      let restDayKcal = tdee;
      let goalDescription = '';

      if (goal === 'cut') {
        // Deficit by BF range — graduated per Q1 stance
        const deficitPct = {
          low: 0.15,  // lean clients (≤12% M / ≤18% F): conservative 15%
          mid: 0.20,  // mid-range (12–25% M / 18–30% F): standard 20%
          high: 0.28, // high BF (>25% M / >30% F): more aggressive 28%
        }[bfRange];
        trainingDayKcal = Math.round(tdee * (1 - deficitPct));
        // Rest day = ~250 kcal lower than TD for cut
        restDayKcal = trainingDayKcal - 250;
        goalDescription = `Cut · ${Math.round(deficitPct * 100)}% deficit (BF-graduated)`;
      } else if (goal === 'maintain') {
        trainingDayKcal = tdee;
        restDayKcal = tdee - 200;
        goalDescription = 'Maintain · neutral energy balance';
      } else if (goal === 'bulk') {
        trainingDayKcal = tdee + 250;
        restDayKcal = tdee - 100; // controlled rest day per Daniel's lean bulk SOP
        goalDescription = 'Lean bulk · slight surplus on training days, near-maintenance on rest days';
      }

      // Calorie floors (DP standard — never push below)
      const minCal = gender === 'M' ? 1400 : 1200;
      const flooredTD = Math.max(trainingDayKcal, minCal);
      const flooredRD = Math.max(restDayKcal, minCal);
      const calorieFloorHit = (trainingDayKcal < minCal) || (restDayKcal < minCal);

      // Macros — DP standard, phase-aware
      // Protein (g/kg target weight):
      //   Cut:      M 2.2 / F 1.8  — floor when calorie space is tight, sized to protect muscle in deficit
      //   Maintain: M 2.5 / F 2.0  — protein comes up when calorie pressure releases
      //   Bulk:     M 3.0 / F 2.2  — top of the working range for active growth phases
      // Fat (g/kg current weight): M floor 0.8 / F floor 1.0 — higher female floor protects cycle function
      // Carbs: fill remainder
      const proteinPerKgTable = {
        cut:      {M: 2.2, F: 1.8},
        maintain: {M: 2.5, F: 2.0},
        bulk:     {M: 3.0, F: 2.2},
      };
      const proteinPerKg = proteinPerKgTable[goal][gender];
      const proteinG = Math.round(proteinPerKg * tw);
      const proteinKcal = proteinG * 4;
      const fatPerKg = gender === 'F' ? 1.0 : 0.8;
      const fatG = Math.round(fatPerKg * w);
      const fatKcal = fatG * 9;

      const macrosFor = (kcal) => {
        const carbsKcal = kcal - proteinKcal - fatKcal;
        const carbsG = Math.max(0, Math.round(carbsKcal / 4));
        return {
          kcal,
          protein: {g: proteinG, kcal: proteinKcal, pct: Math.round(proteinKcal/kcal*100)},
          fat: {g: fatG, kcal: fatKcal, pct: Math.round(fatKcal/kcal*100)},
          carbs: {g: carbsG, kcal: carbsKcal, pct: Math.round(carbsKcal/kcal*100)},
        };
      };

      return {
        bmr: Math.round(bmr),
        actMult,
        actLabel: {sedentary:'Sedentary',light:'Light',moderate:'Moderate',active:'Active',very:'Very active'}[activity],
        trainingPremium: Math.round(trainingPremium),
        tdee,
        ruleOfThumb,
        inBracket,
        goalDescription,
        trainingDay: macrosFor(flooredTD),
        restDay: macrosFor(flooredRD),
        calorieFloorHit,
        floorMin: minCal,
        inputWarnings,
      };
    }, [gender, age, heightCm, weightKg, targetWeightKg, trainingDays, activity, goal, bfRange]);

    const Card = ({title, data, accent}) => (
      <div style={{
        background:P.panel, border:`1px solid ${P.borderSoft}`, borderRadius:14,
        padding:'18px 20px', flex:1, minWidth:240,
      }}>
        <div style={{display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:14}}>
          <div style={{fontSize:12, fontWeight:600, color:P.textMuted, letterSpacing:'.06em', textTransform:'uppercase'}}>{title}</div>
          <div style={{fontSize:11, color:accent || P.accent, fontWeight:600}}>{data.kcal.toLocaleString()} kcal</div>
        </div>
        {['protein','carbs','fat'].map(k => (
          <div key={k} style={{display:'flex', alignItems:'center', gap:10, marginBottom:8, fontSize:13}}>
            <div style={{
              width:8, height:8, borderRadius:'50%',
              background: k==='protein' ? P.accent : k==='carbs' ? '#3b82f6' : P.warn,
            }}/>
            <div style={{flex:1, color:P.text, textTransform:'capitalize', fontWeight:500}}>{k}</div>
            <div style={{color:P.text, fontWeight:600}}>{data[k].g}g</div>
            <div style={{color:P.textMuted, fontSize:11.5, minWidth:36, textAlign:'right'}}>{data[k].pct}%</div>
          </div>
        ))}
      </div>
    );

    return (
      <div style={{display:'flex', flexDirection:'column', gap:24}}>
        {/* Inputs */}
        <div style={{
          background:P.panel, border:`1px solid ${P.borderSoft}`, borderRadius:14,
          padding:'24px 28px',
        }}>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:'4px 22px'}}>
            <Field label="Gender">
              <Segmented value={gender} onChange={setGender} fluid options={[
                {value:'M', label:'Male'},
                {value:'F', label:'Female'},
              ]}/>
            </Field>
            <Field label="Age">
              <input type="number" value={age} onChange={e=>setAge(e.target.value)} style={inputBase}/>
            </Field>
            <Field label="Height (cm)">
              <input type="number" value={heightCm} onChange={e=>setHeightCm(e.target.value)} style={inputBase}/>
            </Field>
            <Field label="Current weight (kg)">
              <input type="number" value={weightKg} onChange={e=>setWeightKg(e.target.value)} style={inputBase}/>
            </Field>
            <Field label="Target weight (kg)" hint="Optional. Drives protein calc. Defaults to current weight if blank.">
              <input type="number" value={targetWeightKg} onChange={e=>setTargetWeightKg(e.target.value)} placeholder={String(weightKg || '')} style={inputBase}/>
            </Field>
            <Field label="Training days/week">
              <input type="number" value={trainingDays} onChange={e=>setTrainingDays(e.target.value)} min="0" max="7" style={inputBase}/>
            </Field>
            <Field label="Daily activity (NEAT)" hint="Steps + lifestyle, excluding training.">
              <select value={activity} onChange={e=>setActivity(e.target.value)} style={inputBase}>
                <option value="sedentary">Sedentary · &lt;5k steps</option>
                <option value="light">Light · 5–7.5k steps</option>
                <option value="moderate">Moderate · 7.5–10k steps</option>
                <option value="active">Active · 10–14k steps</option>
                <option value="very">Very active · 14k+ / manual job</option>
              </select>
            </Field>
            <Field label="Goal">
              <Segmented value={goal} onChange={setGoal} fluid options={[
                {value:'cut', label:'Cut'},
                {value:'maintain', label:'Maintain'},
                {value:'bulk', label:'Lean bulk'},
              ]}/>
            </Field>
            {goal === 'cut' && (
              <Field label="Body-fat range" hint="Drives graduated deficit. Lean clients run a lighter deficit; high-BF can take more.">
                <Segmented value={bfRange} onChange={setBfRange} fluid options={[
                  {value:'low', label:'Low'},
                  {value:'mid', label:'Mid'},
                  {value:'high', label:'High'},
                ]}/>
              </Field>
            )}
          </div>

          <div style={{
            display:'flex', alignItems:'center', gap:8, marginTop:8,
            paddingTop:14, borderTop:`1px solid ${P.borderSoft}`,
          }}>
            <input type="checkbox" id="show-rd" checked={showRestDay} onChange={e=>setShowRestDay(e.target.checked)} style={{cursor:'pointer'}}/>
            <label htmlFor="show-rd" style={{fontSize:12.5, color:P.textDim, cursor:'pointer'}}>Show training day vs rest day split</label>
          </div>
        </div>

        {/* Results */}
        {result && (
          <div style={{display:'flex', flexDirection:'column', gap:16}}>
            {result.inputWarnings && result.inputWarnings.length > 0 && (
              <div style={{
                background:'#fff1f1', border:'1px solid #fecaca', borderRadius:10,
                padding:'12px 16px', display:'flex', alignItems:'flex-start', gap:10,
              }}>
                <span style={{flexShrink:0, marginTop:1, color:'#b91c1c', fontWeight:700}}>!</span>
                <div style={{fontSize:12.5, color:'#991b1b', lineHeight:1.55}}>
                  <div style={{fontWeight:600, marginBottom:4}}>Input check</div>
                  {result.inputWarnings.map((w,i)=>(<div key={i} style={{marginBottom:i<result.inputWarnings.length-1?4:0}}>{w}</div>))}
                </div>
              </div>
            )}
            <div style={{
              background:P.panel2, border:`1px solid ${P.borderSoft}`, borderRadius:12,
              padding:'14px 18px', display:'flex', alignItems:'center', gap:18, flexWrap:'wrap',
            }}>
              <div>
                <div style={{fontSize:10.5, color:P.textMuted, fontWeight:600, letterSpacing:'.08em', textTransform:'uppercase', marginBottom:3}}>Estimated TDEE</div>
                <div style={{fontSize:22, fontWeight:600, color:P.text}}>{result.tdee.toLocaleString()} <span style={{fontSize:13, fontWeight:500, color:P.textDim}}>kcal/day</span></div>
                <div style={{fontSize:11, color:P.textMuted, marginTop:3}}>BMR {result.bmr.toLocaleString()} × {result.actLabel} ({result.actMult}) + training {result.trainingPremium}</div>
              </div>
              <div style={{height:36, width:1, background:P.borderSoft}}/>
              <div>
                <div style={{fontSize:10.5, color:P.textMuted, fontWeight:600, letterSpacing:'.08em', textTransform:'uppercase', marginBottom:3}}>Rule-of-thumb baseline</div>
                <div style={{fontSize:14, color:P.text}}>{result.ruleOfThumb.toLocaleString()} kcal {result.inBracket ? <span style={{color:P.positive, fontSize:11.5}}>· in bracket</span> : <span style={{color:P.warn, fontSize:11.5}}>· outlier — use the calculator</span>}</div>
              </div>
              <div style={{flex:1}}/>
              <div style={{
                background:P.accentSoft, color:P.accentDeep||P.accent,
                padding:'5px 12px', borderRadius:100, fontSize:11.5, fontWeight:600,
              }}>{result.goalDescription}</div>
            </div>

            <div style={{display:'flex', gap:14, flexWrap:'wrap'}}>
              <Card title="Training day" data={result.trainingDay} accent={P.accent}/>
              {showRestDay && <Card title="Rest day" data={result.restDay} accent={P.textDim}/>}
            </div>

            {result.calorieFloorHit && (
              <div style={{
                background:'#fff8e6', border:`1px solid #fde68a`, borderRadius:10,
                padding:'12px 16px', fontSize:12.5, color:'#92400e',
                display:'flex', alignItems:'flex-start', gap:10,
              }}>
                <span style={{flexShrink:0, marginTop:1}}>⚠</span>
                <div>
                  <b>Calorie floor enforced.</b> Your inputs would push training-day or rest-day calories below the DP minimum ({result.floorMin} kcal — {gender==='M' ? 'male' : 'female'} floor). Numbers above are floored. If the deficit needs to go further, eat less is no longer the right lever — pull cardio, NEAT, or reset the diet (see Module 5).
                </div>
              </div>
            )}

            <div style={{
              background:P.panel, border:`1px solid ${P.borderSoft}`, borderRadius:12,
              padding:'14px 18px', fontSize:12.5, color:P.textDim, lineHeight:1.55,
            }}>
              <div style={{fontWeight:600, color:P.text, marginBottom:6}}>How this is calculated</div>
              BMR uses Mifflin-St Jeor. NEAT activity multiplier is added (excludes formal training). Training adds ~220 kcal per session, spread over the week. Cut deficit is graduated by BF range (Low 15% · Mid 20% · High 28%) per the DP stance. Rest days run ~250 kcal lower than training days on cuts and bulks. Protein is gendered and phase-aware (g/kg target weight): cut M 2.2 / F 1.8; maintain M 2.5 / F 2.0; bulk M 3.0 / F 2.2 — protein comes up as calorie pressure releases. Fat floor is gendered: 0.8 g/kg current weight for males / 1.0 g/kg for females (higher female floor protects cycle function). Carbs fill the remainder. Calorie floors: {result.floorMin} kcal (gender-specific). The rule of thumb (M ~2,200 / F ~1,750) is faster and almost always close enough for in-the-bracket clients — the calculator earns its keep on outliers.
            </div>
          </div>
        )}
      </div>
    );
  }

  // ──────────────────────────────────────────────
  // Top-level Calculators view (tabbed for future calcs)
  // ──────────────────────────────────────────────
  function Calculators(){
    const [active, setActive] = useState('starting-macro');

    return (
      <div style={{flex:1, padding:'32px 40px', overflowY:'auto', display:'flex', flexDirection:'column'}}>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:12, color:P.accent, letterSpacing:'.08em', textTransform:'uppercase', fontWeight:600, marginBottom:6}}>DP Coach Tools</div>
          <div className="display" style={{fontSize:34, lineHeight:1.15, color:P.text}}>Calculators</div>
        </div>

        {/* Calculator tabs */}
        {CALCULATORS.length > 1 && (
          <div style={{display:'flex', gap:8, marginBottom:18, flexWrap:'wrap'}}>
            {CALCULATORS.map(c => {
              const on = active === c.id;
              return (
                <button key={c.id} onClick={()=>setActive(c.id)} style={{
                  appearance:'none', cursor:'pointer', fontFamily:'inherit',
                  padding:'8px 14px', borderRadius:8,
                  border:`1px solid ${on ? P.accent : P.borderSoft}`,
                  background: on ? P.panel : 'transparent',
                  color: on ? P.text : P.textDim,
                  fontSize:13, fontWeight:on?600:500,
                }}>{c.title}</button>
              );
            })}
          </div>
        )}

        {/* Active calculator + summary */}
        {(() => {
          const cal = CALCULATORS.find(c => c.id === active) || CALCULATORS[0];
          return (
            <>
              <div style={{
                background:P.panel2, border:`1px solid ${P.borderSoft}`, borderRadius:10,
                padding:'12px 16px', marginBottom:18, fontSize:12.5, color:P.textDim,
              }}>{cal.summary}</div>
              {active === 'starting-macro' && <StartingMacroCalculator/>}
            </>
          );
        })()}
      </div>
    );
  }

  window.Calculators = Calculators;
})();

</script>
<script type="text/babel" data-source="view-coach-assistant.jsx">
// Coach Assistant — read-only chat with a Claude-powered DP coach.
// v1 scope: free-form Q&A, check-in review (with photo), reply drafting.
// No portal modification, no code execution, no agentic behavior. Pure chat.
// Backend (/api/coach-chat) NOT YET CONNECTED — this is the frontend scaffold.

(function(){
  const { useState, useEffect, useRef, useMemo } = React;
  const P = window.P, Icon = window.Icon, ICONS = window.ICONS;

  const STORAGE_KEY    = 'dp.coach.assistant.history.v1';
  const TODAY_USAGE    = (uid) => `dp.coach.assistant.usage.${todayISO()}.${uid}`;
  const PER_COACH_CAP  = 10.00;   // USD/day per coach
  const ORG_DAILY_CAP  = 100.00;  // USD/day org-wide (enforced server-side later)

  // Sub for "current coach" — wired to real auth later.
  const COACH_ID = 'daniel';

  function todayISO(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }

  function loadHistory(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  }
  function saveHistory(msgs){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs)); } catch {}
  }
  function loadUsage(){
    try { return Number(localStorage.getItem(TODAY_USAGE(COACH_ID)) || 0); }
    catch { return 0; }
  }

  const EXAMPLE_PROMPTS = [
    'A male client at 18% body fat starting a cut — walk me through the calorie + protein numbers.',
    'My client stalled for 3 weeks at 14k steps and 2x cardio. Adherence looks clean. What\'s the lever order?',
    'Draft a check-in reply for a female client in late luteal — scale up 0.4 kg, photos look the same, adherence solid.',
    'How do I coach a client who keeps eating off-plan on weekends?',
  ];

  // ──────────────────────────────────────────────────────────────────
  // Backend stub — real /api/coach-chat will replace this.
  // Returns a fixed message explaining the connection isn't live yet.
  // ──────────────────────────────────────────────────────────────────
  async function callBackendStub(messages, attachments){
    await new Promise(r => setTimeout(r, 700));
    return {
      reply: [
        "**Coach Assistant — backend not connected yet.**",
        "",
        "This is the frontend scaffold. Once Daniel (a) creates the Anthropic API key, (b) sends the Loom transcripts, and (c) the `/api/coach-chat` serverless function is live, this exact message flow will go to Claude with the full DP methodology in context and reply in DP voice.",
        "",
        "What it'll be able to do once live: free-form Q&A on coaching decisions, check-in review (text + photos), and reply drafting in DP voice. What it won't do: change anything in the portal, send messages, or take actions. Pure read-only chat.",
        "",
        "_Daily caps: $10/coach, $100/org. Resets at midnight UTC._",
      ].join('\n'),
      tokens: { input: 0, output: 0 },
      cost_usd: 0,
    };
  }

  // ──────────────────────────────────────────────────────────────────
  // Markdown-lite renderer (bold + paragraphs + bullets)
  // ──────────────────────────────────────────────────────────────────
  function renderInline(text){
    const out = [];
    let i = 0, key = 0;
    const re = /\*\*([^*]+)\*\*|_([^_]+)_/g;
    let m;
    while ((m = re.exec(text)) !== null){
      if (m.index > i) out.push(text.slice(i, m.index));
      if (m[1]) out.push(<strong key={`b${key++}`}>{m[1]}</strong>);
      else if (m[2]) out.push(<em key={`i${key++}`}>{m[2]}</em>);
      i = m.index + m[0].length;
    }
    if (i < text.length) out.push(text.slice(i));
    return out;
  }
  function renderMarkdown(text){
    const lines = text.split('\n');
    const blocks = [];
    let para = [];
    const flushPara = () => {
      if (para.length){
        blocks.push(<p key={blocks.length} style={{margin:'0 0 10px', lineHeight:1.55}}>{renderInline(para.join(' '))}</p>);
        para = [];
      }
    };
    lines.forEach((ln) => {
      if (!ln.trim()){ flushPara(); return; }
      if (/^[-*]\s+/.test(ln)){
        flushPara();
        const items = [ln.replace(/^[-*]\s+/, '')];
        // (single-item bullet — paragraphisation is fine for v1)
        blocks.push(<ul key={blocks.length} style={{margin:'0 0 10px', paddingLeft:18, lineHeight:1.55}}>
          {items.map((it,j)=><li key={j}>{renderInline(it)}</li>)}
        </ul>);
        return;
      }
      para.push(ln);
    });
    flushPara();
    return blocks;
  }

  // ──────────────────────────────────────────────────────────────────
  // Composer — text + photo attach + send
  // ──────────────────────────────────────────────────────────────────
  function Composer({onSend, disabled}){
    const [text, setText] = useState('');
    const [attachments, setAttachments] = useState([]); // [{name, dataUrl}]
    const fileRef = useRef(null);
    const taRef = useRef(null);

    useEffect(() => {
      const ta = taRef.current; if (!ta) return;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 240) + 'px';
    }, [text]);

    function handleFiles(files){
      const next = [];
      Array.from(files).slice(0, 4 - attachments.length).forEach(f => {
        if (!f.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = e => {
          next.push({name: f.name, dataUrl: e.target.result});
          if (next.length === Math.min(files.length, 4 - attachments.length)){
            setAttachments(a => [...a, ...next].slice(0,4));
          }
        };
        reader.readAsDataURL(f);
      });
    }

    function send(){
      if (disabled) return;
      const t = text.trim();
      if (!t && attachments.length === 0) return;
      onSend({text: t, attachments});
      setText('');
      setAttachments([]);
    }

    return (
      <div style={{
        background:P.panel, border:`1px solid ${P.borderSoft}`, borderRadius:14,
        padding:'10px 12px', boxShadow:'0 1px 2px rgba(0,0,0,.03)',
      }}>
        {attachments.length > 0 && (
          <div style={{display:'flex', gap:6, flexWrap:'wrap', marginBottom:8}}>
            {attachments.map((a,i) => (
              <div key={i} style={{position:'relative'}}>
                <img src={a.dataUrl} alt={a.name} style={{
                  width:56, height:56, objectFit:'cover', borderRadius:8,
                  border:`1px solid ${P.borderSoft}`,
                }}/>
                <button onClick={()=>setAttachments(arr=>arr.filter((_,j)=>j!==i))} style={{
                  position:'absolute', top:-4, right:-4, width:18, height:18,
                  borderRadius:'50%', border:`1px solid ${P.borderSoft}`,
                  background:P.panel, color:P.textDim, fontSize:10, cursor:'pointer',
                  display:'flex', alignItems:'center', justifyContent:'center',
                }}>×</button>
              </div>
            ))}
          </div>
        )}
        <textarea
          ref={taRef}
          value={text}
          onChange={e=>setText(e.target.value)}
          onKeyDown={e=>{
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
          }}
          placeholder="Ask anything — paste a check-in, attach a photo, or just type a question. ⌘↵ to send."
          rows={2}
          style={{
            width:'100%', resize:'none', border:'none', outline:'none',
            background:'transparent', color:P.text, fontFamily:'inherit',
            fontSize:14, lineHeight:1.5, padding:'4px 0', boxSizing:'border-box',
            maxHeight:240, overflowY:'auto',
          }}
        />
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:6}}>
          <div style={{display:'flex', gap:6}}>
            <input
              ref={fileRef}
              type="file"
              accept="image/*"
              multiple
              hidden
              onChange={e=>{ handleFiles(e.target.files); e.target.value=''; }}
            />
            <button onClick={()=>fileRef.current?.click()} disabled={attachments.length>=4}
              title={attachments.length>=4 ? 'Max 4 photos' : 'Attach photo'}
              style={{
                appearance:'none', background:'transparent', border:`1px solid ${P.borderSoft}`,
                borderRadius:7, padding:'5px 10px', cursor:attachments.length>=4?'not-allowed':'pointer',
                color:P.textDim, fontSize:12.5, fontFamily:'inherit',
                display:'flex', alignItems:'center', gap:6,
                opacity: attachments.length>=4 ? 0.5 : 1,
              }}>
              <Icon path={ICONS.paperclip} size={13}/> Photo
            </button>
          </div>
          <button onClick={send} disabled={disabled || (!text.trim() && attachments.length===0)}
            style={{
              appearance:'none', background: (disabled || (!text.trim() && attachments.length===0)) ? P.panel3 : P.text,
              color: (disabled || (!text.trim() && attachments.length===0)) ? P.textMuted : P.bg,
              border:'none', borderRadius:7, padding:'7px 14px',
              cursor:'pointer', fontFamily:'inherit', fontSize:13, fontWeight:600,
              display:'flex', alignItems:'center', gap:6,
            }}>
            <Icon path={ICONS.send} size={13}/> Send
          </button>
        </div>
      </div>
    );
  }

  // ──────────────────────────────────────────────────────────────────
  // Message bubble
  // ──────────────────────────────────────────────────────────────────
  function Message({m}){
    const isUser = m.role === 'user';
    return (
      <div style={{
        display:'flex', justifyContent:isUser?'flex-end':'flex-start',
        marginBottom:14,
      }}>
        <div style={{
          maxWidth: '78%',
          background: isUser ? P.text : P.panel,
          color: isUser ? P.bg : P.text,
          border: isUser ? 'none' : `1px solid ${P.borderSoft}`,
          borderRadius: 14,
          padding: '12px 14px',
          fontSize: 14,
          lineHeight: 1.55,
          whiteSpace: 'pre-wrap',
          wordBreak: 'break-word',
        }}>
          {m.attachments && m.attachments.length > 0 && (
            <div style={{display:'flex', gap:6, marginBottom: m.text ? 8 : 0, flexWrap:'wrap'}}>
              {m.attachments.map((a,i) => (
                <img key={i} src={a.dataUrl} alt={a.name} style={{
                  maxWidth: 200, maxHeight: 200, borderRadius: 8,
                  border: isUser ? '1px solid rgba(255,255,255,0.2)' : `1px solid ${P.borderSoft}`,
                }}/>
              ))}
            </div>
          )}
          {m.role === 'assistant' ? (
            <div>{renderMarkdown(m.text)}</div>
          ) : (
            <div>{m.text}</div>
          )}
        </div>
      </div>
    );
  }

  // ──────────────────────────────────────────────────────────────────
  // Main view
  // ──────────────────────────────────────────────────────────────────
  function CoachAssistant(){
    const [messages, setMessages] = useState(loadHistory());
    const [pending, setPending]   = useState(false);
    const [usage, setUsage]       = useState(loadUsage());
    const scrollRef = useRef(null);

    useEffect(() => { saveHistory(messages); }, [messages]);
    useEffect(() => {
      if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }, [messages, pending]);

    const capReached = usage >= PER_COACH_CAP;

    async function handleSend({text, attachments}){
      if (capReached) return;
      const userMsg = {role:'user', text, attachments, ts: Date.now()};
      setMessages(m => [...m, userMsg]);
      setPending(true);
      try {
        const res = await callBackendStub([...messages, userMsg], attachments);
        const asstMsg = {role:'assistant', text: res.reply, ts: Date.now()};
        setMessages(m => [...m, asstMsg]);
        const newUsage = usage + (res.cost_usd || 0);
        setUsage(newUsage);
        try { localStorage.setItem(TODAY_USAGE(COACH_ID), String(newUsage)); } catch {}
      } catch (e) {
        setMessages(m => [...m, {role:'assistant', text: `_Error reaching the assistant: ${e.message}_`, ts: Date.now()}]);
      } finally {
        setPending(false);
      }
    }

    function clearChat(){
      if (!messages.length) return;
      if (!confirm('Clear this conversation? Coaches start fresh — usage cap is unaffected.')) return;
      setMessages([]);
    }

    function loadExample(prompt){
      handleSend({text: prompt, attachments: []});
    }

    return (
      <div style={{flex:1, display:'flex', flexDirection:'column', minWidth:0, background:P.bg}}>
        {/* Header */}
        <div style={{
          padding:'18px 28px 14px', borderBottom:`1px solid ${P.borderSoft}`,
          display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:16,
        }}>
          <div>
            <div className="display" style={{fontSize:24, color:P.text, marginBottom:4}}>Coach Assistant</div>
            <div style={{fontSize:13, color:P.textMuted}}>
              Ask coaching questions, paste check-ins for review, or draft replies. Trained on the DP Academy + Daniel's Looms.
            </div>
          </div>
          <div style={{display:'flex', alignItems:'center', gap:14}}>
            <div style={{
              fontSize:11, color:capReached?'#c1432a':P.textMuted,
              fontWeight:capReached?600:500, textAlign:'right',
            }}>
              <div style={{textTransform:'uppercase', letterSpacing:'.08em', fontSize:10}}>Today</div>
              <div style={{fontSize:13, color:capReached?'#c1432a':P.text, fontWeight:600}}>
                ${usage.toFixed(2)} / ${PER_COACH_CAP.toFixed(2)}
              </div>
            </div>
            <button onClick={clearChat} disabled={!messages.length} style={{
              appearance:'none', background:'transparent', border:`1px solid ${P.borderSoft}`,
              borderRadius:7, padding:'6px 12px',
              cursor: messages.length ? 'pointer' : 'not-allowed',
              color:P.textDim, fontFamily:'inherit', fontSize:12.5,
              opacity: messages.length ? 1 : 0.5,
            }}>Clear chat</button>
          </div>
        </div>

        {/* Cap warning banner */}
        {capReached && (
          <div style={{
            padding:'10px 28px', background:'#fef3c7', color:'#92400e',
            fontSize:13, borderBottom:`1px solid ${P.borderSoft}`,
          }}>
            You've reached your $10 daily cap for the assistant. Resets at midnight UTC.
          </div>
        )}

        {/* Messages area */}
        <div ref={scrollRef} style={{
          flex:1, overflowY:'auto', padding:'24px 28px',
        }}>
          {messages.length === 0 ? (
            <div style={{maxWidth:680, margin:'40px auto 0'}}>
              <div className="display" style={{fontSize:20, color:P.text, marginBottom:8}}>
                Try one of these to start
              </div>
              <div style={{fontSize:13, color:P.textMuted, marginBottom:16}}>
                Or just type your own question below. The assistant has the full Academy in context — Module 1 (Philosophy) through Module 6 (Female Physiology), plus the Final Assessment material.
              </div>
              <div style={{display:'grid', gap:8}}>
                {EXAMPLE_PROMPTS.map((p,i) => (
                  <button key={i} onClick={()=>loadExample(p)} style={{
                    appearance:'none', textAlign:'left', cursor:'pointer',
                    background:P.panel, border:`1px solid ${P.borderSoft}`,
                    borderRadius:10, padding:'12px 14px', fontFamily:'inherit',
                    fontSize:13.5, color:P.text, lineHeight:1.5,
                  }}
                  onMouseEnter={e=>e.currentTarget.style.background=P.panel2}
                  onMouseLeave={e=>e.currentTarget.style.background=P.panel}
                  >{p}</button>
                ))}
              </div>
              <div style={{
                marginTop:24, padding:'12px 14px',
                background:P.panel2, border:`1px solid ${P.borderSoft}`, borderRadius:10,
                fontSize:12.5, color:P.textMuted, lineHeight:1.5,
              }}>
                <strong style={{color:P.textDim}}>Read-only.</strong> The assistant only writes text replies. It can't change client records, edit the portal, send messages on your behalf, or take any other action. You read what it says and decide what to use.
              </div>
            </div>
          ) : (
            <div style={{maxWidth:780, margin:'0 auto'}}>
              {messages.map((m,i) => <Message key={i} m={m}/>)}
              {pending && (
                <div style={{display:'flex', justifyContent:'flex-start', marginBottom:14}}>
                  <div style={{
                    background:P.panel, border:`1px solid ${P.borderSoft}`,
                    borderRadius:14, padding:'12px 14px',
                    fontSize:13, color:P.textMuted, fontStyle:'italic',
                  }}>Thinking…</div>
                </div>
              )}
            </div>
          )}
        </div>

        {/* Composer */}
        <div style={{padding:'14px 28px 22px', borderTop:`1px solid ${P.borderSoft}`}}>
          <div style={{maxWidth:780, margin:'0 auto'}}>
            <Composer onSend={handleSend} disabled={pending || capReached}/>
            <div style={{fontSize:11, color:P.textMuted, marginTop:8, textAlign:'center'}}>
              Coach Assistant doesn't replace coach judgment — it surfaces what the Academy + Looms would say. Always check before sending to clients.
            </div>
          </div>
        </div>
      </div>
    );
  }

  window.CoachAssistant = CoachAssistant;
})();

</script>
<script type="text/babel" data-source="view-settings.jsx">

          <div style={{width:28,height:28,borderRadius:7,background:P.accentSoft,color:P.accent,display:'flex',alignItems:'center',justifyContent:'center'}}>

        {children}
      </div>
    );
  }

  const Input = ({value, onChange, type='text', placeholder, width}) => (
    <input type={type} value={value||''} onChange={e=>onChange&&onChange(e.target.value)} placeholder={placeholder}
      style={{
        appearance:'none',border:`1px solid ${P.border}`,background:P.panel,color:P.text,
        borderRadius:8,padding:'8px 12px',fontSize:13,fontFamily:'inherit',
        width: width||'100%',maxWidth:380,outline:'none',
      }}
      onFocus={e=>{e.currentTarget.style.borderColor=P.accent;}}
      onBlur={e=>{e.currentTarget.style.borderColor=P.border;}}

  );

  const Toggle = ({on, onChange}) => (
    <button onClick={()=>onChange(!on)} style={{
      width:36,height:20,borderRadius:100,border:'none',cursor:'pointer',
      background: on?P.accent:P.border,
      position:'relative',transition:'background .18s',padding:0,
    }}>
      <span style={{
        position:'absolute',top:2,left: on?18:2,width:16,height:16,borderRadius:'50%',
        background:'#fff',transition:'left .18s',boxShadow:'0 1px 3px rgba(0,0,0,.2)',
      }}/>
    </button>
  );

  const Segment = ({value, options, onChange}) => (
    <div style={{display:'inline-flex',background:P.panel3,border:`1px solid ${P.borderSoft}`,borderRadius:8,padding:3,gap:2}}>
      {options.map(o=>{
        const on = o.value===value;
        return (
          <button key={o.value} onClick={()=>onChange(o.value)} style={{
            appearance:'none',border:'none',cursor:'pointer',fontFamily:'inherit',
            padding:'6px 14px',borderRadius:6,
            background: on?P.panel:'transparent',
            color: on?P.text:P.textDim, fontSize:12.5, fontWeight:on?600:500,
            display:'flex',alignItems:'center',gap:6,
            boxShadow: on?`0 1px 2px rgba(0,0,0,${window.__currentTheme==='dark'?.3:.05})`:'none',
          }}>
            {o.icon && <Icon d={ICONS[o.icon]} size={12}/>}
            {o.label}
          </button>
        );
      })}
    </div>
  );

  const SWATCHES = [
    ['#16a34a','Green'],
    ['#4f46e5','Indigo'],
    ['#0891b2','Teal'],
    ['#d97706','Amber'],
    ['#db2777','Pink'],
    ['#1a1a1f','Graphite'],
  ];

  function Settings({theme, onToggleTheme, accent, setAccent, density, setDensity, clientsView, setClientsView}){
    const [profile, setProfile] = React.useState({
      firstName:'Daniel', lastName:'P.', email:'daniel@dpperformance.com', phone:'+61 433 221 088',
      title:'Head Coach', bio:'Online coach · 8 years · 60+ active clients',
      timezone:'Australia/Sydney',
    });
    const setP = (k,v)=>setProfile(p=>({...p,[k]:v}));
    const [notifs, setNotifs] = React.useState({
      checkin: true, missed: true, ghost: true, payReminder: true,
      weeklyDigest: true, auditAssigned: true, newResource: false, marketing: false,
    });
    const setN = (k,v)=>setNotifs(n=>({...n,[k]:v}));
    const [prefs, setPrefs] = React.useState({
      firstDay:'Monday', timeFormat:'24h', defaultTab:'clients',
      autoArchiveAfter:30, requireTransPhoto:false, defaultPlan:'Weekly',
    });
    const setPr = (k,v)=>setPrefs(p=>({...p,[k]:v}));

    return (
      <div style={{flex:1,padding:'32px 40px',overflowY:'auto'}}>
        {/* Header */}
        <div style={{marginBottom:24,maxWidth:900}}>
          <div style={{fontSize:12,color:P.textMuted,letterSpacing:'.08em',textTransform:'uppercase',fontWeight:600,marginBottom:6}}>Account</div>
          <div className="display" style={{fontSize:34,color:P.text}}>Settings</div>
          <div style={{fontSize:13,color:P.textDim,marginTop:6}}>Manage your profile, appearance, notifications, and coaching preferences.</div>
        </div>

        <div style={{maxWidth:900}}>

          {/* Profile */}
          <Section title="Profile" icon="user">
            <Row label="Name" hint="Shown to clients in messages and check-in replies.">
              <div style={{display:'flex',gap:10}}>
                <Input value={profile.firstName} onChange={v=>setP('firstName',v)} placeholder="First" width={170}/>
                <Input value={profile.lastName} onChange={v=>setP('lastName',v)} placeholder="Last" width={170}/>
              </div>
            </Row>
            <Row label="Role"><Input value={profile.title} onChange={v=>setP('title',v)} width={260}/></Row>
            <Row label="Email"><Input value={profile.email} onChange={v=>setP('email',v)} type="email"/></Row>
            <Row label="Phone"><Input value={profile.phone} onChange={v=>setP('phone',v)}/></Row>
            <Row label="Bio" hint="Appears on your public coach page.">
              <textarea value={profile.bio} onChange={e=>setP('bio',e.target.value)} rows={3}
                style={{width:'100%',maxWidth:480,border:`1px solid ${P.border}`,borderRadius:8,background:P.panel,color:P.text,padding:'8px 12px',fontSize:13,fontFamily:'inherit',resize:'vertical',outline:'none'}}/>
            </Row>
            <Row label="Timezone">
              <select value={profile.timezone} onChange={e=>setP('timezone',e.target.value)}
                style={{border:`1px solid ${P.border}`,background:P.panel,color:P.text,borderRadius:8,padding:'8px 12px',fontSize:13,fontFamily:'inherit',outline:'none'}}>
                <option>Australia/Sydney</option>
                <option>Australia/Melbourne</option>
                <option>Australia/Perth</option>
                <option>Pacific/Auckland</option>
                <option>Europe/London</option>
                <option>America/New_York</option>
              </select>
            </Row>
          </Section>

          {/* Appearance */}
          <Section title="Appearance" icon="sun">
            <Row label="Theme" hint="Dark mode tones down the whole interface for late-night coaching.">
              <Segment value={theme} onChange={onToggleTheme} options={[
                {value:'light',label:'Light',icon:'sun'},
                {value:'dark',label:'Dark',icon:'moon'},
              ]}/>
            </Row>
            <Row label="Accent color" hint="Used for active states, primary buttons, charts.">
              <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                {SWATCHES.map(([c,n])=>(
                  <button key={c} onClick={()=>setAccent(c)} title={n} style={{
                    width:28,height:28,borderRadius:8,border: accent===c?`2px solid ${P.text}`:`1px solid ${P.border}`,
                    background:c,cursor:'pointer',padding:0,
                    boxShadow: accent===c?`0 0 0 3px ${P.panel3}`:'none',
                  }}/>
                ))}
                <input type="color" value={accent} onChange={e=>setAccent(e.target.value)}
                  style={{width:32,height:32,border:`1px solid ${P.border}`,borderRadius:8,cursor:'pointer',background:'transparent',padding:2,marginLeft:4}}/>
                <span style={{fontSize:11.5,color:P.textDim,fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace'}}>{accent}</span>
              </div>
            </Row>
            <Row label="Client list view">
              <Segment value={clientsView} onChange={setClientsView} options={[
                {value:'list',label:'List'},{value:'cards',label:'Cards'},

            </Row>
            <Row label="Row density">
              <Segment value={density} onChange={setDensity} options={[

              ['payReminder','Pay cycle reminders','Heads-up the day before each payday.'],
              ['weeklyDigest','Weekly digest email','Monday summary — pay, retention, audits.'],
              ['auditAssigned','Audit assigned to me','When the head coach requests a review.'],
              ['newResource','New team resource','New SOPs, policies, or videos shared.'],

                <option value="checkins">Check-In Log</option>
                <option value="clients">My Clients</option>
              </select>
            </Row>
            <Row label="Default plan for new clients">
              <Segment value={prefs.defaultPlan} onChange={v=>setPr('defaultPlan',v)} options={[
                {value:'Weekly',label:'Weekly'},{value:'Fortnight',label:'Fortnight'},
              ]}/>
            </Row>
            <Row label="Require transformation photo" hint="Block submission until a progress photo is attached.">
              <Toggle on={prefs.requireTransPhoto} onChange={v=>setPr('requireTransPhoto',v)}/>
            </Row>
            <Row label="Auto-archive paused clients" hint={`Archive after ${prefs.autoArchiveAfter} days of no activity.`}>
              <input type="range" min={7} max={90} step={1} value={prefs.autoArchiveAfter} onChange={e=>setPr('autoArchiveAfter',+e.target.value)}
                style={{width:220,accentColor:P.accent}}/>

              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <span style={{fontSize:12,padding:'3px 9px',borderRadius:100,background:P.warnSoft,color:P.warn,fontWeight:600}}>Off</span>
                <button style={btn(P,true)}>Enable 2FA</button>
              </div>
            </Row>
            <Row label="Export data" hint="Download all clients, check-ins, and pay history as CSV.">
              <button style={btn(P)}><Icon d={ICONS.download} size={12}/>&nbsp;&nbsp;Export all data</button>
            </Row>
            <Row label="Delete account" hint="This cannot be undone. All client data will be permanently removed.">
              <button style={{...btn(P),color:P.danger,borderColor:P.danger}}>Delete my account</button>
            </Row>
          </Section>

          {/* Footer / save */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'18px 4px 40px'}}>
            <div style={{fontSize:11.5,color:P.textMuted}}>v1.4.2 · last synced just now</div>
            <div style={{display:'flex',gap:10}}>
              <button style={btn(P)}>Discard</button>
              <button style={{...btn(P,true),background:P.accentSolid,color:'#fff',borderColor:P.accentSolid}}>Save changes</button>
            </div>
          </div>

        </div>
      </div>
    );
  }

  function btn(P, primary){
    return {

// ────────────────────────────────────────────────
// Top bar
// ────────────────────────────────────────────────
function TopBar({onAddClient, onOpenClient}) {
  const [q, setQ] = React.useState('');
  const [open, setOpen] = React.useState(false);
  const inputRef = React.useRef(null);
  const wrapRef = React.useRef(null);

  // Cmd+K / Ctrl+K → focus
  React.useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (inputRef.current) inputRef.current.focus();
        setOpen(true);
      }
      if (e.key === 'Escape') setOpen(false);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  // Click-outside
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);

  const allClients = (window.clients || window.SHARED_CLIENTS || []);
  const matches = q.trim()
    ? allClients.filter(c => c.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8)
    : [];

  const pickClient = (cl) => {
    setOpen(false);
    setQ('');
    if (onOpenClient) onOpenClient(cl);
    else if (window.dispatchEvent) window.dispatchEvent(new CustomEvent('dp:open-client', {detail: cl}));
  };

  return (
    <div style={{height:58,flexShrink:0,borderBottom:`1px solid ${P.borderSoft}`,display:'flex',alignItems:'center',padding:'0 28px',gap:16,background:P.panel,position:'relative',zIndex:20}}>

          <span style={{color:P.textMuted,display:'flex'}}><Icon d={ICONS.search} size={15}/></span>
          <input
            ref={inputRef}
            value={q}
            onChange={e=>{ setQ(e.target.value); setOpen(true); }}
            onFocus={()=>setOpen(true)}
            placeholder="Search clients…"
            style={{border:'none',outline:'none',background:'transparent',flex:1,fontSize:13,fontFamily:'inherit',color:P.text}}
          />
          <span style={{marginLeft:'auto',fontSize:10.5,color:P.textMuted,fontFamily:'ui-monospace,monospace',padding:'2px 6px',background:P.panel,border:`1px solid ${P.borderSoft}`,borderRadius:4}}>⌘K</span>
        </div>
        {open && q.trim() && (
          <div style={{
            position:'absolute',top:'calc(100% + 6px)',left:0,right:0,zIndex:1000,
            background:P.panel,border:`1px solid ${P.border}`,borderRadius:10,
            boxShadow:'0 12px 28px rgba(0,0,0,.14)',
            padding:4,maxHeight:340,overflowY:'auto',
          }}>
            {matches.length === 0 ? (
              <div style={{padding:'14px 12px',fontSize:12.5,color:P.textMuted}}>No matches for "{q}"</div>
            ) : matches.map(cl => (
              <button key={cl.name} onClick={()=>pickClient(cl)} style={{
                appearance:'none',border:'none',cursor:'pointer',fontFamily:'inherit',
                display:'flex',alignItems:'center',gap:10,width:'100%',
                padding:'8px 10px',borderRadius:6,textAlign:'left',
                background:'transparent',
              }}
              onMouseEnter={e=>e.currentTarget.style.background=P.panel3}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <Avatar name={cl.name} size={26}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:500,color:P.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{cl.name}</div>

                </div>
                <Pill status={cl.status} small/>

        onClick={()=>window.open('https://www.loom.com/', '_blank', 'noopener')}
        style={{display:'flex',alignItems:'center',gap:7,background:'transparent',border:`1px solid ${P.border}`,color:P.text,fontSize:12.5,fontWeight:500,padding:'7px 13px',borderRadius:8,cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit'}}

      <div style={{color:P.textDim,cursor:'pointer',display:'flex',position:'relative'}}>
        <Icon d={ICONS.bell} size={18}/>
        <span style={{position:'absolute',top:-2,right:-2,width:7,height:7,borderRadius:'50%',background:P.danger,border:`1.5px solid ${P.panel}`}}/>
      </div>
    </div>
  );
}
